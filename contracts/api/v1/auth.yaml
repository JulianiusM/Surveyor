# Identity transitions deliberately return their new captured context. All commands require
# the prior context and CSRF token; account controllers retain credential and ownership checks.
# Native password forms and controllers have no maximum length. Preserve their accepted
# input rather than introducing a credential limit through the generated transport schema.
# Registration/reset minima explicitly count native DOM/JavaScript UTF-16 units. Standard
# JSON Schema string lengths elsewhere retain their existing Unicode code-point semantics.
schemas:
  FrontendReturn:
    type: string
    maxLength: 2048
  LoginInput:
    type: "object"
    additionalProperties: false
    required:
      - "username"
      - "password"
    properties:
      next:
        "$ref": "./openapi.yaml#/components/schemas/FrontendReturn"
      username:
        type: "string"
        minLength: 1
        maxLength: 100
      password:
        type: "string"
        minLength: 1
  RegistrationInput:
    type: "object"
    additionalProperties: false
    required:
      - "username"
      - "displayname"
      - "email"
      - "password"
      - "password_repeat"
    properties:
      next:
        "$ref": "./openapi.yaml#/components/schemas/FrontendReturn"
      username:
        type: "string"
        minLength: 1
        maxLength: 100
      displayname:
        type: "string"
        minLength: 1
        maxLength: 100
      email:
        type: "string"
        format: "email"
        maxLength: 100
      password:
        type: "string"
        x-surveyor-min-length-utf16: 8
      password_repeat:
        type: "string"
        x-surveyor-min-length-utf16: 8
  UsernameInput:
    type: "object"
    additionalProperties: false
    required:
      - "username"
    properties:
      next:
        "$ref": "./openapi.yaml#/components/schemas/FrontendReturn"
      username:
        type: "string"
        minLength: 1
  EmailInput:
    type: "object"
    additionalProperties: false
    required:
      - "email"
    properties:
      next:
        "$ref": "./openapi.yaml#/components/schemas/FrontendReturn"
      email:
        type: "string"
        format: "email"
  GuestEmailLookupInput:
    description: Guest registration's lookup retains its native email field bound; standalone recovery has no maximum.
    allOf:
      - "$ref": "#/schemas/EmailInput"
      - type: "object"
        properties:
          email:
            type: "string"
            maxLength: 100
  PasswordResetCheck:
    type: object
    additionalProperties: false
    required: [valid]
    properties:
      valid: {type: boolean, const: true}
  ResetInput:
    type: "object"
    additionalProperties: false
    required:
      - "token"
      - "password"
      - "confirmPassword"
    properties:
      token:
        type: "string"
        minLength: 1
        maxLength: 256
      password:
        type: "string"
        x-surveyor-min-length-utf16: 8
      confirmPassword:
        type: "string"
        x-surveyor-min-length-utf16: 8
  TokenInput:
    type: "object"
    additionalProperties: false
    required:
      - "token"
    properties:
      token:
        type: "string"
        minLength: 1
        maxLength: 256
  GuestLoginInput:
    type: "object"
    additionalProperties: false
    required:
      - "guestId"
      - "token"
    properties:
      guestId:
        "$ref": "./common.yaml#/schemas/Uuid"
      token:
        type: "string"
        minLength: 1
        maxLength: 256
  ProfileSwitchInput:
    type: "object"
    additionalProperties: false
    required:
      - "profileId"
    properties:
      profileId:
        "$ref": "./common.yaml#/schemas/Uuid"
  GuestRegistrationInput:
    type: "object"
    additionalProperties: false
    required:
      - "username"
      - "email"
    properties:
      username:
        type: "string"
        minLength: 1
        maxLength: 100
      email:
        type:
          - "string"
          - "null"
        format: "email"
        maxLength: 100
  GuestEntry:
    type: "object"
    additionalProperties: false
    required:
      - "id"
      - "title"
    properties:
      id:
        "$ref": "./common.yaml#/schemas/Uuid"
      title:
        type: "string"
  GuestEmailExists:
    type: "object"
    additionalProperties: false
    required:
      - "exists"
    properties:
      exists:
        type: "boolean"
  EmailDelivery:
    description: SMTP acceptance is distinct from committed registration and does not guarantee inbox delivery.
    type: string
    enum: [not-requested, sent, failed]
  RegistrationResult:
    type: object
    additionalProperties: false
    required: [changed]
    properties:
      changed:
        "$ref": ./packing.yaml#/schemas/MutationResult/properties/changed
      emailDelivery:
        "$ref": '#/schemas/EmailDelivery'
  IdentityResult:
    type: "object"
    additionalProperties: false
    required:
      - "session"
      - "personalLink"
      - "redirect"
    properties:
      session:
        "$ref": "./openapi.yaml#/components/schemas/SessionView"
      personalLink:
        type:
          - "string"
          - "null"
      redirect:
        type:
          - "string"
          - "null"
      emailDelivery:
        description: Guest registration is committed independently of recovery-mail delivery; a failed delivery retains the confirmed personal link.
        "$ref": '#/schemas/EmailDelivery'
paths:
  "/auth/login":
    post:
      operationId: "loginIdentity"
      x-surveyor-command: {retryPolicy: reconcile-only, precondition: none}
      summary: "login Identity"
      security: []
      parameters:
        - {"$ref":"./openapi.yaml#/components/parameters/Context"}
        - {"$ref":"./openapi.yaml#/components/parameters/Locale"}
        - {"$ref":"./openapi.yaml#/components/parameters/Csrf"}
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "./openapi.yaml#/components/schemas/LoginInput"
      responses:
        "200":
          description: "Confirmed operation result"
          headers:
            "X-Surveyor-Context":
              schema:
                type: "string"
          content:
            "application/json":
              schema:
                "$ref": "./openapi.yaml#/components/schemas/IdentityResult"
        default:
          "$ref": "./openapi.yaml#/components/responses/Problem"
  "/auth/logout":
