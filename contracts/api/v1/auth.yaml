# Identity transitions deliberately return their new captured context. All commands require
# the prior context and CSRF token; account controllers retain credential and ownership checks.
# One new-password policy serves registration/reset and generated runtime guidance.
# Existing-password login keeps its separate admission and exact credential handling.
schemas:
  NewPassword:
    description: New credentials count Unicode code points and reject bcrypt truncation; no composition, trimming or normalization.
    type: string
    minLength: 15
    x-surveyor-max-utf8-bytes: 72
  IdentityName:
    description: Account, guest and profile names retain their exact entered spelling within the shared Unicode code-point storage bound.
    type: string
    minLength: 1
    maxLength: 50
  LocalRegistrationName:
    $ref: '#/schemas/IdentityName'
  ProfileWorkflowEntry:
    type: object
    additionalProperties: false
    required: [entry]
    properties:
      entry: {$ref: './common.yaml#/schemas/PageEntryOutcome'}
  ProfileMigrationToken:
    type: object
    additionalProperties: false
    required: [token]
    properties:
      token: {type: string, minLength: 1}
  ProfileWorkflowCompletion:
    type: object
    additionalProperties: false
    required: [resultingContext, destination, notice, redirect]
    properties:
      resultingContext: {type: [string, 'null']}
      destination: {type: string}
      notice:
        anyOf:
          - {$ref: './common.yaml#/schemas/EntryNotice'}
          - {type: 'null'}
      redirect: {type: [string, 'null']}
  ProfileDeactivationInput:
    type: object
    additionalProperties: false
    required: [name]
    properties:
      name: {type: string, minLength: 1}
  AccountDeletionInput:
    type: object
    additionalProperties: false
    required: [username]
    properties:
      username: {type: string, minLength: 1}
  FrontendReturn:
    type: string
    maxLength: 2048
  LoginInput:
    type: "object"
    additionalProperties: false
    required:
      - "username"
      - "password"
    properties:
      next:
        "$ref": "./auth.yaml#/schemas/FrontendReturn"
      username:
        type: "string"
        minLength: 1
        maxLength: 100
      password:
        type: "string"
        minLength: 1
  RegistrationInput:
    type: "object"
    additionalProperties: false
    required:
      - "username"
      - "displayname"
      - "email"
      - "password"
      - "password_repeat"
    properties:
      next:
        "$ref": "./auth.yaml#/schemas/FrontendReturn"
      username:
        $ref: '#/schemas/LocalRegistrationName'
      displayname:
        $ref: '#/schemas/LocalRegistrationName'
      email:
        type: "string"
        format: "email"
        maxLength: 100
      password:
        $ref: '#/schemas/NewPassword'
      password_repeat:
        $ref: '#/schemas/NewPassword'
  UsernameInput:
    type: "object"
    additionalProperties: false
    required:
      - "username"
    properties:
      next:
        "$ref": "./auth.yaml#/schemas/FrontendReturn"
      username:
        type: "string"
        minLength: 1
  EmailInput:
    type: "object"
    additionalProperties: false
    required:
      - "email"
    properties:
      next:
        "$ref": "./auth.yaml#/schemas/FrontendReturn"
      email:
        type: "string"
        format: "email"
  GuestEmailLookupInput:
    description: Guest registration's lookup retains its email field bound; standalone recovery has no maximum.
    allOf:
      - "$ref": "#/schemas/EmailInput"
      - type: "object"
        properties:
          email:
            type: "string"
            maxLength: 100
  PasswordResetCheck:
    type: object
    additionalProperties: false
    required: [valid]
    properties:
      valid: {type: boolean, const: true}
  ResetInput:
    type: "object"
    additionalProperties: false
    required:
      - "token"
      - "password"
      - "confirmPassword"
    properties:
      token:
        type: "string"
        minLength: 1
        maxLength: 256
      password:
        $ref: '#/schemas/NewPassword'
      confirmPassword:
        $ref: '#/schemas/NewPassword'
  TokenInput:
    type: "object"
    additionalProperties: false
    required:
      - "token"
    properties:
      token:
        type: "string"
        minLength: 1
        maxLength: 256
  GuestLoginInput:
    type: "object"
    additionalProperties: false
    required:
      - "guestId"
      - "token"
    properties:
      guestId:
        "$ref": "./common.yaml#/schemas/Uuid"
      token:
        type: "string"
        minLength: 1
        maxLength: 256
  ProfileSwitchInput:
    type: "object"
    additionalProperties: false
    required:
      - "profileId"
    properties:
      profileId:
        "$ref": "./common.yaml#/schemas/Uuid"
  GuestRegistrationInput:
    type: "object"
    additionalProperties: false
    required:
      - "username"
      - "email"
    properties:
      username:
        $ref: '#/schemas/IdentityName'
      email:
        type:
          - "string"
          - "null"
        format: "email"
        maxLength: 100
  GuestEntry:
    type: "object"
    additionalProperties: false
    required:
      - "id"
      - "title"
    properties:
      id:
        "$ref": "./common.yaml#/schemas/Uuid"
      title:
        type: "string"
  GuestEmailExists:
    type: "object"
    additionalProperties: false
    required:
      - "exists"
    properties:
      exists:
        type: "boolean"
  EmailDelivery:
    description: SMTP acceptance is distinct from committed registration and does not guarantee inbox delivery.
    type: string
    enum: [not-requested, sent, failed]
  RegistrationResult:
    type: object
    additionalProperties: false
    required: [changed]
    properties:
      changed:
        "$ref": ./common.yaml#/schemas/MutationResult/properties/changed
      emailDelivery:
        "$ref": '#/schemas/EmailDelivery'
  IdentityResult:
    type: "object"
    additionalProperties: false
    required:
      - "session"
      - "personalLink"
      - "redirect"
    properties:
      providerLogout:
        description: Local sign-out is persisted; the provider logout could not be prepared or confirmed. Never replay the logout or restore the local identity.
        type: string
        enum: [unconfirmed]
      session:
        "$ref": "./session.yaml#/schemas/SessionView"
      personalLink:
        type:
          - "string"
          - "null"
      redirect:
        type:
          - "string"
          - "null"
      emailDelivery:
        description: Guest registration is committed independently of recovery-mail delivery; a failed delivery retains the confirmed personal link.
        "$ref": '#/schemas/EmailDelivery'
paths:
  /profiles/workflow-entry:
    get:
      operationId: getProfileWorkflowEntry
      x-surveyor-command: {retryPolicy: read, precondition: none}
      summary: Admit a profile workflow without issuing or consuming a capability
      security: []
      parameters:
        - {$ref: "./common.yaml#/parameters/Context"}
        - {$ref: "./common.yaml#/parameters/Locale"}
        - {name: kind, in: query, required: true, schema: {type: string, enum: [token, entry, deactivate, delete-account]}}
        - {name: returnTo, in: query, schema: {type: string, maxLength: 2048}}
      responses:
        '200':
          description: Server-owned workflow admission
          content:
            application/json:
              schema: {$ref: '#/schemas/ProfileWorkflowEntry'}
        default: {$ref: "./common.yaml#/responses/Problem"}
  /profiles/migration/token:
    post:
      operationId: requestProfileMigrationToken
      x-surveyor-command: {retryPolicy: reconcile-only, precondition: none}
      summary: Issue the active profile's existing migration token
      parameters: &workflowHeaders
        - {$ref: "./common.yaml#/parameters/Context"}
        - {$ref: "./common.yaml#/parameters/Locale"}
        - {$ref: "./common.yaml#/parameters/Csrf"}
      responses:
        '200':
          description: Private capability issued by the existing owner
          content:
            application/json:
              schema: {$ref: '#/schemas/ProfileMigrationToken'}
        default: {$ref: "./common.yaml#/responses/Problem"}
  /profiles/migration/execute:
    post:
      operationId: executeIdentityProfileMigration
      x-surveyor-command: {retryPolicy: reconcile-only, precondition: none}
      summary: Execute the existing profile transfer
      parameters: *workflowHeaders
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "./auth.yaml#/schemas/TokenInput"}
      responses: &workflowResponses
        '200':
          description: Existing workflow completed; identity display refresh is separate
          content:
            application/json:
              schema: {$ref: '#/schemas/ProfileWorkflowCompletion'}
        default: {$ref: "./common.yaml#/responses/Problem"}
  /profiles/current/deactivate:
    post:
      operationId: deactivateIdentityProfile
      x-surveyor-command: {retryPolicy: reconcile-only, precondition: none}
      summary: Deactivate the active profile through its existing completion order
      parameters: *workflowHeaders
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/schemas/ProfileDeactivationInput'}
      responses: *workflowResponses
  /account:
    delete:
      operationId: deleteIdentityAccount
      x-surveyor-command: {retryPolicy: reconcile-only, precondition: none}
      summary: Delete the current account through its existing completion owner
      parameters: *workflowHeaders
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/schemas/AccountDeletionInput'}
      responses: *workflowResponses
  "/auth/login":
    post:
      operationId: "loginIdentity"
      x-surveyor-command: {retryPolicy: reconcile-only, precondition: none}
      summary: "login Identity"
      security: []
      parameters:
        - {"$ref":"./common.yaml#/parameters/Context"}
        - {"$ref":"./common.yaml#/parameters/Locale"}
        - {"$ref":"./common.yaml#/parameters/Csrf"}
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "./auth.yaml#/schemas/LoginInput"
      responses:
        "200":
          description: "Confirmed operation result"
          headers:
            "X-Surveyor-Context":
              schema:
                type: "string"
          content:
            "application/json":
              schema:
                "$ref": "./auth.yaml#/schemas/IdentityResult"
        default:
          "$ref": "./common.yaml#/responses/Problem"
  "/auth/logout":
    post:
      operationId: "logoutIdentity"
      x-surveyor-command: {retryPolicy: reconcile-only, precondition: none}
      summary: "logout Identity"
      security: []
      parameters:
        - {"$ref":"./common.yaml#/parameters/Context"}
        - {"$ref":"./common.yaml#/parameters/Locale"}
        - {"$ref":"./common.yaml#/parameters/Csrf"}
      responses:
        "200":
          description: "Confirmed operation result"
          headers:
            "X-Surveyor-Context":
              schema:
                type: "string"
          content:
            "application/json":
              schema:
                "$ref": "./auth.yaml#/schemas/IdentityResult"
        default:
          "$ref": "./common.yaml#/responses/Problem"
  "/auth/register":
    post:
      operationId: "registerAccount"
      x-surveyor-command: {retryPolicy: reconcile-only, precondition: none}
      summary: "register Account"
      security: []
      parameters:
        - {"$ref":"./common.yaml#/parameters/Context"}
        - {"$ref":"./common.yaml#/parameters/Locale"}
        - {"$ref":"./common.yaml#/parameters/Csrf"}
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "./auth.yaml#/schemas/RegistrationInput"
      responses:
        "200":
          description: "Confirmed operation result"
          headers:
            "X-Surveyor-Context":
              schema:
                type: "string"
          content:
            "application/json":
              schema:
                "$ref": "./auth.yaml#/schemas/RegistrationResult"
        default:
          "$ref": "./common.yaml#/responses/Problem"
  "/auth/forgot-password":
    post:
      operationId: "requestPasswordReset"
      x-surveyor-command: {retryPolicy: reconcile-only, precondition: none}
      summary: "request Password Reset"
      security: []
      parameters:
        - {"$ref":"./common.yaml#/parameters/Context"}
        - {"$ref":"./common.yaml#/parameters/Locale"}
        - {"$ref":"./common.yaml#/parameters/Csrf"}
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "./auth.yaml#/schemas/UsernameInput"
      responses:
        "200":
          description: "Confirmed operation result"
          headers:
            "X-Surveyor-Context":
              schema:
                type: "string"
          content:
            "application/json":
              schema:
                "$ref": "./common.yaml#/schemas/MutationResult"
        default:
          "$ref": "./common.yaml#/responses/Problem"
  "/auth/reset-password":
    get:
      operationId: checkPasswordReset
      x-surveyor-command: {retryPolicy: read, precondition: none}
      summary: Check a recovery token before presenting the password form
      security: []
      parameters:
        - {$ref: "./common.yaml#/parameters/Context"}
        - {$ref: "./common.yaml#/parameters/Locale"}
        - name: token
          in: query
          required: true
          schema: {$ref: '#/schemas/TokenInput/properties/token'}
      responses:
        '200':
          description: The token is currently valid; submitting the new password checks it again.
          content:
            application/json:
              schema: {$ref: '#/schemas/PasswordResetCheck'}
        default: {$ref: "./common.yaml#/responses/Problem"}
    post:
      operationId: "resetAccountPassword"
      x-surveyor-command: {retryPolicy: reconcile-only, precondition: none}
      summary: "reset Account Password"
      security: []
      parameters:
        - {"$ref":"./common.yaml#/parameters/Context"}
        - {"$ref":"./common.yaml#/parameters/Locale"}
        - {"$ref":"./common.yaml#/parameters/Csrf"}
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "./auth.yaml#/schemas/ResetInput"
      responses:
        "200":
          description: "Confirmed operation result"
          headers:
            "X-Surveyor-Context":
              schema:
                type: "string"
          content:
            "application/json":
              schema:
                "$ref": "./common.yaml#/schemas/MutationResult"
        default:
          "$ref": "./common.yaml#/responses/Problem"
  "/auth/activate":
    post:
      operationId: "activateIdentity"
      x-surveyor-command: {retryPolicy: reconcile-only, precondition: none}
      summary: "activate Identity"
      security: []
      parameters:
        - {"$ref":"./common.yaml#/parameters/Context"}
        - {"$ref":"./common.yaml#/parameters/Locale"}
        - {"$ref":"./common.yaml#/parameters/Csrf"}
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "./auth.yaml#/schemas/TokenInput"
      responses:
        "200":
          description: "Confirmed operation result"
          headers:
            "X-Surveyor-Context":
              schema:
                type: "string"
          content:
            "application/json":
              schema:
                "$ref": "./common.yaml#/schemas/MutationResult"
        default:
          "$ref": "./common.yaml#/responses/Problem"
  "/auth/guest-login":
    post:
      operationId: "loginGuestIdentity"
      x-surveyor-command: {retryPolicy: reconcile-only, precondition: none}
      summary: "login Guest Identity"
      security: []
      parameters:
        - {"$ref":"./common.yaml#/parameters/Context"}
        - {"$ref":"./common.yaml#/parameters/Locale"}
        - {"$ref":"./common.yaml#/parameters/Csrf"}
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "./auth.yaml#/schemas/GuestLoginInput"
      responses:
        "200":
          description: "Confirmed operation result"
          headers:
            "X-Surveyor-Context":
              schema:
                type: "string"
          content:
            "application/json":
              schema:
                "$ref": "./auth.yaml#/schemas/IdentityResult"
        default:
          "$ref": "./common.yaml#/responses/Problem"
  "/auth/guest-recovery":
    post:
      operationId: "recoverGuestIdentity"
      x-surveyor-command: {retryPolicy: reconcile-only, precondition: none}
      summary: "recover Guest Identity"
      security: []
      parameters:
        - {"$ref":"./common.yaml#/parameters/Context"}
        - {"$ref":"./common.yaml#/parameters/Locale"}
        - {"$ref":"./common.yaml#/parameters/Csrf"}
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "./auth.yaml#/schemas/EmailInput"
      responses:
        "200":
          description: "Confirmed operation result"
          headers:
            "X-Surveyor-Context":
              schema:
                type: "string"
          content:
            "application/json":
              schema:
                "$ref": "./common.yaml#/schemas/MutationResult"
        default:
          "$ref": "./common.yaml#/responses/Problem"
  "/auth/guest-email-exists":
    post:
      operationId: "findGuestEmail"
      x-surveyor-command: {retryPolicy: reconcile-only, precondition: none}
      summary: "find Guest Email"
      security: []
      parameters:
        - {"$ref":"./common.yaml#/parameters/Context"}
        - {"$ref":"./common.yaml#/parameters/Locale"}
        - {"$ref":"./common.yaml#/parameters/Csrf"}
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "./auth.yaml#/schemas/GuestEmailLookupInput"
      responses:
        "200":
          description: "Confirmed operation result"
          headers:
            "X-Surveyor-Context":
              schema:
                type: "string"
          content:
            "application/json":
              schema:
                "$ref": "./auth.yaml#/schemas/GuestEmailExists"
        default:
          "$ref": "./common.yaml#/responses/Problem"
  "/auth/profile":
    put:
      operationId: "switchIdentityProfile"
      x-surveyor-command: {retryPolicy: reconcile-only, precondition: none}
      summary: "switch Identity Profile"
      security: []
      parameters:
        - {"$ref":"./common.yaml#/parameters/Context"}
        - {"$ref":"./common.yaml#/parameters/Locale"}
        - {"$ref":"./common.yaml#/parameters/Csrf"}
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "./auth.yaml#/schemas/ProfileSwitchInput"
      responses:
        "200":
          description: "Confirmed operation result"
          headers:
            "X-Surveyor-Context":
              schema:
                type: "string"
          content:
            "application/json":
              schema:
                "$ref": "./auth.yaml#/schemas/IdentityResult"
        default:
          "$ref": "./common.yaml#/responses/Problem"
  "/packing-lists/{listId}/guest":
    get:
      operationId: "getPackingGuestEntry"
      x-surveyor-command: {retryPolicy: read, precondition: none}
      summary: "get Packing Guest Entry"
      security: []
      parameters:
        - {"$ref":"./common.yaml#/parameters/Context"}
        - {"$ref":"./common.yaml#/parameters/Locale"}
        - {"$ref":"./common.yaml#/parameters/ListId"}
      responses:
        "200":
          description: "Confirmed operation result"
          headers:
            "X-Surveyor-Context":
              schema:
                type: "string"
          content:
            "application/json":
              schema:
                "$ref": "./auth.yaml#/schemas/GuestEntry"
        default:
          "$ref": "./common.yaml#/responses/Problem"
    post:
      operationId: "registerPackingGuest"
      x-surveyor-command: {retryPolicy: reconcile-only, precondition: none}
      summary: "register Packing Guest"
      security: []
      parameters:
        - {"$ref":"./common.yaml#/parameters/Context"}
        - {"$ref":"./common.yaml#/parameters/Locale"}
        - {"$ref":"./common.yaml#/parameters/Csrf"}
        - {"$ref":"./common.yaml#/parameters/ListId"}
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "./auth.yaml#/schemas/GuestRegistrationInput"
      responses:
        "200":
          description: "Confirmed operation result"
          headers:
            "X-Surveyor-Context":
              schema:
                type: "string"
          content:
            "application/json":
              schema:
                "$ref": "./auth.yaml#/schemas/IdentityResult"
        default:
          "$ref": "./common.yaml#/responses/Problem"
