schemas:
  FinanceMoney:
    description: Saved signed amount at the existing two-decimal persistence precision.
    type: string
    pattern: '^-?(?:0|[1-9][0-9]*)\.[0-9]{2}$'
  FinanceAmountInput:
    description: Decimal request spelling retains the existing operation-specific accepted precision; shared invoice validation owns sign, range and precision decisions.
    type: string
    pattern: '^-?(?:0|[1-9][0-9]*)(?:\.[0-9]+)?$'
  FinanceFactor:
    description: Canonical four-decimal share factor; existing invoice validation owns its range.
    type: string
    pattern: '^(?:0|[1-9][0-9]*)\.[0-9]{4}$'
  FinanceProof: {type: string, format: binary}
  FinanceView:
    type: object
    additionalProperties: false
    required: [audience, registrationId, pools, invoices, shares]
    properties:
      audience: {type: string, enum: [participant, organizer]}
      registrationId: {anyOf: [{$ref: "./common.yaml#/schemas/DecimalId"}, {type: 'null'}]}
      participants: {type: array, items: {$ref: '#/schemas/FinanceParticipant'}}
      pools: {type: array, items: {$ref: '#/schemas/FinancePool'}}
      invoices: {type: array, items: {$ref: '#/schemas/FinanceInvoice'}}
      shares: {type: array, items: {$ref: '#/schemas/FinanceShare'}}
  FinanceMetric:
    type: object
    additionalProperties: false
    required: [key, label, amount]
    properties:
      key: {type: string}
      label: {type: string}
      amount: {$ref: '#/schemas/FinanceMoney'}
  FinanceSummary:
    type: object
    additionalProperties: false
    required: [primary, details, saved]
    properties:
      primary: {type: array, items: {$ref: '#/schemas/FinanceMetric'}}
      details: {type: array, items: {$ref: '#/schemas/FinanceMetric'}}
      saved: {type: array, items: {$ref: '#/schemas/FinanceMetric'}}
  FinancePool:
    type: object
    additionalProperties: false
    required: [id, name, description, status, isDefault, needsRecalculation, hasPendingTakeovers, coverageKnown, coverageGroups, pendingCoverageGroups, assignedCount, assignAll, revision, canSubmit, summary, calculation, exampleCalculation]
    properties:
      id: {type: string, format: uuid}
      name: {type: string}
      description: {type: [string, 'null']}
      status: {type: string, enum: [OPEN, ORGANIZER_ONLY, CLOSED]}
      isDefault: {type: boolean}
      needsRecalculation: {type: boolean}
      hasPendingTakeovers: {type: boolean}
      coverageKnown: {type: boolean}
      coverageGroups: {type: array, items: {$ref: '#/schemas/FinanceCoverageGroup'}}
      pendingCoverageGroups: {type: array, items: {$ref: '#/schemas/FinanceCoverageGroup'}}
      assignedCount: {type: integer, minimum: 0}
      assignAll: {type: boolean}
      revision: {type: integer, minimum: 0}
      canSubmit: {type: boolean}
      settings: {anyOf: [{$ref: '#/schemas/FinancePoolSettings'}, {type: 'null'}]}
      canRollback: {type: boolean}
      registrationIds: {type: array, items: {$ref: "./common.yaml#/schemas/DecimalId"}}
      assignments: {type: array, items: {$ref: '#/schemas/FinanceAssignment'}}
      surcharges: {type: array, items: {$ref: '#/schemas/FinanceAdjustment'}}
      coverageChoices: {type: array, items: {$ref: '#/schemas/FinanceParticipant'}}
      currentCoverageGroups: {type: array, items: {$ref: '#/schemas/FinanceCoverageGroup'}}
      summary: {anyOf: [{$ref: '#/schemas/FinanceSummary'}, {type: 'null'}]}
      calculation: {anyOf: [{$ref: '#/schemas/FinanceCalculation'}, {type: 'null'}]}
      exampleCalculation: {anyOf: [{$ref: '#/schemas/FinanceCalculation'}, {type: 'null'}]}
  FinanceCoveragePerson:
    type: object
    additionalProperties: false
    required: [id, name]
    properties:
      id: {$ref: "./common.yaml#/schemas/DecimalId"}
      name: {type: string}
  FinanceCoverageGroup:
    type: object
    additionalProperties: false
    required: [payerId, payerName, beneficiaries]
    properties:
      payerId: {$ref: "./common.yaml#/schemas/DecimalId"}
      payerName: {type: string}
      beneficiaries: {type: array, items: {$ref: '#/schemas/FinanceCoveragePerson'}}
  FinanceInvoice:
    type: object
    additionalProperties: false
    required: [id, poolId, poolName, revision, status, amount, description, correctedAmount, correctedDescription, rejectionReason, createdAt, organizerRecorded, recordedByName, participantName, participantEmail, proofOriginalName, proofUrl, canRetract, canClose]
    properties:
      id: {$ref: "./common.yaml#/schemas/DecimalId"}
      poolId: {type: string, format: uuid}
      poolName: {type: string}
      revision: {type: integer, minimum: 0}
      status: {type: string, enum: [NEW, APPROVED, REJECTED, CLOSED, RETRACTED]}
      amount: {$ref: '#/schemas/FinanceMoney'}
      description: {type: [string, 'null']}
      correctedAmount: {anyOf: [{$ref: '#/schemas/FinanceMoney'}, {type: 'null'}]}
      correctedDescription: {type: [string, 'null']}
      rejectionReason: {type: [string, 'null']}
      createdAt: {type: [string, 'null'], format: date-time}
      organizerRecorded: {type: boolean}
      recordedByName: {type: [string, 'null']}
      participantName: {type: [string, 'null']}
      participantEmail: {type: [string, 'null']}
      proofOriginalName: {type: [string, 'null']}
      proofUrl: {type: [string, 'null']}
      canRetract: {type: boolean}
      canClose: {type: boolean}
  FinanceShareNotice:
    type: object
    additionalProperties: false
    required: [label, description]
    properties:
      label: {type: string}
      description: {type: string}
  FinanceShare:
    type: object
    additionalProperties: false
    required: [id, poolId, poolName, payerName, notes, needsRecalculation, amount, status, statusLabel, isPaid, caption, settledShareNotice, coveredNames, coverageKnown]
    properties:
      id: {$ref: "./common.yaml#/schemas/DecimalId"}
      poolId: {type: string, format: uuid}
      poolName: {type: string}
      payerName: {type: string}
      notes: {type: array, items: {type: string}}
      needsRecalculation: {type: boolean}
      amount: {$ref: '#/schemas/FinanceMoney'}
      status: {type: string, enum: [due, refund, settled]}
      statusLabel: {type: string}
      isPaid: {type: boolean}
      caption: {type: string}
      settledShareNotice: {anyOf: [{$ref: '#/schemas/FinanceShareNotice'}, {type: 'null'}]}
      coveredNames: {type: array, items: {type: string}}
      coverageKnown: {type: boolean}
  FinanceCalculationMetric:
    type: object
    additionalProperties: false
    required: [label, value]
    properties:
      label: {type: string}
      value: {type: string}
  FinanceCalculationTerm:
    type: object
    additionalProperties: false
    required: [label, value]
    properties:
      label: {type: string}
      value: {type: string}
      operator: {type: string, enum: ['+', '−', '×', '÷']}
  FinanceCalculationFormula:
    type: object
    additionalProperties: false
    required: [terms, result]
    properties:
      terms: {type: array, items: {$ref: '#/schemas/FinanceCalculationTerm'}}
      result: {$ref: '#/schemas/FinanceCalculationMetric'}
      note: {type: string}
  FinanceCalculationSection:
    type: object
    additionalProperties: false
    required: [key, title]
    properties:
      key: {type: string}
      title: {type: string}
      description: {type: string}
      items: {type: array, items: {type: string}}
      metrics: {type: array, items: {$ref: '#/schemas/FinanceCalculationMetric'}}
      formula: {$ref: '#/schemas/FinanceCalculationFormula'}
  FinanceCalculation:
    type: object
    additionalProperties: false
    required: [title, sections]
    properties:
      title: {type: string}
      description: {type: string}
      sections: {type: array, items: {$ref: '#/schemas/FinanceCalculationSection'}}
  FinanceBreakdown:
    type: object
    additionalProperties: false
    required: [components, calculation, notes, statusLabel, needsRecalculation, settledShareNotice]
    properties:
      components: {type: array, items: {$ref: '#/schemas/FinanceMetric'}}
      calculation: {$ref: '#/schemas/FinanceCalculation'}
      notes: {type: array, items: {type: string}}
      statusLabel: {type: string}
      needsRecalculation: {type: boolean}
      settledShareNotice: {anyOf: [{$ref: '#/schemas/FinanceShareNotice'}, {type: 'null'}]}
  FinanceInvoiceInput:
    type: object
    additionalProperties: false
    required: [amount]
    properties:
      amount: {$ref: '#/schemas/FinanceAmountInput'}
      description: {type: string}
  FinanceInvoiceForm:
    type: object
    additionalProperties: false
    required: [data, proof]
    properties:
      data: {$ref: '#/schemas/FinanceInvoiceInput'}
      proof: {type: string, format: binary}
  FinanceRetractionInput:
    type: object
    additionalProperties: false
    required: [confirmed, expectedRevision]
    properties:
      confirmed: {type: boolean, const: true}
      expectedRevision: {type: integer, minimum: 0}
  FinanceMutationResult:
    type: object
    additionalProperties: false
    required: [changed]
    properties:
      changed: {type: boolean, const: true}
  FinanceParticipant:
    type: object
    additionalProperties: false
    required: [id, name, email]
    properties:
      id: {$ref: "./common.yaml#/schemas/DecimalId"}
      name: {type: string}
      email: {type: [string, 'null']}
  FinancePoolSettings:
    type: object
    additionalProperties: false
    required: [distribution, subtractPersonalInvoices, sendCalculationEmails, roundUpShares]
    properties:
      distribution: {type: string, enum: [EQUAL, TIME_BASED, NIGHTS]}
      subtractPersonalInvoices: {type: boolean}
      sendCalculationEmails: {type: boolean}
      roundUpShares: {type: boolean}
  FinancePoolCreateInput:
    type: object
    additionalProperties: false
    required: [name, distribution, status, isDefault, assignAll, subtractPersonalInvoices, sendCalculationEmails, roundUpShares, registrations]
    properties:
      name: {type: string, minLength: 1, maxLength: 255}
      description: {type: string}
      distribution: {type: string, enum: [EQUAL, TIME_BASED, NIGHTS]}
      status: {type: string, enum: [OPEN, ORGANIZER_ONLY]}
      isDefault: {type: boolean}
      assignAll: {type: boolean}
      subtractPersonalInvoices: {type: boolean}
      sendCalculationEmails: {type: boolean}
      roundUpShares: {type: boolean}
      registrations: {type: array, uniqueItems: true, items: {$ref: "./common.yaml#/schemas/DecimalId"}}
  FinancePoolSettingsInput:
    type: object
    additionalProperties: false
    required: [distribution, description, sendCalculationEmails, roundUpShares]
    properties:
      distribution: {type: string, enum: [EQUAL, TIME_BASED, NIGHTS]}
      description: {type: string}
      sendCalculationEmails: {type: boolean}
      roundUpShares: {type: boolean}
  FinanceSubmissionStateInput:
    type: object
    additionalProperties: false
    required: [status, expectedRevision]
    properties:
      status: {type: string, enum: [OPEN, ORGANIZER_ONLY]}
      expectedRevision: {type: integer, minimum: 0}
  FinanceOrganizerInvoiceInput:
    type: object
    additionalProperties: false
    required: [amount, description]
    properties:
      amount: {$ref: '#/schemas/FinanceAmountInput'}
      description: {type: string, minLength: 1, maxLength: 4000}
      registrationId: {$ref: "./common.yaml#/schemas/DecimalId"}
  FinanceOrganizerInvoiceForm:
    type: object
    additionalProperties: false
    required: [data]
    properties:
      data: {$ref: '#/schemas/FinanceOrganizerInvoiceInput'}
      proof: {type: string, format: binary}
  FinanceAcceptanceInput:
    type: object
    additionalProperties: false
    properties:
      correctedAmount: {anyOf: [{$ref: '#/schemas/FinanceAmountInput'}, {type: 'null'}]}
      correctedDescription: {type: string, maxLength: 4000}
  FinanceDeclineInput:
    type: object
    additionalProperties: false
    required: [rejectionReason]
    properties:
      rejectionReason: {type: string, minLength: 1, maxLength: 4000}
  FinanceRevisionInput:
    type: object
    additionalProperties: false
    required: [confirmed, expectedRevision, correctedAmount, correctedDescription]
    properties:
      confirmed: {type: boolean, const: true}
      expectedRevision: {type: integer, minimum: 0}
      correctedAmount: {anyOf: [{$ref: '#/schemas/FinanceAmountInput'}, {type: 'null'}]}
      correctedDescription: {type: [string, 'null'], maxLength: 4000}
  FinanceAcceptedRejectionInput:
    type: object
    additionalProperties: false
    required: [confirmed, expectedRevision, rejectionReason]
    properties:
      confirmed: {type: boolean, const: true}
      expectedRevision: {type: integer, minimum: 0}
      rejectionReason: {type: string, minLength: 1, maxLength: 4000}
  FinanceAssignment:
    type: object
    additionalProperties: false
    required: [registrationId, factor, isExempt]
    properties:
      registrationId: {$ref: "./common.yaml#/schemas/DecimalId"}
      factor: {$ref: '#/schemas/FinanceFactor'}
      isExempt: {type: boolean}
  FinanceAdjustment:
    type: object
    additionalProperties: false
    required: [id, registrationId, amount, note, subtractFromPool]
    properties:
      id: {$ref: "./common.yaml#/schemas/DecimalId"}
      registrationId: {$ref: "./common.yaml#/schemas/DecimalId"}
      amount: {$ref: '#/schemas/FinanceMoney'}
      note: {type: string}
      subtractFromPool: {type: boolean}
  FinanceAssignmentsInput:
    type: object
    additionalProperties: false
    required: [isDefault, assignAll, subtractPersonalInvoices, registrations, exemptions, participantFactors]
    properties:
      isDefault: {type: boolean}
      assignAll: {type: boolean}
      subtractPersonalInvoices: {type: boolean}
      registrations: {type: array, uniqueItems: true, items: {$ref: "./common.yaml#/schemas/DecimalId"}}
      exemptions: {type: array, uniqueItems: true, items: {$ref: "./common.yaml#/schemas/DecimalId"}}
      participantFactors:
        type: object
        propertyNames: {pattern: '^[1-9][0-9]*$'}
        additionalProperties: {$ref: '#/schemas/FinanceFactor'}
  FinanceAdjustmentInput:
    type: object
    additionalProperties: false
    required: [registrationId, amount, note, subtractFromPool]
    properties:
      registrationId: {$ref: "./common.yaml#/schemas/DecimalId"}
      amount: {$ref: '#/schemas/FinanceAmountInput'}
      note: {type: string, minLength: 1, maxLength: 4000}
      subtractFromPool: {type: boolean}
  FinanceTakeoverInput:
    type: object
    additionalProperties: false
    required: [beneficiaries]
    properties:
      payerId: {$ref: "./common.yaml#/schemas/DecimalId"}
      beneficiaries: {type: array, uniqueItems: true, items: {$ref: "./common.yaml#/schemas/DecimalId"}}
  FinanceCalculationInput:
    type: object
    additionalProperties: false
    required: [expectedRevision, sendEmails]
    properties:
      expectedRevision: {type: integer, minimum: 0}
      sendEmails: {type: boolean}
  FinanceSettlementInput:
    type: object
    additionalProperties: false
    required: [isPaid]
    properties:
      isPaid: {type: boolean}
  FinanceRollbackResult:
    type: object
    additionalProperties: false
    required: [needsRecalculation, externalChanges]
    properties:
      needsRecalculation: {type: boolean}
      externalChanges: {type: boolean}
  FinanceNotificationResult:
    type: object
    additionalProperties: false
    required: [count]
    properties:
      count: {type: integer, minimum: 0}
  FinancePreviewShare:
    type: object
    additionalProperties: false
    required: [registrationId, payerName, baseShareAmount, extraAmount, invoiceCreditAmount, paymentCreditAmount, shareAmount, calculatedAmount, isPaid, notes, statusLabel]
    properties:
      registrationId: {$ref: "./common.yaml#/schemas/DecimalId"}
      payerName: {type: string}
      baseShareAmount: {$ref: '#/schemas/FinanceMoney'}
      extraAmount: {$ref: '#/schemas/FinanceMoney'}
      invoiceCreditAmount: {$ref: '#/schemas/FinanceMoney'}
      paymentCreditAmount: {$ref: '#/schemas/FinanceMoney'}
      shareAmount: {$ref: '#/schemas/FinanceMoney'}
      calculatedAmount: {$ref: '#/schemas/FinanceMoney'}
      isPaid: {type: boolean}
      notes: {type: array, items: {type: string}}
      statusLabel: {type: string}
  FinancePreviewTotals:
    type: object
    additionalProperties: false
    required: [invoiceAmount, redistributedAmount, distributableAmount, allocatedBaseAmount, roundingDifference, adjustmentAmount, grossAmount, invoiceCreditAmount, expectedNetAmount, calculatedAmount, paymentCreditAmount, outstandingAmount, creditAmount]
    properties:
      invoiceAmount: {$ref: '#/schemas/FinanceMoney'}
      redistributedAmount: {$ref: '#/schemas/FinanceMoney'}
      distributableAmount: {$ref: '#/schemas/FinanceMoney'}
      allocatedBaseAmount: {$ref: '#/schemas/FinanceMoney'}
      roundingDifference: {$ref: '#/schemas/FinanceMoney'}
      adjustmentAmount: {$ref: '#/schemas/FinanceMoney'}
      grossAmount: {$ref: '#/schemas/FinanceMoney'}
      invoiceCreditAmount: {$ref: '#/schemas/FinanceMoney'}
      expectedNetAmount: {$ref: '#/schemas/FinanceMoney'}
      calculatedAmount: {$ref: '#/schemas/FinanceMoney'}
      paymentCreditAmount: {$ref: '#/schemas/FinanceMoney'}
      outstandingAmount: {$ref: '#/schemas/FinanceMoney'}
      creditAmount: {$ref: '#/schemas/FinanceMoney'}
  FinancePreview:
    type: object
    additionalProperties: false
    required: [revision, roundUpShares, calculation, exampleCalculation, shares, totals, columns]
    properties:
      revision: {type: integer, minimum: 0}
      roundUpShares: {type: boolean}
      calculation: {$ref: '#/schemas/FinanceCalculation'}
      exampleCalculation: {$ref: '#/schemas/FinanceCalculation'}
      shares: {type: array, items: {$ref: '#/schemas/FinancePreviewShare'}}
      totals: {$ref: '#/schemas/FinancePreviewTotals'}
      columns: {type: array, items: {$ref: '#/schemas/FinancePreviewColumn'}}
  FinancePreviewColumn:
    type: object
    additionalProperties: false
    required: [key, label]
    properties:
      key: {type: string, enum: [baseShareAmount, extraAmount, invoiceCreditAmount, paymentCreditAmount, shareAmount]}
      label: {type: string}
paths:
  /events/{eventId}/finance/pools/{poolId}/preview:
    get:
      operationId: previewEventFinancePool
      security: []
      x-surveyor-command: {retryPolicy: read, precondition: none}
      summary: Review current saved calculation inputs through the existing management grant
      parameters: &financePreviewParameters
        - {$ref: "./common.yaml#/parameters/Context"}
        - {$ref: "./common.yaml#/parameters/Locale"}
        - {name: eventId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: poolId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Read-only reviewed allocation, content: {application/json: {schema: {$ref: '#/schemas/FinancePreview'}}}}
        default: {$ref: "./common.yaml#/responses/Problem"}
  /events/{eventId}/finance/pools/{poolId}/close:
    post:
      operationId: closeEventFinancePool
      security: []
      x-surveyor-command: {retryPolicy: reconcile-only, precondition: none}
      summary: Close and calculate the captured preview revision through the shared operation
      parameters: &financeCalculationParameters
        - {$ref: "./common.yaml#/parameters/Context"}
        - {$ref: "./common.yaml#/parameters/Locale"}
        - {$ref: "./common.yaml#/parameters/Csrf"}
        - {name: eventId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: poolId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/schemas/FinanceCalculationInput'}}}}
      responses:
        '200': {description: Saved calculation committed, content: {application/json: {schema: {$ref: '#/schemas/FinanceMutationResult'}}}}
        default: {$ref: "./common.yaml#/responses/Problem"}
  /events/{eventId}/finance/pools/{poolId}/recalculate:
    post:
      operationId: recalculateEventFinancePool
      security: []
      x-surveyor-command: {retryPolicy: reconcile-only, precondition: none}
      summary: Replace the reviewed saved calculation while carrying recorded transfers forward
      parameters: *financeCalculationParameters
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/schemas/FinanceCalculationInput'}}}}
      responses:
        '200': {description: Saved calculation replaced, content: {application/json: {schema: {$ref: '#/schemas/FinanceMutationResult'}}}}
        default: {$ref: "./common.yaml#/responses/Problem"}
  /events/{eventId}/finance/pools/{poolId}/rollback:
    post:
      operationId: rollbackEventFinancePool
      security: []
      x-surveyor-command: {retryPolicy: reconcile-only, precondition: none}
      summary: Restore local calculation inputs while preserving saved shares and transfers
      parameters: *financeCalculationParameters
      responses:
        '200': {description: Local inputs restored, content: {application/json: {schema: {$ref: '#/schemas/FinanceRollbackResult'}}}}
        default: {$ref: "./common.yaml#/responses/Problem"}
  /events/{eventId}/finance/pools/{poolId}/notify:
    post:
      operationId: notifyEventFinancePool
      security: []
      x-surveyor-command: {retryPolicy: reconcile-only, precondition: none}
      summary: Request existing settlement notices from the complete saved payer ledger
      parameters: *financeCalculationParameters
      responses:
        '200': {description: Delivery queued for reachable payers, content: {application/json: {schema: {$ref: '#/schemas/FinanceNotificationResult'}}}}
        default: {$ref: "./common.yaml#/responses/Problem"}
  /events/{eventId}/finance/pools/{poolId}/shares/{shareId}/settlement:
    post:
      operationId: settleEventFinanceShare
      security: []
      x-surveyor-command: {retryPolicy: reconcile-only, precondition: none}
      summary: Record or reverse the signed saved payment or refund status
      parameters:
        - {$ref: "./common.yaml#/parameters/Context"}
        - {$ref: "./common.yaml#/parameters/Locale"}
        - {$ref: "./common.yaml#/parameters/Csrf"}
        - {name: eventId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: poolId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: shareId, in: path, required: true, schema: {$ref: "./common.yaml#/schemas/DecimalId"}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/schemas/FinanceSettlementInput'}}}}
      responses:
        '200': {description: Settlement marker saved, content: {application/json: {schema: {$ref: '#/schemas/FinanceMutationResult'}}}}
        default: {$ref: "./common.yaml#/responses/Problem"}
  /events/{eventId}/finance/pools/{poolId}/assignments:
    post:
      operationId: updateEventFinanceAssignments
      security: []
      x-surveyor-command: {retryPolicy: reconcile-only, precondition: none}
      summary: Save enrollment factors and exemptions without replacing saved shares
      parameters:
        - {$ref: "./common.yaml#/parameters/Context"}
        - {$ref: "./common.yaml#/parameters/Locale"}
        - {$ref: "./common.yaml#/parameters/Csrf"}
        - {name: eventId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: poolId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/schemas/FinanceAssignmentsInput'}}}}
      responses:
        '200': {description: Assignment inputs saved, content: {application/json: {schema: {$ref: '#/schemas/FinanceMutationResult'}}}}
        default: {$ref: "./common.yaml#/responses/Problem"}
  /events/{eventId}/finance/pools/{poolId}/adjustments:
    post:
      operationId: addEventFinanceAdjustment
      security: []
      x-surveyor-command: {retryPolicy: reconcile-only, precondition: none}
      summary: Add a signed participant surcharge or rebate through its existing operation
      parameters: &financeInputCommandParameters
        - {$ref: "./common.yaml#/parameters/Context"}
        - {$ref: "./common.yaml#/parameters/Locale"}
        - {$ref: "./common.yaml#/parameters/Csrf"}
        - {name: eventId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: poolId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/schemas/FinanceAdjustmentInput'}}}}
      responses:
        '200': {description: Adjustment saved, content: {application/json: {schema: {$ref: '#/schemas/FinanceMutationResult'}}}}
        default: {$ref: "./common.yaml#/responses/Problem"}
  /events/{eventId}/finance/pools/{poolId}/adjustments/{surchargeId}/remove:
    post:
      operationId: removeEventFinanceAdjustment
      security: []
      x-surveyor-command: {retryPolicy: reconcile-only, precondition: none}
      summary: Remove an adjustment while preserving the existing saved calculation
      parameters:
        - {$ref: "./common.yaml#/parameters/Context"}
        - {$ref: "./common.yaml#/parameters/Locale"}
        - {$ref: "./common.yaml#/parameters/Csrf"}
        - {name: eventId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: poolId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: surchargeId, in: path, required: true, schema: {type: string, pattern: '^[1-9][0-9]*$'}}
      responses:
        '200': {description: Adjustment removed, content: {application/json: {schema: {$ref: '#/schemas/FinanceMutationResult'}}}}
        default: {$ref: "./common.yaml#/responses/Problem"}
  /events/{eventId}/finance/pools/{poolId}/takeovers:
    post:
      operationId: updateEventParticipantFinanceTakeovers
      x-surveyor-command: {retryPolicy: reconcile-only, precondition: none}
