schemas:
  EventDietaryChoice:
    type: string
    enum: [MEAT, FISH, VEGETARIAN, VEGAN, HALAL, KOSHER, ALLERGIES, COMMENT]
    x-surveyor-runtime-choices:
      exportName: eventDietaryChoices
      groupsExportName: eventDietaryGroups
      groups:
        meal: [MEAT, FISH, VEGETARIAN, VEGAN]
        requirement: [HALAL, KOSHER, ALLERGIES]
        text: [COMMENT]
  EventPickerQuery:
    description: Shared bounded event-discovery filters. Each consuming endpoint owns its authorization and selected-event visibility.
    type: object
    additionalProperties: false
    properties:
      q:
        type: string
        maxLength: 200
      from:
        type: string
        format: date
      to:
        type: string
        format: date
      period:
        type: string
        enum: [all, upcoming, ongoing, ended]
      archive:
        type: string
        enum: [all, active, archived]
      deadline:
        type: string
        enum: [all, open, passed]
      cursor:
        type: string
        maxLength: 2048
      selectedId:
        type: string
        format: uuid
  EventPickerOption:
    description: Authorized event choice shared by selectors; feature endpoints decide which records may be projected.
    type: object
    additionalProperties: false
    required:
      - id
      - title
      - startDate
      - endDate
      - archived
      - description
      - deadlinePassed
    properties:
      id:
        $ref: './common.yaml#/schemas/Uuid'
      title:
        type: string
      startDate:
        type: string
      endDate:
        type: string
      archived:
        type: boolean
      description:
        type:
          - string
          - 'null'
      deadlinePassed:
        type: boolean
  EventPickerOptions:
    type: object
    additionalProperties: false
    required:
      - items
      - selected
      - nextCursor
    properties:
      items:
        type: array
        items:
          $ref: '#/schemas/EventPickerOption'
      selected:
        anyOf:
          - $ref: '#/schemas/EventPickerOption'
          - type: 'null'
      nextCursor:
        type:
          - string
          - 'null'
  EventCreateForm:
    type: object
    additionalProperties: false
    required: [data]
    properties:
      data: {$ref: '#/schemas/EventCreateInput'}
      image: {type: string, format: binary}
  EventCreated:
    type: object
    additionalProperties: false
    required: [id]
    properties:
      id: {$ref: './common.yaml#/schemas/Uuid'}
  EventCreateContext:
    $ref: ./common.yaml#/schemas/EntityCreationContext
  EventCreateEntry:
    type: object
    additionalProperties: false
    required:
      - entry
      - context
    properties:
      entry:
        $ref: ./common.yaml#/schemas/PageEntryOutcome
      context:
        anyOf:
          - $ref: "#/schemas/EventCreateContext"
          - type: "null"
  EventResourceEntry:
    $ref: ./common.yaml#/schemas/EntityResourceEntry
  EventMetadataPatch:
    type: object
    additionalProperties: false
    minProperties: 1
    properties:
      title:
        type: string
        minLength: 1
        maxLength: 255
      description:
        type:
          - string
          - "null"
        maxLength: 16000
      startDate:
        type: string
        pattern: ^\d{4}-\d{2}-\d{2}$
      endDate:
        type: string
        pattern: ^\d{4}-\d{2}-\d{2}$
      location:
        type:
          - string
          - "null"
        maxLength: 255
      bindingDeadline:
        type:
          - string
          - "null"
      deadlineTz:
        type: string
        maxLength: 255
      maxParticipants:
        anyOf:
          - type: number
          - type: string
          - type: "null"
      requireDietaryInfo:
        type: boolean
      allowDietComment:
        type: boolean
      allowRegDateUpdatesAfterDeadline:
        type: boolean
      allowRegCancelationAfterDeadline:
        type: boolean
      allowRegDietUpdateAfterDeadline:
        type: boolean
  EventCreateInput:
    type: object
    additionalProperties: false
    required:
      - title
      - startDate
      - endDate
      - defaultPermissions
    properties:
      title:
        type: string
        minLength: 1
      description:
        type: string
        maxLength: 16000
      startDate:
        type: string
        pattern: ^\d{4}-\d{2}-\d{2}$
      endDate:
        type: string
        pattern: ^\d{4}-\d{2}-\d{2}$
      location:
        type: string
        maxLength: 255
      bindingDeadline:
        type: string
      deadlineTz:
        type: string
      maxParticipants:
        anyOf:
          - type: number
          - type: string
          - type: "null"
      requireDietaryInfo:
        type: boolean
      allowDietComment:
        type: boolean
      allowRegDateUpdatesAfterDeadline:
        type: boolean
      allowRegCancelationAfterDeadline:
        type: boolean
      allowRegDietUpdateAfterDeadline:
        type: boolean
      defaultPermissions:
        $ref: ./common.yaml#/schemas/PermissionDefaults
  EventDuplicate:
    type: object
    additionalProperties: false
    required:
      - values
      - formContext
    properties:
      values:
        $ref: "#/schemas/EventCreateInput"
      formContext:
        $ref: "#/schemas/EventCreateContext"
  EventMetadataValues:
    description: Only the fields permitted by the independently granted Event metadata method.
    type: object
    additionalProperties: false
    properties:
      title:
        type: string
      description:
        type:
          - string
          - "null"
      startDate:
        type: string
      endDate:
        type: string
      location:
        type:
          - string
          - "null"
      bindingDeadline:
        type:
          - string
          - "null"
      deadlineTz:
        type: string
      maxParticipants:
        type:
          - number
          - "null"
      requireDietaryInfo:
        type: boolean
      allowDietComment:
        type: boolean
      allowRegDateUpdatesAfterDeadline:
        type: boolean
      allowRegCancelationAfterDeadline:
        type: boolean
      allowRegDietUpdateAfterDeadline:
        type: boolean
    minProperties: 1
  EventMetadata:
    type: object
    additionalProperties: false
    required:
      - id
      - values
      - editableFields
      - editToken
    properties:
      id:
        $ref: ./common.yaml#/schemas/Uuid
      values:
        $ref: "#/schemas/EventMetadataValues"
      editableFields:
        type: array
        items:
          type: string
          enum:
            - title
            - description
            - startDate
            - endDate
            - location
            - bindingDeadline
            - deadlineTz
            - maxParticipants
            - requireDietaryInfo
            - allowDietComment
            - allowRegDateUpdatesAfterDeadline
            - allowRegCancelationAfterDeadline
            - allowRegDietUpdateAfterDeadline
      editToken:
        $ref: ./common.yaml#/schemas/FieldComparisonToken
  EventRegistration:
    type: object
    additionalProperties: false
    required:
      - id
      - arrivalDate
      - departureDate
      - dietary
      - allergyNotes
      - dietComment
    properties:
      id:
        $ref: ./common.yaml#/schemas/DecimalId
      arrivalDate:
        type: string
      departureDate:
        type: string
      dietary:
        type: array
        items:
          $ref: '#/schemas/EventDietaryChoice'
      allergyNotes:
        type: string
      dietComment:
        type: string
  EventRegistrationInput:
    type: object
    additionalProperties: false
    required:
      - arrivalDate
      - departureDate
    properties:
      arrivalDate:
        type: string
        pattern: ^\d{4}-\d{2}-\d{2}$
      departureDate:
        type: string
        pattern: ^\d{4}-\d{2}-\d{2}$
      dietary:
        type: array
        items:
          $ref: '#/schemas/EventDietaryChoice'
      allergyNotes:
        type: string
        maxLength: 4000
      dietComment:
        type: string
        maxLength: 4000
      regToken:
        type:
          - string
          - "null"
        maxLength: 256
  EventRegistrationDates:
    type: object
    additionalProperties: false
    required:
      - arrivalDate
      - departureDate
    properties:
      arrivalDate:
        type: string
        pattern: ^\d{4}-\d{2}-\d{2}$
      departureDate:
        type: string
        pattern: ^\d{4}-\d{2}-\d{2}$
  EventView:
    type: object
    additionalProperties: false
    required:
      - id
      - title
      - description
      - headerUrl
      - headerVersion
      - startDate
      - endDate
      - location
      - bindingDeadline
      - timezone
      - maxParticipants
      - requireDietaryInfo
      - allowDietComment
      - allowRegDateUpdatesAfterDeadline
      - allowRegCancelationAfterDeadline
      - allowRegDietUpdateAfterDeadline
      - registrationCount
      - isFull
      - registration
      - capabilities
      - archive
      - hasInvoicePools
    properties:
      id:
        $ref: ./common.yaml#/schemas/Uuid
      title:
        type: string
      description:
        type:
          - string
          - "null"
      headerUrl:
        type:
          - string
          - "null"
      headerVersion:
        type:
          - string
          - "null"
      startDate:
        type: string
      endDate:
        type: string
      location:
        type:
          - string
          - "null"
      bindingDeadline:
        type:
          - string
          - "null"
      timezone:
        type: string
      maxParticipants:
        type:
          - number
          - "null"
      requireDietaryInfo:
        type: boolean
      allowDietComment:
        type: boolean
      allowRegDateUpdatesAfterDeadline:
        type: boolean
      allowRegCancelationAfterDeadline:
        type: boolean
      allowRegDietUpdateAfterDeadline:
        type: boolean
      registrationCount:
        type: integer
        minimum: 0
      isFull:
        type: boolean
      registration:
        anyOf:
          - $ref: "#/schemas/EventRegistration"
          - type: "null"
      capabilities:
        type: object
        additionalProperties: false
        required:
          - register
          - admin
          - participants
          - manageRegistrations
          - items
          - settings
          - exportParticipants
          - manageAssignments
        properties:
          register:
            type: boolean
          admin:
            type: boolean
          participants:
            type: boolean
          manageRegistrations:
            type: boolean
          items:
            type: boolean
          settings:
            type: boolean
          exportParticipants:
            type: boolean
          manageAssignments:
            type: boolean
      archive:
        $ref: ./common.yaml#/schemas/EntityArchive
      hasInvoicePools:
        type: boolean
        description: Only own registered profiles receive pool existence for the finance destination; no finance
          aggregate.
  EventSettings:
    type: object
    additionalProperties: false
    required:
      - id
      - title
      - settingsToken
      - headerUrl
      - headerVersion
      - editableFields
      - capabilities
      - archive
      - access
    properties:
      id:
        $ref: ./common.yaml#/schemas/Uuid
      title:
        type: string
      settingsToken:
        $ref: ./common.yaml#/schemas/ComparisonToken
      headerUrl:
        type:
          - string
          - "null"
      headerVersion:
        type:
          - string
          - "null"
      editableFields:
        $ref: "#/schemas/EventMetadata/properties/editableFields"
      capabilities:
        type: object
        additionalProperties: false
        required:
          - editHeader
          - managePermissions
          - duplicate
          - remove
          - manageArchive
          - archive
          - restore
          - manageAutomation
        properties:
          editHeader:
            type: boolean
          managePermissions:
            type: boolean
          duplicate:
            type: boolean
          remove:
            type: boolean
          manageArchive:
            type: boolean
          archive:
            type: boolean
          restore:
            type: boolean
          manageAutomation:
            type: boolean
          export:
            type: boolean
      archive:
        $ref: ./common.yaml#/schemas/EntityArchive
      access:
        anyOf:
          - $ref: ./common.yaml#/schemas/EntityAccess
          - type: "null"
  EventParticipant:
    type: object
    additionalProperties: false
    required:
      - id
      - profileId
      - name
      - email
      - arrivalDate
      - departureDate
      - dietary
    properties:
      id:
        $ref: ./common.yaml#/schemas/DecimalId
      profileId:
        $ref: ./common.yaml#/schemas/NullableUuid
      name:
        type: string
      email:
        type:
          - string
          - "null"
      arrivalDate:
        type:
          - string
          - "null"
      departureDate:
        type:
          - string
          - "null"
      dietary:
        type: array
        items:
          type: object
          additionalProperties: false
          required:
            - choice
            - additionalInfo
          properties:
            choice:
              type: string
              enum:
                - MEAT
                - FISH
                - VEGETARIAN
                - VEGAN
                - HALAL
                - KOSHER
                - ALLERGIES
                - COMMENT
            additionalInfo:
              type:
                - string
                - "null"
  EventParticipants:
    type: object
    additionalProperties: false
    required:
      - participants
      - totals
      - dateTotals
      - allergies
      - comments
      - generatedAt
    properties:
      participants:
        type: array
        items:
          $ref: "#/schemas/EventParticipant"
      totals:
        type: array
        items:
          type: object
          additionalProperties: false
          required:
            - key
            - count
          properties:
            key:
              type: string
            count:
              type: integer
              minimum: 0
      dateTotals:
        type: array
        items:
          type: object
          additionalProperties: false
          required:
            - date
            - count
          properties:
            date:
              type: string
            count:
              type: integer
              minimum: 0
      allergies:
        type: array
        items:
          type: string
      comments:
        type: array
        items:
          type: string
      generatedAt:
        type: string
  EventRegistrationLink:
    type: object
    additionalProperties: false
    required:
      - id
      - token
      - createdAt
      - expiresAt
      - revokedAt
      - used
      - profileId
      - status
    properties:
      id:
        $ref: ./common.yaml#/schemas/Uuid
      token:
        type: string
      createdAt:
        type: string
      expiresAt:
        type:
          - string
          - "null"
      revokedAt:
        type:
          - string
          - "null"
      used:
        type: boolean
      profileId:
        $ref: ./common.yaml#/schemas/NullableUuid
      status:
        type: string
        enum:
          - active
          - expired
          - revoked
          - consumed
  EventRegistrationLinks:
    type: object
    additionalProperties: false
    required:
      - items
    properties:
      items:
        type: array
        items:
          $ref: "#/schemas/EventRegistrationLink"
  EventRegistrationLinkInput:
    type: object
    additionalProperties: false
    properties:
      expiresAt:
        type:
          - string
          - "null"
      maxUses:
        type: integer
        minimum: 1
        maximum: 32767
  EventThingsToDo:
    type: object
    additionalProperties: false
    required:
      - items
    properties:
      items:
        type: array
        items:
          $ref: ./common.yaml#/schemas/EntityCard
  EventCreatedRegistrationLink:
    type: object
    additionalProperties: false
    required:
      - id
      - token
    properties:
      id:
        $ref: ./common.yaml#/schemas/Uuid
      token:
        type: string
  EventAutomaticArchivalInput:
    $ref: ./common.yaml#/schemas/AutomaticArchivalInput
  EventCreationFields:
    type: object
    additionalProperties: false
    required:
      - title
      - startDate
      - endDate
      - defaultPermissions
    properties:
      title:
        type: string
      description:
        type: string
      startDate:
        type: string
      endDate:
        type: string
      location:
        type: string
      bindingDeadline:
        type: string
      deadlineTz:
        type: string
      maxParticipants:
        anyOf:
          - type: number
          - type: string
          - type: "null"
      requireDietaryInfo:
        type: boolean
      allowDietComment:
        type: boolean
      allowRegDateUpdatesAfterDeadline:
        type: boolean
      allowRegCancelationAfterDeadline:
        type: boolean
      allowRegDietUpdateAfterDeadline:
        type: boolean
      defaultPermissions:
        $ref: ./common.yaml#/schemas/PermissionDefaults
  EventCreationSubmission:
    type: object
    additionalProperties: false
    required:
      - fields
    properties:
      fields:
        $ref: "#/schemas/EventCreationFields"
      error:
        type: string
paths:
  /events:
    post:
      operationId: createEvent
      x-surveyor-command: {retryPolicy: reconcile-only, precondition: none}
      summary: Create an Event through the existing creation and default initialization owners
      parameters:
        - {$ref: "./common.yaml#/parameters/Context"}
        - {$ref: "./common.yaml#/parameters/Locale"}
        - {$ref: "./common.yaml#/parameters/Csrf"}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: {$ref: '#/schemas/EventCreateForm'}
      responses:
        '201':
          description: Existing creation and default initialization completed
          content:
            application/json:
              schema: {$ref: '#/schemas/EventCreated'}
        default: {$ref: "./common.yaml#/responses/Problem"}
  /events/{eventId}/things-to-do/{entityType}/{entityId}:
    delete:
      operationId: deleteEventChild
      x-surveyor-command: {retryPolicy: reconcile-only, precondition: none}
      summary: Delete an owned child from its admitted Event host
      parameters:
        - {$ref: "./common.yaml#/parameters/Context"}
        - {$ref: "./common.yaml#/parameters/Locale"}
        - {$ref: "./common.yaml#/parameters/Csrf"}
        - {name: eventId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: entityType, in: path, required: true, schema: {type: string, enum: [packing, activity, drivers]}}
        - {name: entityId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: view, in: query, schema: {type: string, enum: [detail, admin]}}
      responses:
        '200':
          description: Existing child deletion completed
          content:
            application/json:
              schema: {$ref: './common.yaml#/schemas/MutationResult'}
        default: {$ref: "./common.yaml#/responses/Problem"}
  /events/create-entry:
    get:
      operationId: getEventCreateEntry
      x-surveyor-command:
        retryPolicy: read
        precondition: none
      summary: get Event Create Entry
      parameters:
        - $ref: "./common.yaml#/parameters/Context"
        - $ref: "./common.yaml#/parameters/Locale"
        - name: returnTo
          in: query
          schema:
            type: string
            maxLength: 2048
      responses:
        "200":
          description: Permitted Event projection
          content:
            application/json:
              schema:
                $ref: "#/schemas/EventCreateEntry"
        default:
          $ref: "./common.yaml#/responses/Problem"
      security: []
  /events/create-context:
    get:
      operationId: getEventCreateContext
      x-surveyor-command:
        retryPolicy: read
        precondition: none
      summary: get Event Create Context
      parameters:
        - $ref: "./common.yaml#/parameters/Context"
        - $ref: "./common.yaml#/parameters/Locale"
      responses:
        "200":
          description: Permitted Event projection
          content:
            application/json:
              schema:
                $ref: "#/schemas/EventCreateContext"
        default:
          $ref: "./common.yaml#/responses/Problem"
  /events/{eventId}/entry:
    get:
      operationId: getEventResourceEntry
      x-surveyor-command:
        retryPolicy: read
        precondition: none
      summary: get Event Resource Entry
      parameters:
        - $ref: "./common.yaml#/parameters/Context"
        - $ref: "./common.yaml#/parameters/Locale"
        - &a1
          name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: view
          in: query
          required: true
          schema:
            type: string
            enum:
              - detail
              - guest
              - admin
        - name: regToken
          in: query
          schema:
            type: string
            maxLength: 256
      responses:
        "200":
          description: Permitted Event projection
          content:
            application/json:
              schema:
                $ref: "#/schemas/EventResourceEntry"
        default:
          $ref: "./common.yaml#/responses/Problem"
      security: []
  /events/{eventId}:
    get:
      operationId: getEvent
      x-surveyor-command:
        retryPolicy: read
        precondition: none
      summary: get Event
      parameters:
        - $ref: "./common.yaml#/parameters/Context"
        - $ref: "./common.yaml#/parameters/Locale"
        - *a1
        - name: view
          in: query
          schema:
            type: string
            enum:
              - detail
              - admin
      responses:
        "200":
          description: Permitted Event projection
          content:
            application/json:
              schema:
                $ref: "#/schemas/EventView"
        default:
          $ref: "./common.yaml#/responses/Problem"
    delete:
      operationId: deleteEvent
      x-surveyor-command:
        retryPolicy: reconcile-only
        precondition: none
      summary: delete Event
      parameters:
        - $ref: "./common.yaml#/parameters/Context"
        - $ref: "./common.yaml#/parameters/Locale"
        - *a1
        - $ref: "./common.yaml#/parameters/Csrf"
      responses:
        "200":
          description: Confirmed result of the existing shared Event operation
          content:
            application/json:
              schema:
                $ref: ./common.yaml#/schemas/MutationResult
        default:
          $ref: "./common.yaml#/responses/Problem"
  /events/{eventId}/duplicate:
    get:
      operationId: getEventDuplicate
      x-surveyor-command:
        retryPolicy: read
        precondition: none
      summary: get Event Duplicate
      parameters:
        - $ref: "./common.yaml#/parameters/Context"
        - $ref: "./common.yaml#/parameters/Locale"
        - *a1
      responses:
        "200":
          description: Permitted Event projection
          content:
            application/json:
              schema:
                $ref: "#/schemas/EventDuplicate"
        default:
          $ref: "./common.yaml#/responses/Problem"
      security: []
  /events/{eventId}/metadata:
    get:
      operationId: getEventMetadata
      x-surveyor-command:
        retryPolicy: read
        precondition: none
      summary: get Event Metadata
      parameters:
        - $ref: "./common.yaml#/parameters/Context"
        - $ref: "./common.yaml#/parameters/Locale"
        - *a1
        - $ref: "./common.yaml#/parameters/IfNoneMatch"
      responses:
        "200":
          description: Permitted Event projection
          content:
            application/json:
              schema:
                $ref: "#/schemas/EventMetadata"
          headers:
            ETag:
              schema:
                type: string
        "304":
          description: Current authorized representation unchanged; no response body
        default:
          $ref: "./common.yaml#/responses/Problem"
      security: []
    patch:
      operationId: updateEventMetadata
      x-surveyor-command:
        retryPolicy: reconcile-only
        precondition: metadata
      summary: update Event Metadata
      parameters:
        - $ref: "./common.yaml#/parameters/Context"
        - $ref: "./common.yaml#/parameters/Locale"
        - *a1
        - $ref: "./common.yaml#/parameters/Csrf"
        - $ref: "./common.yaml#/parameters/IfMatch"
      responses:
        "200":
          description: Confirmed result of the existing shared Event operation
          content:
            application/json:
              schema:
                $ref: "#/schemas/EventMetadata"
          headers:
            ETag:
              schema:
                type: string
        default:
          $ref: "./common.yaml#/responses/Problem"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/schemas/EventMetadataPatch"
      security: []
  /events/{eventId}/settings:
    get:
      operationId: getEventSettings
      x-surveyor-command:
        retryPolicy: read
        precondition: none
      summary: get Event Settings
      parameters:
        - $ref: "./common.yaml#/parameters/Context"
        - $ref: "./common.yaml#/parameters/Locale"
        - *a1
      responses:
        "200":
          description: Permitted Event projection
          content:
            application/json:
              schema:
                $ref: "#/schemas/EventSettings"
        default:
          $ref: "./common.yaml#/responses/Problem"
  /events/{eventId}/registration:
    put:
      operationId: saveEventRegistration
      x-surveyor-command:
        retryPolicy: reconcile-only
        precondition: none
      summary: save Event Registration
      parameters:
        - $ref: "./common.yaml#/parameters/Context"
        - $ref: "./common.yaml#/parameters/Locale"
        - *a1
        - $ref: "./common.yaml#/parameters/Csrf"
      responses:
        "200":
          description: Confirmed result of the existing shared Event operation
          content:
            application/json:
              schema:
