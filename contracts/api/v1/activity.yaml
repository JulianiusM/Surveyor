    properties:
      id:
        $ref: ./common.yaml#/schemas/Uuid
      itemId:
        $ref: ./common.yaml#/schemas/Uuid
      profileId:
        $ref: ./common.yaml#/schemas/Uuid
      status:
        type: string
        enum:
          - PENDING
          - APPROVED
          - APPLIED
          - REJECTED
      operation:
        type: string
        enum:
          - ASSIGN
          - REASSIGN
          - UNASSIGN
      sourceItemId:
        type:
          - string
          - "null"
      manual:
        type: boolean
      hidden:
        type: boolean
paths:
  "/activity-plans/{planId}/automatic-archive":
    put:
      operationId: setActivityAutomaticArchival
      x-surveyor-command: {retryPolicy: reconcile-only, precondition: none}
      summary: Pause or resume an activity plan's existing automatic archival schedule
      parameters:
        - "$ref": "./openapi.yaml#/components/parameters/Context"
        - "$ref": "./openapi.yaml#/components/parameters/Locale"
        - "$ref": "./openapi.yaml#/components/parameters/Csrf"
        - name: planId
          in: path
          required: true
          schema:
            "$ref": "./common.yaml#/schemas/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "./events.yaml#/schemas/EventAutomaticArchivalInput"
      responses:
        "200":
          description: Authorized schedule command acknowledgement
          content:
            application/json:
              schema:
                "$ref": "./openapi.yaml#/components/schemas/MutationResult"
        default:
          "$ref": "./openapi.yaml#/components/responses/Problem"
  "/activity-plans/create-entry":
    get:
      operationId: "getActivityCreateEntry"
      x-surveyor-command:
        retryPolicy: "read"
        precondition: "none"
      summary: "get Activity Create Entry"
      parameters:
        -
          "$ref": "./openapi.yaml#/components/parameters/Context"
        -
          "$ref": "./openapi.yaml#/components/parameters/Locale"
        -
          name: "returnTo"
          in: "query"
          schema:
            type: "string"
            maxLength: 2048
        -
          name: "eventId"
          in: "query"
          schema:
            type: "string"
        -
          "$ref": "./openapi.yaml#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: "Authorized operation result"
          headers:
            X-Surveyor-Context:
              schema:
                type: "string"
          content:
            "application/json":
              schema:
                "$ref": "#/schemas/ActivityCreateEntry"
        default:
          "$ref": "./openapi.yaml#/components/responses/Problem"
      security: []
  "/activity-plans/create-context":
    get:
      operationId: "getActivityCreateContext"
      x-surveyor-command:
        retryPolicy: "read"
        precondition: "none"
      summary: "get Activity Create Context"
      parameters:
        -
          "$ref": "./openapi.yaml#/components/parameters/Context"
        -
          "$ref": "./openapi.yaml#/components/parameters/Locale"
        -
          "$ref": "./openapi.yaml#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: "Authorized operation result"
          headers:
            X-Surveyor-Context:
              schema:
                type: "string"
          content:
            "application/json":
              schema:
                "$ref": "#/schemas/ActivityCreateContext"
        default:
          "$ref": "./openapi.yaml#/components/responses/Problem"
  "/activity-plans/events":
    get:
      operationId: "searchActivityEvents"
      x-surveyor-command:
        retryPolicy: "read"
        precondition: "none"
      summary: "search Activity Events"
      parameters:
        -
          "$ref": "./openapi.yaml#/components/parameters/Context"
        -
          "$ref": "./openapi.yaml#/components/parameters/Locale"
        -
          name: "q"
          in: "query"
          schema:
            "$ref": "./common.yaml#/schemas/EventPickerQuery/properties/q"
        - name: from
          in: query
          schema:
            "$ref": "./common.yaml#/schemas/EventPickerQuery/properties/from"
        - name: to
          in: query
          schema:
            "$ref": "./common.yaml#/schemas/EventPickerQuery/properties/to"
        - name: period
          in: query
          schema:
            "$ref": "./common.yaml#/schemas/EventPickerQuery/properties/period"
        - name: archive
          in: query
          schema:
            "$ref": "./common.yaml#/schemas/EventPickerQuery/properties/archive"
        - name: deadline
          in: query
          schema:
            "$ref": "./common.yaml#/schemas/EventPickerQuery/properties/deadline"
        -
          name: "selectedId"
          in: "query"
          schema:
            "$ref": "./common.yaml#/schemas/EventPickerQuery/properties/selectedId"
        -
          name: "cursor"
          in: "query"
          schema:
            "$ref": "./common.yaml#/schemas/EventPickerQuery/properties/cursor"
        -
          "$ref": "./openapi.yaml#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: "Authorized operation result"
          headers:
            X-Surveyor-Context:
              schema:
                type: "string"
          content:
            "application/json":
              schema:
                "$ref": "#/schemas/ActivityEventOptions"
        default:
          "$ref": "./openapi.yaml#/components/responses/Problem"
  "/activity-plans/{planId}/entry":
    get:
      operationId: "getActivityResourceEntry"
      x-surveyor-command:
        retryPolicy: "read"
        precondition: "none"
      summary: "get Activity Resource Entry"
      parameters:
        -
          "$ref": "./openapi.yaml#/components/parameters/Context"
        -
          "$ref": "./openapi.yaml#/components/parameters/Locale"
        -
          name: "planId"
          in: "path"
          required: true
          schema:
            "$ref": "./common.yaml#/schemas/Uuid"
        -
          name: "view"
          in: "query"
          schema:
            type: "string"
            enum:
              - "detail"
              - "guest"
          required: true
        -
          "$ref": "./openapi.yaml#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: "Authorized operation result"
          headers:
            X-Surveyor-Context:
              schema:
                type: "string"
          content:
            "application/json":
              schema:
                "$ref": "#/schemas/ActivityResourceEntry"
        default:
          "$ref": "./openapi.yaml#/components/responses/Problem"
