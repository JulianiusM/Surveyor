        -
          "$ref": "./openapi.yaml#/components/parameters/Context"
        -
          "$ref": "./openapi.yaml#/components/parameters/Locale"
        -
          name: "planId"
          in: "path"
          required: true
          schema:
            "$ref": "./common.yaml#/schemas/Uuid"
        -
          "$ref": "./openapi.yaml#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: "Authorized operation result"
          headers:
            X-Surveyor-Context:
              schema:
                type: "string"
          content:
            "application/json":
              schema:
                "$ref": "./openapi.yaml#/components/schemas/GuestEntry"
        default:
          "$ref": "./openapi.yaml#/components/responses/Problem"
      security: []
    post:
      operationId: "registerActivityGuest"
      x-surveyor-command:
        retryPolicy: "reconcile-only"
        precondition: "none"
      summary: "register Activity Guest"
      parameters:
        -
          "$ref": "./openapi.yaml#/components/parameters/Context"
        -
          "$ref": "./openapi.yaml#/components/parameters/Locale"
        -
          name: "planId"
          in: "path"
          required: true
          schema:
            "$ref": "./common.yaml#/schemas/Uuid"
        -
          "$ref": "./openapi.yaml#/components/parameters/Csrf"
      responses:
        "200":
          description: "Authorized operation result"
          headers:
            X-Surveyor-Context:
              schema:
                type: "string"
          content:
            "application/json":
              schema:
                "$ref": "./openapi.yaml#/components/schemas/IdentityResult"
        default:
          "$ref": "./openapi.yaml#/components/responses/Problem"
      security: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "./openapi.yaml#/components/schemas/GuestRegistrationInput"
  "/activity-plans":
    post:
      operationId: "createActivityPlan"
      x-surveyor-command:
        retryPolicy: "reconcile-only"
        precondition: "none"
      summary: "create Activity Plan"
      parameters:
