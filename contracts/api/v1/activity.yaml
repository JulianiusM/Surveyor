        minimum: 0
      skipped:
        type: integer
        minimum: 0
      warnings:
        type: array
        items:
          $ref: "#/schemas/ActivityRecommendationWarning"
  ActivityRecommendations:
    type: object
    additionalProperties: false
    required:
      - recommendations
      - participantOptions
      - slots
      - existingAssignments
      - warnings
      - autoGenerationJob
    properties:
      recommendations:
        type: array
        items:
          type: object
          additionalProperties: false
          required:
            - id
            - item
            - profile
