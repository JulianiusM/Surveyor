schemas:
  ActivityCreateContext:
    "$ref": "./drivers.yaml#/schemas/DriversCreateContext"
  ActivityCreateEntry:
    type: "object"
    additionalProperties: false
    required:
      - "entry"
      - "context"
    properties:
      entry:
        "$ref": "./common.yaml#/schemas/PageEntryOutcome"
      context:
        anyOf:
          -
            "$ref": "#/schemas/ActivityCreateContext"
          -
            type: "null"
      selectedEvent:
        anyOf:
          -
            "$ref": "./common.yaml#/schemas/EventPickerOption"
          -
            type: "null"
  ActivityResourceEntry:
    "$ref": "./packing.yaml#/schemas/PackingResourceEntry"
  ActivityCreated:
    "$ref": "./packing.yaml#/schemas/PackingCreated"
  ActivitySlotInput:
    type: "object"
    additionalProperties: false
    required:
      - "id"
      - "day"
      - "position"
      - "title"
      - "description"
      - "startTime"
      - "endTime"
      - "maxAssignees"
    properties:
      id:
        "$ref": "./common.yaml#/schemas/Uuid"
      day:
        type: "string"
        format: "date"
      position:
        type: "integer"
      title:
        type: "string"
        minLength: 1
        maxLength: 255
      description:
        type: "string"
        maxLength: 16000
      startTime:
        type:
          - "string"
          - "null"
        pattern: "^\\d{2}:\\d{2}(?::\\d{2})?$"
      endTime:
        type:
          - "string"
          - "null"
        pattern: "^\\d{2}:\\d{2}(?::\\d{2})?$"
      maxAssignees:
        type: "integer"
        minimum: 1
  ActivityCreateInput:
    type: "object"
    additionalProperties: false
    required:
      - "title"
      - "description"
      - "startDate"
      - "endDate"
      - "eventId"
      - "slots"
      - "defaultPermissions"
    properties:
      title:
        type: "string"
        minLength: 1
        maxLength: 255
      description:
        type: "string"
        maxLength: 16000
      startDate:
        type: "string"
        format: "date"
      endDate:
        type: "string"
        format: "date"
      eventId:
        "$ref": "./common.yaml#/schemas/NullableUuid"
      slots:
        type: "array"
        items:
          "$ref": "#/schemas/ActivitySlotInput"
      defaultPermissions:
        "$ref": "./packing.yaml#/schemas/PermissionDefaults"
  ActivityCreateForm:
    type: "object"
    additionalProperties: false
    required:
      - "data"
    properties:
      data:
        "$ref": "#/schemas/ActivityCreateInput"
      image:
        type: "string"
        format: "binary"
  ActivityDuplicateSlot:
    type: "object"
    additionalProperties: false
    required:
      - "id"
      - "day"
      - "position"
      - "title"
      - "description"
      - "startTime"
      - "endTime"
      - "maxAssignees"
    properties:
      id:
        "$ref": "./common.yaml#/schemas/Uuid"
      day:
        type: "string"
        format: "date"
      position:
        type: "integer"
      title:
        type: "string"
      description:
        type: "string"
      startTime:
        type:
          - "string"
          - "null"
      endTime:
        type:
          - "string"
          - "null"
      maxAssignees:
        type: "integer"
  ActivityDuplicate:
    type: "object"
    additionalProperties: false
    required:
      - "title"
      - "description"
      - "startDate"
      - "endDate"
      - "eventId"
      - "slots"
      - "defaultPermissions"
      - "formContext"
    properties:
      title:
        type: "string"
      description:
        type:
          - "string"
          - "null"
      startDate:
        type: "string"
        format: "date"
      endDate:
        type: "string"
        format: "date"
      eventId:
        "$ref": "./common.yaml#/schemas/NullableUuid"
      slots:
        type: "array"
        items:
          "$ref": "#/schemas/ActivityDuplicateSlot"
      defaultPermissions:
        "$ref": "./packing.yaml#/schemas/PermissionDefaults"
      formContext:
        "$ref": "#/schemas/ActivityCreateContext"
      selectedEvent:
        anyOf:
          -
            "$ref": "./common.yaml#/schemas/EventPickerOption"
          -
            type: "null"
  ActivityRole:
    type: "object"
    additionalProperties: false
    required:
      - "id"
      - "title"
      - "description"
    properties:
      id:
        $ref: ./common.yaml#/schemas/DecimalId
      title:
        type: "string"
      description:
        type:
          - "string"
          - "null"
  ActivitySlotRole:
    type: "object"
    additionalProperties: false
    required:
      - "id"
      - "name"
      - "maxQty"
      - "assignedQty"
      - "assignmentId"
      - "assigneeName"
      - "self"
    properties:
      id:
        $ref: ./common.yaml#/schemas/DecimalId
      name:
        type: "string"
      maxQty:
        type: "integer"
        minimum: 0
      assignedQty:
        type: "integer"
        minimum: 0
      assignmentId:
        type:
          - "string"
          - "null"
      assigneeName:
        type:
          - "string"
          - "null"
      self:
        type: "boolean"
  ActivityAssignee:
    type: "object"
    additionalProperties: false
    required:
      - "assignmentId"
      - "name"
      - "roles"
    properties:
      assignmentId:
        "$ref": "./common.yaml#/schemas/DecimalId"
      name:
        type: "string"
      roles:
        type: "array"
        items:
          type: "string"
  ActivitySlotView:
    type: "object"
    additionalProperties: false
    required:
      - "id"
      - "day"
      - "position"
      - "title"
      - "description"
      - "startTime"
      - "endTime"
      - "maxAssignees"
      - "assignedCount"
      - "selfAssigned"
      - "selfRoles"
      - "roles"
      - "assignees"
      - "editToken"
      - "capabilities"
    properties:
      id:
        "$ref": "./common.yaml#/schemas/Uuid"
      day:
        type: "string"
        format: "date"
      position:
        type: "integer"
      title:
        type: "string"
      description:
        type:
          - "string"
          - "null"
      startTime:
        type:
          - "string"
          - "null"
        pattern: "^\\d{2}:\\d{2}(?::\\d{2})?$"
      endTime:
        type:
          - "string"
          - "null"
        pattern: "^\\d{2}:\\d{2}(?::\\d{2})?$"
      maxAssignees:
        type:
          - "number"
          - "null"
      assignedCount:
        type: "integer"
        minimum: 0
      selfAssigned:
        type: "boolean"
      selfRoles:
        type: "array"
        items:
          type: "string"
      roles:
        type: "array"
        items:
          "$ref": "#/schemas/ActivitySlotRole"
      assignees:
        type: "array"
        items:
          "$ref": "#/schemas/ActivityAssignee"
      editToken:
        type: "string"
      capabilities:
        type: "object"
        additionalProperties: false
        required:
          - "editTitle"
          - "editDescription"
          - "editMeta"
          - "inlineMetadataAdmission"
          - "editCapacity"
          - "editRoles"
          - "manageAssignments"
          - "remove"
        properties:
          editTitle:
            type: "boolean"
          editDescription:
            type: "boolean"
          editMeta:
            type: "boolean"
          inlineMetadataAdmission:
            type: boolean
          editCapacity:
            type: "boolean"
          editRoles:
            type: "boolean"
          manageAssignments:
            type: "boolean"
          remove:
            type: "boolean"
  ActivityProgress:
    type: "object"
    additionalProperties: false
    required:
      - "assignedShifts"
      - "requiredShifts"
      - "remainingShifts"
      - "complete"
    properties:
      assignedShifts:
        type: "integer"
        minimum: 0
      requiredShifts:
        type: "integer"
        minimum: 0
      remainingShifts:
        type: "integer"
        minimum: 0
      complete:
        type: "boolean"
  ActivityParticipant:
    type: "object"
    additionalProperties: false
    required:
      - "participantKey"
      - "name"
      - "count"
      - "assignedShifts"
      - "roles"
      - "roleIds"
      - "requiredShifts"
      - "remainingShifts"
      - "source"
      - "attendanceDays"
      - "attendance"
      - "assignmentMode"
    properties:
      participantKey:
        type: "string"
      name:
        type: "string"
      nameIsFallback:
        type: boolean
        description: True only when the shared owner supplied its generic participant label instead of a raw name.
      count:
        type: "integer"
        minimum: 0
      assignedShifts:
        type: "integer"
        minimum: 0
      roles:
        type: "array"
        items:
          type: "string"
      roleIds:
        type: "array"
        items:
          $ref: ./common.yaml#/schemas/DecimalId
      requiredShifts:
        type: "integer"
        minimum: 0
      remainingShifts:
        type: "integer"
        minimum: 0
      source:
        type: "string"
      attendanceDays:
        type: "integer"
        minimum: 0
      attendance:
        anyOf:
          -
            type: "object"
            additionalProperties: false
            required:
              - "arrivalDate"
              - "departureDate"
            properties:
              arrivalDate:
                type:
                  - "string"
                  - "null"
              departureDate:
                type:
                  - "string"
                  - "null"
          -
            type: "null"
      assignmentMode:
        type: "string"
        enum:
          - "FREE"
          - "REQUIRED"
  ActivityTextField:
    type: "object"
    additionalProperties: false
    required:
      - "id"
      - "title"
      - "text"
      - "editToken"
      - "capabilities"
    properties:
      id:
        "$ref": "./common.yaml#/schemas/Uuid"
      title:
        type: "string"
      text:
        type: "string"
      editToken:
        type: "string"
      capabilities:
        type: "object"
        additionalProperties: false
        required:
          - "edit"
          - "editTitle"
          - "delete"
        properties:
          edit:
            type: "boolean"
          editTitle:
            type: "boolean"
          delete:
            type: "boolean"
  ActivityView:
    type: "object"
    additionalProperties: false
    required:
      - "entityType"
      - "id"
      - "title"
      - "description"
      - "startDate"
      - "endDate"
      - "headerUrl"
      - "headerVersion"
      - "currentEventId"
      - "currentEventUrl"
      - "archived"
      - "inheritedArchived"
      - "assignmentMode"
      - "canSelfAssign"
      - "allowOverfillAfterFull"
      - "bindingDeadline"
      - "requirementProgress"
      - "slots"
      - "weeks"
      - "allRoles"
      - "textFields"
      - "participants"
      - "counters"
      - "orderToken"
      - "capabilities"
    properties:
      entityType:
        type: "string"
        const: "activity"
      id:
        "$ref": "./common.yaml#/schemas/Uuid"
      title:
        type: "string"
      description:
        type:
          - "string"
          - "null"
      startDate:
        type: "string"
        format: "date"
      endDate:
        type: "string"
        format: "date"
      headerUrl:
        type:
          - "string"
          - "null"
      headerVersion:
        type:
          - "string"
          - "null"
      currentEventId:
        "$ref": "./common.yaml#/schemas/NullableUuid"
      currentEventUrl:
        type:
          - "string"
          - "null"
      archived:
        type: "boolean"
      inheritedArchived:
        type: "boolean"
      assignmentMode:
        type: "string"
        enum:
          - "FREE"
          - "REQUIRED"
      canSelfAssign:
        type: "boolean"
      allowOverfillAfterFull:
        type: "boolean"
      bindingDeadline:
        type:
          - "string"
          - "null"
      requirementProgress:
        anyOf:
          -
            "$ref": "#/schemas/ActivityProgress"
          -
            type: "null"
      slots:
        type: "array"
        items:
          "$ref": "#/schemas/ActivitySlotView"
      weeks:
        type: array
        items:
          "$ref": "#/schemas/ActivityWeek"
      allRoles:
        type: "array"
        items:
          "$ref": "#/schemas/ActivityRole"
      textFields:
        type: "array"
        items:
          "$ref": "#/schemas/ActivityTextField"
      participants:
        type: "array"
        items:
          "$ref": "#/schemas/ActivityParticipant"
      counters:
        type: "object"
        additionalProperties: false
        required:
          - "participants"
          - "open"
          - "empty"
        properties:
          participants:
            type:
              - "integer"
              - "null"
            minimum: 0
          open:
            type: "integer"
            minimum: 0
          empty:
            type: "integer"
            minimum: 0
      orderToken:
        type: "string"
      capabilities:
        type: "object"
        additionalProperties: false
        required:
          - "editTitle"
          - "editDescription"
          - "editDates"
          - "addSlot"
          - "reorderSlots"
          - "manageSettings"
          - "manageRequirements"
          - "manageRecommendations"
          - "roleCreationAdmission"
          - "rulesWorkspace"
          - "exportSchedule"
          - "duplicate"
          - "remove"
        properties:
          editTitle:
            type: "boolean"
          editDescription:
            type: "boolean"
          editDates:
            type: "boolean"
          addSlot:
            type: "boolean"
          reorderSlots:
            type: "boolean"
          manageSettings:
            type: "boolean"
          manageRequirements:
            type: "boolean"
          manageRecommendations:
            type: "boolean"
          roleCreationAdmission:
            type: boolean
          rulesWorkspace:
            type: boolean
          exportSchedule:
            type: "boolean"
          duplicate:
            type: "boolean"
          remove:
            type: "boolean"
  ActivityWeek:
    description: Monday-based civil weeks with visible stored day keys clipped to the plan date range, independent of timezone and daylight saving time.
    type: object
    additionalProperties: false
    required: [start, days]
    properties:
      start:
        type: string
        description: ISO civil date of the week's Monday; the preceding Monday can fall before the plan's start date or year.
        pattern: '^[0-9]{3,4}-[0-9]{2}-[0-9]{2}$'
      days:
        type: array
        items:
          type: string
          format: date
  ActivityMetadata:
    type: "object"
    additionalProperties: false
    required:
      - "entityType"
      - "id"
      - "values"
      - "editableFields"
      - "currentEventId"
      - "archived"
      - "inheritedArchived"
    properties:
      entityType:
        type: "string"
        const: "activity"
      id:
        "$ref": "./common.yaml#/schemas/Uuid"
      values:
        type: "object"
        additionalProperties: false
        required: []
        properties:
          title:
            type: "string"
          description:
            type:
              - "string"
              - "null"
          startDate:
            type: "string"
            format: "date"
          endDate:
            type: "string"
            format: "date"
      editableFields:
        type: "array"
        items:
          type: "string"
          enum:
            - "title"
            - "description"
            - "startDate"
            - "endDate"
      currentEventId:
        "$ref": "./common.yaml#/schemas/NullableUuid"
      archived:
        type: "boolean"
      inheritedArchived:
        type: "boolean"
  ActivityMetadataPatch:
    type: "object"
    additionalProperties: false
    required: []
    properties:
      title:
        type: "string"
        minLength: 1
      description:
        type:
          - "string"
          - "null"
      startDate:
        type: "string"
        format: "date"
      endDate:
        type: "string"
        format: "date"
  ActivitySettings:
    type: object
    additionalProperties: false
    required: [id, title, headerUrl, headerVersion, editableFields, settingsToken, capabilities, currentEvent, archive, access]
    properties:
      id:
        "$ref": "./common.yaml#/schemas/Uuid"
      title: {type: string}
      headerUrl: {type: [string, "null"]}
      headerVersion: {type: [string, "null"]}
      editableFields:
        type: array
        uniqueItems: true
        items:
          type: string
          enum: [title, description, startDate, endDate]
      settingsToken:
        "$ref": "./common.yaml#/schemas/FieldComparisonToken"
      capabilities:
        type: object
        additionalProperties: false
        required: [editHeader, linkEvent, managePermissions, duplicate, remove, archive, restore, manageArchive, manageAutomation, export]
        properties:
          editHeader: {type: boolean}
          linkEvent: {type: boolean}
          managePermissions: {type: boolean}
          duplicate: {type: boolean}
          remove: {type: boolean}
          archive: {type: boolean}
          restore: {type: boolean}
          manageArchive: {type: boolean}
          manageAutomation: {type: boolean}
          export: {type: boolean}
      currentEvent:
        "$ref": "./packing.yaml#/schemas/PackingSettings/properties/currentEvent"
      archive:
        type: object
        additionalProperties: false
        required: [direct, inherited, archivedAt, autoArchivePaused, eventUrl, hasAutomaticSchedule]
        properties:
          direct: {type: boolean}
          inherited: {type: boolean}
          archivedAt: {type: [string, "null"]}
          autoArchivePaused: {type: boolean}
          eventUrl: {type: [string, "null"]}
          hasAutomaticSchedule: {type: boolean}
      access:
        "$ref": "./packing.yaml#/schemas/PackingSettings/properties/access"
  ActivitySlotPatch:
    type: "object"
    additionalProperties: false
    required: []
    properties:
      title:
        type: "string"
      description:
        type:
          - "string"
          - "null"
      startTime:
        type:
          - "string"
          - "null"
        pattern: "^\\d{2}:\\d{2}(?::\\d{2})?$"
      endTime:
        type:
          - "string"
          - "null"
        pattern: "^\\d{2}:\\d{2}(?::\\d{2})?$"
      maxAssignees:
        anyOf:
          - type: number
          - type: string
          - type: "null"
      roles:
        type: "array"
        items:
          $ref: ./common.yaml#/schemas/DecimalId
  ActivitySlotBaseline:
    type: "object"
    additionalProperties: false
    required:
      - "values"
      - "editableFields"
      - "editToken"
    properties:
      values:
        "$ref": "#/schemas/ActivitySlotPatch"
      editableFields:
        type: "array"
        items:
          type: "string"
          enum:
            - "title"
            - "description"
            - "startTime"
            - "endTime"
            - "maxAssignees"
            - "roles"
      editToken:
        type: "string"
  ActivityNewSlot:
    type: "object"
    additionalProperties: false
    required:
      - "day"
      - "title"
      - "description"
      - "startTime"
      - "endTime"
      - "maxAssignees"
      - "roles"
    properties:
      day:
        type: "string"
        format: "date"
      title:
        type: "string"
        minLength: 1
      description:
        type: "string"
      startTime:
        type:
          - "string"
          - "null"
        pattern: "^\\d{2}:\\d{2}(?::\\d{2})?$"
      endTime:
        type:
          - "string"
          - "null"
        pattern: "^\\d{2}:\\d{2}(?::\\d{2})?$"
      maxAssignees:
        type: "integer"
        minimum: 1
      roles:
        type: "array"
        items:
          $ref: ./common.yaml#/schemas/DecimalId
  ActivityOrderInput:
    type: "object"
    additionalProperties: false
    required:
      - "order"
    properties:
      order:
        type: "array"
        items:
          type: "object"
          additionalProperties: false
          required:
            - "slotId"
            - "position"
          properties:
            slotId:
              "$ref": "./common.yaml#/schemas/Uuid"
            position:
              type: "integer"
  ActivityOrderBaseline:
    type: "object"
    additionalProperties: false
    required:
      - "order"
      - "editToken"
    properties:
      order:
        type: "array"
        items:
          type: "object"
          additionalProperties: false
          required:
            - "slotId"
            - "position"
          properties:
            slotId:
              "$ref": "./common.yaml#/schemas/Uuid"
            position:
              type: "integer"
      editToken:
        type: "string"
  ActivityAssignmentInput:
    type: "object"
    additionalProperties: false
    required:
      - "assigned"
    properties:
      assigned:
        type: "boolean"
      role:
        type: "string"
      overlapConfirmation:
        type: "string"
  ActivityWarningTarget:
    type: "object"
    additionalProperties: false
    required: []
    properties:
      profileId:
        "$ref": "./common.yaml#/schemas/Uuid"
  ActivityWarningDetail:
    type: "object"
    additionalProperties: false
    required:
      - "id"
      - "day"
    properties:
      id:
        type: "string"
      day:
        type: "string"
      startTime:
        type:
          - "string"
          - "null"
      endTime:
        type:
          - "string"
          - "null"
      pos:
        type:
          - "integer"
          - "null"
      isArrivalEvening:
        type:
          - "boolean"
          - "null"
      isDepartureMorning:
        type:
          - "boolean"
          - "null"
      hasNamedRole:
        type: "boolean"
      planId:
        type: "string"
      planTitle:
        type: "string"
      title:
        type: "string"
      assignmentMode:
        type: "string"
        enum:
          - "FREE"
          - "REQUIRED"
      recommendationId:
        type: "string"
      recommendationStatus:
        type: "string"
        enum:
          - "PENDING"
          - "APPROVED"
          - "APPLIED"
          - "REJECTED"
      operation:
        type: "string"
        enum:
          - "ASSIGN"
          - "REASSIGN"
          - "UNASSIGN"
      sourceItemId:
        type:
          - "string"
          - "null"
  ActivityWarning:
    type: "object"
    additionalProperties: false
    required:
      - "type"
    properties:
      type:
        type: "string"
        enum:
          - "ineligible_participant"
          - "outside_attendance"
          - "arrival_day"
          - "departure_day"
          - "arrival_time_restricted"
          - "departure_time_restricted"
          - "overlap"
          - "over_capacity"
      conflicts:
        type: "array"
        items:
          type: "string"
      overlapDetails:
        type: "array"
        items:
          "$ref": "#/schemas/ActivityWarningDetail"
      overlapTarget:
        "$ref": "#/schemas/ActivityWarningDetail"
      confirmable:
        type: "boolean"
      requiredPriority:
        type: "boolean"
  ActivityWarningPreview:
    type: "object"
    additionalProperties: false
    required:
      - "warnings"
    properties:
      warnings:
        type: "array"
        items:
          "$ref": "#/schemas/ActivityWarning"
      overlapConfirmation:
        type: "string"
  ActivityTextFieldInput:
    type: "object"
    additionalProperties: false
    required:
      - "title"
      - "text"
    properties:
      title:
        type: "string"
        minLength: 1
        maxLength: 255
        pattern: "\\S"
      text:
        type: "string"
        maxLength: 16000
  ActivityTextFieldPatch:
    type: "object"
    additionalProperties: false
    required:
      - "text"
    properties:
      title:
        type: "string"
        maxLength: 255
      text:
        type: "string"
        maxLength: 16000
  ActivityRoleInput:
    type: "object"
    additionalProperties: false
    required:
