# Preserve the fixed-source help controller's existing presentation contract.
schemas:
  HelpDocumentSummary:
    type: object
    additionalProperties: false
    required: [name, title, path, url]
    properties:
      name: {type: string}
      title: {type: string}
      path: {type: string}
      url: {type: string}
      # Summaries identify the language of their selected reviewed article.
      contentLocale: {type: string}
  HelpNavigationGroup:
    type: object
    additionalProperties: false
    required: [title, docs]
    properties:
      title: {type: string}
      docs:
        type: array
        items: {$ref: '#/schemas/HelpDocumentSummary'}
  HelpTocEntry:
    type: object
    additionalProperties: false
    required: [id, title, level]
    properties:
      id: {type: string}
      title: {type: string}
      level: {type: integer}
  HelpSearchResult:
    type: object
    additionalProperties: false
    required: [title, url, excerpt]
    properties:
      title: {type: string}
      url: {type: string}
      sectionTitle: {type: string}
      excerpt: {type: string}
      contentLocale: {type: string}
  HelpPageData:
    type: object
    additionalProperties: false
    required: [locale, title, content, docsList, docsGroups, currentDoc, toc]
    properties:
      locale: {type: string}
      # Interface locale remains requested when an absent translation uses English.
      contentLocale: {type: string}
      # Covers article, topic/search labels and referenced figures; the client must announce it.
      fallbackToEnglish: {type: boolean}
      title: {type: string}
      # HTML is trusted only because the existing fixed-release-source help renderer validated it.
      content: {type: string}
      docsList:
        type: array
        items: {$ref: '#/schemas/HelpDocumentSummary'}
      docsGroups:
        type: array
        items: {$ref: '#/schemas/HelpNavigationGroup'}
      currentDoc: {type: string}
      toc:
        type: array
        items: {$ref: '#/schemas/HelpTocEntry'}
      searchQuery: {type: string}
      searchResults:
        type: array
        items: {$ref: '#/schemas/HelpSearchResult'}
paths:
  /help:
    get:
      operationId: getHelpPage
      x-surveyor-command: {retryPolicy: read, precondition: none}
      summary: Read fixed-source help or search its contents
      security: []
      parameters:
        - $ref: "./openapi.yaml#/components/parameters/Context"
        - $ref: "./openapi.yaml#/components/parameters/Locale"
        - $ref: "./openapi.yaml#/components/parameters/HelpDocument"
        - $ref: "./openapi.yaml#/components/parameters/HelpQuery"
      responses:
        "200":
          description: Current authorized representation
          headers:
            X-Surveyor-Context:
              schema:
                type: string
            Content-Language:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "./openapi.yaml#/components/schemas/HelpPageData"
        default:
          $ref: "./openapi.yaml#/components/responses/Problem"
