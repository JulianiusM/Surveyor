schemas:
  Uuid:
    type: string
    format: uuid
  NullableUuid:
    type:
      - string
      - "null"
    format: uuid
  LocaleTag:
    type: string
    minLength: 2
    maxLength: 64
    pattern: ^[A-Za-z]{2,8}(-[A-Za-z0-9]{1,8})*$
  LocaleUpdate:
    type: object
    additionalProperties: false
    required:
      - locale
    properties:
      locale:
        $ref: "#/schemas/LocaleTag"
  FieldError:
    type: object
    additionalProperties: false
    required:
      - pointer
      - code
    properties:
      pointer:
        type: string
        maxLength: 512
      code:
        type: string
        enum:
          - required
          - type
          - format
          - range
          - unknown
          - invalid
  SafeProblemDetails:
    description: Display-only fallback for a newer error; it never grants a known code or parameter type.
    type: object
    additionalProperties: true
    required:
      - type
      - title
      - status
      - detail
      - requestId
    properties:
      type:
        type: string
        format: uri-reference
      title:
        type: string
      status:
        type: integer
        minimum: 400
        maximum: 599
      detail:
        type: string
      requestId:
        type: string
        minLength: 1
        maxLength: 256
  Problem:
    type: object
    additionalProperties: false
    required:
      - type
      - title
      - status
      - detail
      - requestId
      - code
      - messageKey
      - params
    properties:
      type:
        type: string
        format: uri-reference
      title:
        type: string
      status:
        type: integer
      detail:
        type: string
      requestId:
        type: string
        minLength: 1
        maxLength: 256
      code:
        type: string
      messageKey:
        type: string
      params:
        type: object
        additionalProperties: true
      fieldErrors:
        type: array
        maxItems: 20
        items:
          $ref: "#/schemas/FieldError"
    oneOf:
      - properties:
          code: {const: INVALID_CREDENTIALS}
          messageKey: {const: 'api:errors.INVALID_CREDENTIALS'}
          status: {const: 401}
          params: {type: object, additionalProperties: false, maxProperties: 0}
        required: [code, messageKey, status, params]
      - properties:
          code: {const: ACCOUNT_INACTIVE}
          messageKey: {const: 'api:errors.ACCOUNT_INACTIVE'}
          status: {const: 403}
          params: {type: object, additionalProperties: false, maxProperties: 0}
        required: [code, messageKey, status, params]
      - properties:
          code: {const: ACTIVATION_RESENT}
          messageKey: {const: 'api:errors.ACTIVATION_RESENT'}
          status: {const: 403}
          params: {type: object, additionalProperties: false, maxProperties: 0}
        required: [code, messageKey, status, params]
      - properties:
          code: {const: USERNAME_TAKEN}
          messageKey: {const: 'api:errors.USERNAME_TAKEN'}
          status: {const: 409}
          params: {type: object, additionalProperties: false, maxProperties: 0}
        required: [code, messageKey, status, params]
      - properties:
          code: {const: PASSWORD_MISMATCH}
          messageKey: {const: 'api:errors.PASSWORD_MISMATCH'}
          status: {const: 400}
          params: {type: object, additionalProperties: false, maxProperties: 0}
        required: [code, messageKey, status, params]
      - properties:
          code: {const: TOKEN_INVALID}
          messageKey: {const: 'api:errors.TOKEN_INVALID'}
          status: {const: 401}
          params: {type: object, additionalProperties: false, maxProperties: 0}
        required: [code, messageKey, status, params]
      - properties:
