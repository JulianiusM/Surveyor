schemas:
  PublicProfileReference:
    type: object
    additionalProperties: false
    required: [id, name]
    properties:
      id: {$ref: '#/schemas/Uuid'}
      name: {type: string}
  ComparisonToken:
    description: Bounded opaque current-value precondition. Its owning controller checks strong-tag syntax and current authorization before comparison.
    type: string
    minLength: 1
    maxLength: 4096
  FieldComparisonToken:
    description: A field-comparison response uses the same wire bound as If-Match, with its stricter emitted token syntax.
    allOf:
      - $ref: '#/schemas/ComparisonToken'
      - type: string
        pattern: '^"edit-[A-Za-z0-9_-]+"$'
  EntryNotice:
    description: One plain localized page notice. Message keys require no interpolation parameters.
    type: object
    additionalProperties: false
    required: [kind, messageKey]
    properties:
      kind:
        type: string
        enum: [info, error, success]
      messageKey:
        type: string
        minLength: 1
        maxLength: 128
  PageEntryOutcome:
    description: Server-owned page admission, shared by initial HTML and browser navigation. It never authorizes a later command.
    oneOf:
      - type: object
        additionalProperties: false
        required: [kind]
        properties:
          kind: {const: render, type: string}
      - type: object
        additionalProperties: false
        required: [kind, url, notice]
        properties:
          kind: {const: redirect, type: string}
          url: {type: string, minLength: 1, maxLength: 4096}
          notice:
            anyOf:
              - $ref: '#/schemas/EntryNotice'
              - type: 'null'
      - type: object
        additionalProperties: false
        required: [kind, status, messageKey]
        properties:
          kind: {const: denied, type: string}
          status: {type: integer, minimum: 400, maximum: 599}
          messageKey: {type: string, minLength: 1, maxLength: 128}
  DecimalId:
    description: Canonical positive decimal handle for a legacy numeric record; converted only at its owning server boundary.
    type: string
    pattern: ^[1-9][0-9]*$
    maxLength: 16
  Uuid:
    type: string
    format: uuid
  NullableUuid:
    type:
      - string
      - "null"
    format: uuid
  LocaleTag:
    type: string
    minLength: 2
    maxLength: 64
    pattern: ^[A-Za-z]{2,8}(-[A-Za-z0-9]{1,8})*$
  LocaleUpdate:
    type: object
    additionalProperties: false
    required:
      - locale
    properties:
      locale:
        $ref: "#/schemas/LocaleTag"
  FieldDiagnostic:
    description: Safe generated validation metadata. No submitted values, schema locations or parser messages are included.
    type: object
    additionalProperties: false
    required: [field, rule]
    properties:
      field:
        type: string
        enum: [request, title, name, description, username, displayname, email, password, passwordConfirmation, startDate, endDate, date, startTime, endTime, deadline, timezone, capacity, amount, note, reason, distribution, factor, participants, participant, payer, beneficiaries, registration, role, roles, permissions, image, proof, search, page, language, event, combinations, weekday, occurrence, answers, selection, arrival, departure, diet, allergy, comment, travel, meal, activity, sourceActivity, requirements, stay, overrides, recommendations, confirmation, revision, token, status, type, items, position, quantity, visibility, url, transfer, location, assignmentMode, baselineRequirement, requiredActivities, roundingMode, allowOverfillAfterFull, allowExternalAssignees, allowArrivalDayEvening, allowDepartureDayMorning, requiredByAll, assignAll, defaultSetting, subtractPersonalInvoices, sendCalculationEmails, roundUpShares, sendEmails, subtractFromPool, exemptions, requireDietaryInfo, allowDietComment, allowRegDateUpdatesAfterDeadline, allowRegCancelationAfterDeadline, allowRegDietUpdateAfterDeadline, maxUses, expiresAt, operation, assigned, settlementStatus, automaticArchival]
      rule:
        type: string
        enum: [required, nonBlank, type, format, maxLength, minLength, maximum, minimum, exclusiveMaximum, exclusiveMinimum, minItems, maxItems, minProperties, maxProperties, pattern, enum, uniqueItems, additionalProperties, invalid]
      limit: {type: number}
      type: {type: string, enum: [integer, number, string, boolean, array, object, email, date, time, uuid]}
      row: {type: integer, minimum: 1, maximum: 1000000}
  FieldError:
    type: object
    additionalProperties: false
    required:
      - pointer
      - code
    properties:
      pointer:
        type: string
        maxLength: 512
      code:
        type: string
        enum:
          - required
          - type
          - format
          - range
          - unknown
          - invalid
      diagnostic:
        $ref: '#/schemas/FieldDiagnostic'
  SafeProblemDetails:
    description: Display-only fallback for a newer error; it never grants a known code or parameter type.
    type: object
    additionalProperties: true
    required:
      - type
      - title
      - status
      - detail
      - requestId
    properties:
      type:
        type: string
        format: uri-reference
      title:
        type: string
      status:
        type: integer
        minimum: 400
        maximum: 599
      detail:
        type: string
      requestId:
        type: string
        minLength: 1
        maxLength: 256
  Problem:
    type: object
    additionalProperties: false
    required:
      - type
      - title
      - status
      - detail
      - requestId
      - code
      - messageKey
      - params
    properties:
      type:
        type: string
        format: uri-reference
      title:
        type: string
      status:
        type: integer
      detail:
        type: string
      requestId:
        type: string
        minLength: 1
        maxLength: 256
      code:
        type: string
      messageKey:
        type: string
      params:
        type: object
        additionalProperties: true
      fieldErrors:
        type: array
        maxItems: 20
        items:
          $ref: "#/schemas/FieldError"
    oneOf:
      - properties:
          code: {const: WORKFLOW_OUTCOME_UNKNOWN}
          messageKey: {const: 'api:errors.WORKFLOW_OUTCOME_UNKNOWN'}
