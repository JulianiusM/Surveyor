          status: {const: 409}
          params: {type: object, additionalProperties: false, maxProperties: 0}
        required: [code, messageKey, status, params]
      - properties:
          code: {const: INVALID_CREDENTIALS}
          messageKey: {const: 'api:errors.INVALID_CREDENTIALS'}
          status: {const: 401}
          params: {type: object, additionalProperties: false, maxProperties: 0}
        required: [code, messageKey, status, params]
