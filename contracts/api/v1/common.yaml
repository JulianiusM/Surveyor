  EntityCreationEntry:
    type: object
    additionalProperties: false
    required: [entry, context]
    properties:
      entry:
        $ref: '#/schemas/PageEntryOutcome'
      context:
        anyOf:
          - $ref: '#/schemas/EntityCreationContext'
          - type: 'null'
      selectedEvent:
        description: Present only when eventId context was requested. Authorized initial URL selection; a missing or rejected selection is omitted from the creation draft.
        anyOf:
          - $ref: './events.yaml#/schemas/EventPickerOption'
          - type: 'null'

  EntityResourceEntry:
    type: object
    additionalProperties: false
    required: [entry, guest]
    properties:
      entry:
        $ref: '#/schemas/PageEntryOutcome'
      guest:
        anyOf:
          - $ref: ./auth.yaml#/schemas/GuestEntry
          - type: 'null'

  ListAssignee:
    type: object
    additionalProperties: false
    required:
      - name
      - assignmentId
    properties:
      name:
        type: string
      assignmentId:
        anyOf:
          - $ref: '#/schemas/DecimalId'
          - type: "null"

  EntityDescriptionValue:
    type: [string, 'null']
    maxLength: 16000

  BasicEntityMetadataPatch:
    type: object
    additionalProperties: false
    minProperties: 1
    properties:
      title:
        type: string
        minLength: 1
        maxLength: 255
        pattern: \S
      description:
        $ref: '#/schemas/EntityDescriptionValue'

  EntityDescriptionPatch:
    description: Bounded adapter for the independently grantable description method; root properties remain profile-only.
    type: object
    additionalProperties: false
    required: [description]
    properties:
      description:
        $ref: '#/schemas/EntityDescriptionValue'

  EntityDescriptionBaseline:
    description: Only the method-authorized description and its actor/resource-bound field precondition; no root title, event or archival context.
    type: object
    additionalProperties: false
    required: [description, editToken]
    properties:
      description:
        type: [string, 'null']
      editToken:
        $ref: '#/schemas/FieldComparisonToken'

  EntityPermissionDefaultsBaseline:
    description: Audience masks independently authorized by MANAGE_PERMISSIONS; excludes roster, header, parent and root metadata.
    type: object
    additionalProperties: false
    required: [defaultPermissions, editToken]
    properties:
      defaultPermissions:
        $ref: '#/schemas/PermissionDefaults'
      editToken:
        $ref: '#/schemas/FieldComparisonToken'

  EntityAdministratorBaseline:
    description: One selected administrator mask, or null for the new-administrator comparison marker; no roster or profile presentation.
    type: object
    additionalProperties: false
    required: [mask, editToken]
    properties:
      mask:
        type: [integer, 'null']
        minimum: 0
        maximum: 2147483647
      editToken:
        $ref: '#/schemas/FieldComparisonToken'

  EntityHeaderBaseline:
    description: Method-authorized header field hash only; contains no stored path, image bytes, root title or parent context.
    type: object
    additionalProperties: false
    required: [editToken]
    properties:
      editToken:
        $ref: '#/schemas/FieldComparisonToken'

  ListAssignmentResult:
    type: object
    additionalProperties: false
    required:
      - listId
      - itemId
      - selfAssigned
      - assignedCount
      - maxAssignees
    properties:
      listId:
        $ref: '#/schemas/Uuid'
      itemId:
        $ref: '#/schemas/Uuid'
      selfAssigned:
        type: boolean
      assignedCount:
        type: integer
        minimum: 0
      maxAssignees:
        type:
          - integer
          - "null"

  PermissionDefaults:
    type: object
    additionalProperties: false
    required:
      - public
      - guest
      - authenticated
      - participant
    properties:
      public:
        type: integer
        minimum: 0
        maximum: 2147483647
      guest:
        type: integer
        minimum: 0
        maximum: 2147483647
      authenticated:
        type: integer
        minimum: 0
        maximum: 2147483647
      participant:
        type: integer
        minimum: 0
        maximum: 2147483647

  PermissionDefaultsPatch:
    type: object
    additionalProperties: false
    minProperties: 1
    description: Changed audience masks only. Unchanged audiences are retained and do not conflict with independent edits.
    properties:
      public:
        type: integer
        minimum: 0
        maximum: 2147483647
      guest:
        type: integer
        minimum: 0
        maximum: 2147483647
      authenticated:
        type: integer
        minimum: 0
        maximum: 2147483647
      participant:
        type: integer
        minimum: 0
        maximum: 2147483647

  PermissionDefinition:
    type: object
    additionalProperties: false
    required:
      - key
      - bit
    properties:
      key:
        type: string
      bit:
        type: integer
        minimum: 1

  PermissionPreset:
    type: object
    additionalProperties: false
    required:
      - key
      - mask
    properties:
      key:
        type: string
      mask:
        type: integer
        minimum: 0

  EntityCreationContext:
    type: object
    additionalProperties: false
    required:
      - defaults
      - permissions
      - presets
    properties:
      maxDurationDays:
        description: Optional server-selected inclusive date limit for forms with a duration policy; never grants authority to write.
        type: integer
        minimum: 1
      defaults:
        $ref: "#/schemas/PermissionDefaults"
      permissions:
        type: array
        items:
          $ref: "#/schemas/PermissionDefinition"
      presets:
        type: array
        items:
          $ref: "#/schemas/PermissionPreset"

  EntityCreationResult:
    type: object
    additionalProperties: false
    required:
      - id
    properties:
      id:
        $ref: '#/schemas/Uuid'

  MutationResult:
    type: object
    additionalProperties: false
    required:
      - changed
    properties:
      changed:
        type: boolean

  ListOrderBaseline:
    description: Method-authorized reorder baseline containing only ordered item identifiers, positions and the existing actor-bound order token.
    type: object
    additionalProperties: false
    required: [items, orderToken]
    properties:
      items:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [id, position]
          properties:
            id:
              $ref: '#/schemas/Uuid'
            position:
              $ref: '#/schemas/position'
      orderToken:
        $ref: '#/schemas/orderToken'

  ListItemOrderInput:
    type: object
    additionalProperties: false
    required:
      - itemIds
    properties:
      itemIds:
        type: array
        items:
          $ref: '#/schemas/Uuid'
        uniqueItems: true

  EntityEventChangeInput:
    type: object
    additionalProperties: false
    required:
      - eventId
      - expectedEventId
    properties:
      eventId:
        $ref: '#/schemas/NullableUuid'
      expectedEventId:
        $ref: '#/schemas/NullableUuid'

  EntityEventChangeResult:
    type: object
    additionalProperties: false
    required:
      - changed
      - canView
    properties:
      changed:
        type: boolean
      canView:
        type: boolean

  EntityAdministratorProfileOption:
    type: object
    additionalProperties: false
    required:
      - profileId
      - name
      - isGuest
      - username
    properties:
      profileId:
        $ref: '#/schemas/Uuid'
      name:
        type: string
      isGuest:
        type: boolean
      username:
        type: string

  EntityAdministratorProfileOptions:
    type: array
    items:
      $ref: "#/schemas/EntityAdministratorProfileOption"

  EntityAdministrator:
    type: object
    additionalProperties: false
    required:
      - profileId
      - name
      - isGuest
      - mask
      - editToken
    properties:
      profileId:
        $ref: '#/schemas/Uuid'
      name:
        type: string
      isGuest:
        type: boolean
      mask:
        type: integer
        minimum: 0
      editToken:
        $ref: '#/schemas/FieldComparisonToken'

  EntityAdministratorInput:
    type: object
    additionalProperties: false
    required:
      - profileId
      - mask
    properties:
      profileId:
        $ref: '#/schemas/Uuid'
      mask:
        type: integer
        minimum: 0
        maximum: 2147483647

  EntityAdministratorPatch:
    type: object
    additionalProperties: false
    required:
      - mask
    properties:
      mask:
        type: integer
        minimum: 0
        maximum: 2147483647

  EntityCurrentEvent:
    type: object
    additionalProperties: false
    required:
      - id
      - title
      - startDate
      - endDate
      - url
    properties:
      id:
        $ref: '#/schemas/Uuid'
      title:
        type:
          - string
          - "null"
      startDate:
        type:
          - string
          - "null"
      endDate:
        type:
          - string
          - "null"
      url:
        type:
          - string
          - "null"

  EntityArchive:
    type: object
    additionalProperties: false
    required:
      - direct
      - inherited
      - archivedAt
      - autoArchivePaused
      - eventUrl
    properties:
      direct:
        type: boolean
      inherited:
        type: boolean
      archivedAt:
        type:
          - string
          - "null"
      autoArchivePaused:
        type: boolean
      eventUrl:
        type:
          - string
          - "null"

  EntityAccess:
    type: object
    additionalProperties: false
    required:
      - defaults
      - admins
      - permissions
      - presets
    properties:
      defaults:
        $ref: "#/schemas/PermissionDefaults"
      admins:
        type: array
        items:
          $ref: "#/schemas/EntityAdministrator"
      permissions:
        type: array
        items:
          $ref: "#/schemas/PermissionDefinition"
      presets:
        type: array
        items:
          $ref: "#/schemas/PermissionPreset"

  ListSettings:
    type: object
    additionalProperties: false
    required:
      - id
      - title
      - headerUrl
      - editableFields
      - capabilities
      - currentEvent
      - archive
      - access
      - headerVersion
      - settingsToken
    properties:
      id:
        $ref: '#/schemas/Uuid'
      title:
        type: string
      headerUrl:
        type:
          - string
          - "null"
      editableFields:
        type: array
        uniqueItems: true
        items:
          type: string
          enum:
            - title
            - description
      capabilities:
        type: object
        additionalProperties: false
        required:
          - editHeader
          - linkEvent
          - managePermissions
          - duplicate
          - remove
          - archive
          - restore
          - manageArchive
        properties:
          editHeader:
            type: boolean
          linkEvent:
            type: boolean
          managePermissions:
            type: boolean
          duplicate:
            type: boolean
          remove:
            type: boolean
          archive:
            type: boolean
          restore:
            type: boolean
          manageArchive:
            type: boolean
      currentEvent:
        $ref: '#/schemas/NullableEntityCurrentEvent'
      archive:
        $ref: "#/schemas/EntityArchive"
      access:
        $ref: '#/schemas/NullableEntityAccess'
      headerVersion:
        type:
          - string
          - "null"
        description: Opaque image version; changes when the image is replaced without exposing its storage path.
      settingsToken:
        $ref: '#/schemas/FieldComparisonToken'

  EntityHeaderUpload:
    type: object
    additionalProperties: false
    required:
      - image
    properties:
      image:
        type: string
        format: binary

  EntityHeaderBinary:
    type: string
    format: binary

  # Retain the previously generated public scalar identifiers after relocation.
  position:
    type: integer
  orderToken:
    type: string

  NullableEntityCurrentEvent:
    anyOf:
      - $ref: '#/schemas/EntityCurrentEvent'
      - type: 'null'

  NullableEntityAccess:
    anyOf:
      - $ref: '#/schemas/EntityAccess'
      - type: 'null'

  AutomaticArchivalInput:
    type: object
    additionalProperties: false
    required:
      - paused
    properties:
      paused:
        type: boolean


  EntityCard:
    type: object
    additionalProperties: false
    required: [id, type, title, description, url, headerUrl, headerVersion, eventContext, visibility, overviewHidden, archived, inheritedArchived, capabilities, children]
    properties:
      id: {type: string, format: uuid}
      type: {type: string, enum: [activity, drivers, event, packing, survey]}
      title: {type: string}
      description: {type: [string, 'null']}
      url: {type: string}
      headerUrl: {type: [string, 'null']}
      headerVersion: {type: [string, 'null']}
      eventContext:
        anyOf:
          - type: object
            additionalProperties: false
            required: [title, url]
            properties:
              title: {type: string}
              url: {type: string}
          - type: 'null'
      visibility: {type: string, enum: [default, hidden, shown]}
      overviewHidden: {type: boolean}
      archived: {type: boolean}
      inheritedArchived: {type: boolean}
      automation:
        description: Optional schedule context for Event Things to do, or schedule-management controls admitted on personal Overview cards.
        type: object
        additionalProperties: false
        required: [paused, canManage]
        properties:
          paused: {type: boolean}
          canManage: {type: boolean}
      capabilities:
        type: object
        additionalProperties: false
        required: [archive, restore, duplicate, remove]
        properties:
          archive: {type: boolean}
          restore: {type: boolean}
          duplicate: {type: boolean}
          remove: {type: boolean}
      children:
        description: Eligible children in this collection/region; matching applies the selected type and search.
        anyOf:
          - type: object
            additionalProperties: false
            required: [total, matching]
            properties:
              total: {type: integer, minimum: 0}
              matching: {type: integer, minimum: 0}
          - type: 'null'

parameters:
  Context:
    in: header
    name: X-Surveyor-Context
    required: false
    description: Required when the server session has context evidence. Sessionless
      public requests and initial identity actions omit it; omission never
      selects an anonymous actor or grants permission.
    schema:
      type: string
      minLength: 1
      maxLength: 256
  Locale:
    in: header
    name: X-Surveyor-Locale
    required: false
    schema:
      $ref: "#/schemas/LocaleTag"
  Csrf:
    in: header
    name: X-CSRF-Token
    required: false
    description: Required for mutations when the server session has CSRF evidence.
      Sessionless actions retain server-owned origin and request protections;
      omission never bypasses authentication or authorization.
    schema:
      type: string
      minLength: 1
      maxLength: 256
  ListId:
    in: path
    name: listId
    required: true
    schema:
      $ref: "#/schemas/Uuid"
  ItemId:
    in: path
    name: itemId
    required: true
    schema:
      $ref: "#/schemas/Uuid"
  IfMatch:
    in: header
    name: If-Match
    required: true
    schema:
      $ref: "#/schemas/ComparisonToken"
  EventIfMatch:
    in: header
    name: If-Match
    required: false
    description: Ignored for an authorized unchanged choice, which returns without
      comparing or writing. An actual relationship change requires a
      ComparisonToken and current-value comparison under the existing locks.
    schema:
      type: string
  IfNoneMatch:
    in: header
    name: If-None-Match
    required: false
    schema:
      type: string
      maxLength: 4096
  ProfileId:
    in: path
    name: profileId
    required: true
    schema:
      $ref: "#/schemas/Uuid"
  AssignmentId:
    in: path
    name: assignmentId
    required: true
    schema:
      $ref: "#/schemas/DecimalId"
  SearchQuery:
    in: query
    name: q
    required: false
    schema:
      type: string
  SelectedEvent:
    in: query
    name: selected
    required: false
    schema:
      $ref: "#/schemas/Uuid"
responses:
  Problem:
    description: A safe localized RFC 9457 problem; machine code controls recovery
    content:
      application/problem+json:
        schema:
          $ref: "#/schemas/Problem"
