schemas:
  OverviewCard:
    $ref: ./common.yaml#/schemas/EntityCard
  OverviewRegion:
    type: object
    additionalProperties: false
    required: [collection, region, q, type, availableTypes, page, childPage, eventId, pageSize, totalEntities, hiddenEntities, regionEntities, matchingEntities, totalCards, totalChildren, hasPrevious, hasNext, parent, items]
    properties:
      collection: {type: string, enum: [participant, owner]}
      region: {type: string, enum: [main, hidden]}
      q: {type: string}
      type: {type: string, enum: [all, activity, drivers, event, packing, survey]}
      availableTypes:
        type: array
        uniqueItems: true
        items: {type: string, enum: [activity, drivers, event, packing, survey]}
      page: {type: integer, minimum: 1}
      childPage: {type: integer, minimum: 1}
      eventId: {type: [string, 'null'], format: uuid}
      pageSize: {type: integer, minimum: 1}
      totalEntities:
        type: integer
        minimum: 0
        description: Overview collection total across all entity types before search and type selection.
      hiddenEntities:
        type: integer
        minimum: 0
        description: Hidden collection total across all entity types before search and type selection.
      regionEntities:
        type: integer
        minimum: 0
        description: Visibility-region total across all entity types before search and type selection.
      matchingEntities: {type: integer, minimum: 0, description: 'Authorized roots matching this region, selected type and search.'}
      totalCards: {type: integer, minimum: 0, description: Matching cards after eligible event grouping.}
      totalChildren: {type: integer, minimum: 0}
      hasPrevious: {type: boolean}
      hasNext: {type: boolean}
      parent:
        anyOf:
          - {$ref: '#/schemas/OverviewCard'}
          - {type: 'null'}
      items:
        type: array
        items: {$ref: '#/schemas/OverviewCard'}
  OverviewVisibilityInput:
    type: object
    additionalProperties: false
    required: [visibility]
    properties:
      visibility: {type: string, enum: [default, hidden, shown]}
  OverviewVisibilityResult:
    type: object
    additionalProperties: false
    required: [visibility, overviewHidden, archived]
    properties:
      visibility: {type: string, enum: [default, hidden, shown]}
      overviewHidden: {type: boolean}
      archived: {type: boolean}
paths:
  overview:
    get:
      operationId: getOverview

      x-surveyor-command: {retryPolicy: read, precondition: none}
      summary: Read one bounded mixed overview region for the admitted profile
      parameters:
        - {$ref: "./common.yaml#/parameters/Context"}
        - {$ref: "./common.yaml#/parameters/Locale"}
        - {name: collection, in: query, required: true, schema: {type: string, enum: [participant, owner]}}
        - {name: region, in: query, required: true, schema: {type: string, enum: [main, hidden]}}
        - {name: q, in: query, required: false, schema: {type: string, maxLength: 200}}
        - {name: type, in: query, required: false, schema: {type: string, enum: [all, activity, drivers, event, packing, survey]}}
        - {name: page, in: query, required: false, schema: {type: string, pattern: '^(?:[1-9]\d{0,5}|1000000)$'}}
        - {name: childPage, in: query, required: false, schema: {type: string, pattern: '^(?:[1-9]\d{0,5}|1000000)$'}}
        - {name: eventId, in: query, required: false, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Authorized entity cards and eligible event containers; no account or persistence objects.
          content:
            application/json:
              schema: {$ref: '#/schemas/OverviewRegion'}
        default: {$ref: "./common.yaml#/responses/Problem"}
  visibility:
    put:
      operationId: setOverviewVisibility

      x-surveyor-command: {retryPolicy: natural-idempotent, precondition: none}
      summary: Set only the admitted profile's overview visibility preference
      parameters:
        - {$ref: "./common.yaml#/parameters/Context"}
        - {$ref: "./common.yaml#/parameters/Locale"}
        - {$ref: "./common.yaml#/parameters/Csrf"}
        - {name: entityType, in: path, required: true, schema: {type: string, enum: [activity, drivers, event, packing, survey]}}
        - {name: entityId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/schemas/OverviewVisibilityInput'}
      responses:
        '200':
          description: The saved personal preference and current shared archival state remain separate.
          content:
            application/json:
              schema: {$ref: '#/schemas/OverviewVisibilityResult'}
        default: {$ref: "./common.yaml#/responses/Problem"}
