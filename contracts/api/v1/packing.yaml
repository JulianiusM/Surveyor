schemas:
  PackingCreateEntry:
    type: object
    additionalProperties: false
    required: [entry, context]
    properties:
      entry:
        $ref: ./common.yaml#/schemas/PageEntryOutcome
      context:
        anyOf:
          - $ref: '#/schemas/PackingCreateContext'
          - type: 'null'
      selectedEvent:
        description: Present only when eventId context was requested. Authorized initial URL selection; a missing or rejected selection is omitted from the creation draft.
        anyOf:
          - $ref: './common.yaml#/schemas/EventPickerOption'
          - type: 'null'
  PackingResourceEntry:
    type: object
    additionalProperties: false
    required: [entry, guest]
    properties:
      entry:
        $ref: ./common.yaml#/schemas/PageEntryOutcome
      guest:
        anyOf:
          - $ref: ./auth.yaml#/schemas/GuestEntry
          - type: 'null'
  PackingAssignee:
    type: object
    additionalProperties: false
    required:
      - name
      - assignmentId
    properties:
      name:
        type: string
      assignmentId:
        anyOf:
          - $ref: ./common.yaml#/schemas/DecimalId
          - type: "null"
  PackingItemView:
    type: object
    additionalProperties: false
    required:
      - id
      - title
      - description
      - position
      - requiredByAll
      - maxAssignees
      - assignedCount
      - selfAssigned
      - assignees
      - capabilities
      - editToken
    properties:
      id:
        $ref: ./common.yaml#/schemas/Uuid
      title:
        type: string
      description:
        type:
          - string
          - "null"
      position:
        type: integer
      requiredByAll:
        type: boolean
      maxAssignees:
        type:
          - integer
          - "null"
      assignedCount:
        type: integer
        minimum: 0
      selfAssigned:
        type: boolean
      assignees:
        type: array
        items:
          $ref: "#/schemas/PackingAssignee"
      capabilities:
        type: object
        additionalProperties: false
        required:
          - showTitleEdit
          - showCapacityEdit
          - editTitle
          - editDescription
          - editCapacity
          - editRequired
          - removeItem
          - removeAssignments
        properties:
          showTitleEdit:
            type: boolean
            description: Original native title-control visibility; command authorization is independently editTitle.
          showCapacityEdit:
            type: boolean
            description: Original native capacity-control visibility; command authorization is independently editCapacity.
          editTitle:
            type: boolean
          editDescription:
            type: boolean
          editCapacity:
            type: boolean
          editRequired:
            type: boolean
          removeItem:
            type: boolean
          removeAssignments:
            type: boolean
      editToken:
        $ref: ./common.yaml#/schemas/FieldComparisonToken
  PackingListView:
    type: object
    additionalProperties: false
    required:
      - entityType
      - id
      - title
      - description
      - headerUrl
      - currentEventId
      - currentEventUrl
      - archived
      - inheritedArchived
      - capabilities
      - counters
      - items
      - orderToken
      - headerVersion
    properties:
      entityType:
        type: string
        const: packing
      id:
        $ref: ./common.yaml#/schemas/Uuid
      title:
        type: string
      description:
        type:
          - string
          - "null"
      headerUrl:
        type:
          - string
          - "null"
      currentEventId:
        $ref: ./common.yaml#/schemas/NullableUuid
      currentEventUrl:
        type:
          - string
          - "null"
      archived:
        type: boolean
      inheritedArchived:
        type: boolean
      capabilities:
        type: object
        additionalProperties: false
        required:
          - editTitle
          - editDescription
          - selfAssign
          - addItem
          - reorder
          - manageSettings
        properties:
          editTitle:
            type: boolean
          editDescription:
            type: boolean
          selfAssign:
            type: boolean
          addItem:
            type: boolean
          reorder:
            type: boolean
          manageSettings:
            type: boolean
      counters:
        type: object
        additionalProperties: false
        required:
          - participants
          - open
          - empty
        properties:
          participants:
            type: integer
            minimum: 0
          open:
            type: integer
            minimum: 0
          empty:
            type: integer
            minimum: 0
      items:
        type: array
        items:
          $ref: "#/schemas/PackingItemView"
      orderToken:
        type: string
      headerVersion:
        type:
          - string
          - "null"
        description: Opaque image version; changes when the image is replaced without exposing its storage path.
  PackingMetadata:
    type: object
    additionalProperties: false
    required:
      - entityType
      - id
      - values
      - editableFields
      - currentEventId
      - archived
      - inheritedArchived
    properties:
      entityType:
        type: string
        const: packing
      id:
        $ref: ./common.yaml#/schemas/Uuid
      values:
        type: object
        additionalProperties: false
        properties:
          title:
            type: string
          description:
            type:
              - string
              - "null"
      editableFields:
        type: array
        uniqueItems: true
        items:
          type: string
          enum:
            - title
            - description
      currentEventId:
        $ref: ./common.yaml#/schemas/NullableUuid
      archived:
        type: boolean
      inheritedArchived:
        type: boolean
  PackingDescriptionValue:
    type: [string, 'null']
    maxLength: 16000
  PackingMetadataPatch:
    type: object
    additionalProperties: false
    minProperties: 1
    properties:
      title:
        type: string
        minLength: 1
        maxLength: 255
        pattern: \S
      description:
        $ref: '#/schemas/PackingDescriptionValue'
  PackingDescriptionPatch:
    description: Bounded adapter for the independently grantable native description method; root properties remain profile-only.
    type: object
    additionalProperties: false
    required: [description]
    properties:
      description:
        $ref: '#/schemas/PackingDescriptionValue'
  PackingDescriptionBaseline:
    description: Only the method-authorized description and its actor/resource-bound field precondition; no root title, event or archival context.
    type: object
    additionalProperties: false
    required: [description, editToken]
    properties:
      description:
        type: [string, 'null']
      editToken:
        $ref: '#/schemas/PackingItemView/properties/editToken'
  PackingDefaultsBaseline:
    description: Audience masks independently authorized by MANAGE_PERMISSIONS; excludes roster, header, parent and root metadata.
    type: object
    additionalProperties: false
    required: [defaultPermissions, editToken]
    properties:
      defaultPermissions:
        $ref: '#/schemas/PermissionDefaults'
      editToken:
        $ref: '#/schemas/PackingItemView/properties/editToken'
  PackingAdminBaseline:
    description: One selected administrator mask, or null for the new-administrator comparison marker; no roster or profile presentation.
    type: object
    additionalProperties: false
    required: [mask, editToken]
    properties:
      mask:
        type: [integer, 'null']
        minimum: 0
        maximum: 2147483647
      editToken:
        $ref: '#/schemas/PackingItemView/properties/editToken'
  PackingHeaderBaseline:
    description: Method-authorized header field hash only; contains no stored path, image bytes, root title or parent context.
    type: object
    additionalProperties: false
    required: [editToken]
    properties:
      editToken:
        $ref: '#/schemas/PackingItemView/properties/editToken'
  PackingAssignmentResult:
    type: object
    additionalProperties: false
    required:
      - listId
      - itemId
      - selfAssigned
      - assignedCount
      - maxAssignees
    properties:
      listId:
        $ref: ./common.yaml#/schemas/Uuid
      itemId:
        $ref: ./common.yaml#/schemas/Uuid
      selfAssigned:
        type: boolean
      assignedCount:
        type: integer
        minimum: 0
      maxAssignees:
        type:
          - integer
          - "null"
  PermissionDefaults:
    type: object
    additionalProperties: false
    required:
      - public
      - guest
      - authenticated
      - participant
    properties:
      public:
        type: integer
        minimum: 0
        maximum: 2147483647
      guest:
        type: integer
        minimum: 0
        maximum: 2147483647
      authenticated:
        type: integer
        minimum: 0
        maximum: 2147483647
      participant:
        type: integer
        minimum: 0
        maximum: 2147483647
  PermissionDefaultsPatch:
    type: object
    additionalProperties: false
    minProperties: 1
    description: Changed audience masks only. Unchanged audiences are retained and do not conflict with independent edits.
    properties:
      public:
        type: integer
        minimum: 0
        maximum: 2147483647
      guest:
        type: integer
        minimum: 0
        maximum: 2147483647
      authenticated:
        type: integer
        minimum: 0
        maximum: 2147483647
      participant:
        type: integer
        minimum: 0
        maximum: 2147483647
  PermissionDefinition:
    type: object
    additionalProperties: false
    required:
      - key
      - bit
    properties:
      key:
        type: string
      bit:
        type: integer
        minimum: 1
  PermissionPreset:
    type: object
    additionalProperties: false
    required:
      - key
      - mask
    properties:
      key:
        type: string
      mask:
        type: integer
        minimum: 0
  PackingCreateContext:
    type: object
    additionalProperties: false
    required:
      - defaults
      - permissions
      - presets
    properties:
      defaults:
        $ref: "#/schemas/PermissionDefaults"
      permissions:
        type: array
        items:
          $ref: "#/schemas/PermissionDefinition"
      presets:
        type: array
        items:
          $ref: "#/schemas/PermissionPreset"
  PackingNewItem:
    type: object
    additionalProperties: false
    required:
      - title
      - description
      - maxAssignees
      - requiredByAll
    properties:
      title:
        type: string
        minLength: 1
        maxLength: 255
      description:
        type:
          - string
          - "null"
        maxLength: 65535
      maxAssignees:
        type: integer
        minimum: 1
        maximum: 2147483647
      requiredByAll:
        type: boolean
  PackingCreateInput:
    type: object
    additionalProperties: false
    required:
      - title
      - description
      - eventId
      - items
      - defaultPermissions
    properties:
      title:
        type: string
        minLength: 1
        maxLength: 255
      description:
        type:
          - string
          - "null"
        maxLength: 65535
      eventId:
        $ref: ./common.yaml#/schemas/NullableUuid
      items:
        type: array
        items:
          $ref: "#/schemas/PackingNewItem"
        minItems: 1
      defaultPermissions:
        $ref: "#/schemas/PermissionDefaults"
  PackingCreated:
    type: object
    additionalProperties: false
    required:
      - id
    properties:
      id:
        $ref: ./common.yaml#/schemas/Uuid
  MutationResult:
    type: object
    additionalProperties: false
    required:
      - changed
    properties:
      changed:
        type: boolean
  PackingItemPatch:
    type: object
    additionalProperties: false
    required: []
    properties:
      title:
        type: string
        maxLength: 255
      description:
        type:
          - string
          - "null"
        maxLength: 65535
      maxAssignees:
        description: Existing native inline edits carry a numeric value, the number control's raw string draft, or null. The existing signed nullable integer column retains native rounding and rejects invalid/overflow values. New-item creation has its separate positive integer policy.
        anyOf:
          - type: number
          - type: string
          - type: "null"
      requiredByAll:
        type: boolean
    minProperties: 1
  PackingItemEditBaseline:
    description: Method-authorized edit baseline independent of detail-page admission. Values and hashes include only fields currently permitted by the item's existing method policy.
    type: object
    additionalProperties: false
    required: [id, values, editableFields, editToken]
    properties:
      id:
        $ref: ./common.yaml#/schemas/Uuid
      values:
        type: object
        additionalProperties: false
        minProperties: 1
        properties:
          title:
            $ref: '#/schemas/PackingItemView/properties/title'
          description:
            $ref: '#/schemas/PackingItemView/properties/description'
          maxAssignees:
            $ref: '#/schemas/PackingItemView/properties/maxAssignees'
          requiredByAll:
            $ref: '#/schemas/PackingItemView/properties/requiredByAll'
      editableFields:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: string
          enum: [title, description, maxAssignees, requiredByAll]
      editToken:
        $ref: '#/schemas/PackingItemView/properties/editToken'
  PackingOrderEditBaseline:
    description: Method-authorized reorder baseline containing only ordered item identifiers, positions and the existing actor-bound order token.
    type: object
    additionalProperties: false
    required: [items, orderToken]
    properties:
      items:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [id, position]
          properties:
            id:
              $ref: '#/schemas/PackingItemView/properties/id'
            position:
              $ref: '#/schemas/PackingItemView/properties/position'
      orderToken:
        $ref: '#/schemas/PackingListView/properties/orderToken'
  PackingItemOrder:
    type: object
    additionalProperties: false
    required:
      - itemIds
    properties:
      itemIds:
        type: array
        items:
          $ref: ./common.yaml#/schemas/Uuid
        uniqueItems: true
  PackingEventChange:
    type: object
    additionalProperties: false
    required:
      - eventId
      - expectedEventId
    properties:
      eventId:
        $ref: ./common.yaml#/schemas/NullableUuid
      expectedEventId:
        $ref: ./common.yaml#/schemas/NullableUuid
  PackingEventChanged:
    type: object
    additionalProperties: false
    required:
      - changed
      - canView
    properties:
      changed:
        type: boolean
      canView:
        type: boolean
  PackingProfileOption:
    type: object
    additionalProperties: false
    required:
      - profileId
      - name
      - isGuest
      - username
    properties:
      profileId:
        $ref: ./common.yaml#/schemas/Uuid
      name:
        type: string
      isGuest:
        type: boolean
      username:
        type: string
  PackingProfileOptions:
    type: array
    items:
      $ref: "#/schemas/PackingProfileOption"
  PackingAdmin:
    type: object
    additionalProperties: false
    required:
      - profileId
      - name
      - isGuest
      - mask
      - editToken
    properties:
      profileId:
        $ref: ./common.yaml#/schemas/Uuid
      name:
        type: string
      isGuest:
        type: boolean
      mask:
        type: integer
        minimum: 0
      editToken:
        $ref: ./common.yaml#/schemas/FieldComparisonToken
  PackingAdminInput:
    type: object
    additionalProperties: false
    required:
      - profileId
      - mask
    properties:
      profileId:
        $ref: ./common.yaml#/schemas/Uuid
      mask:
        type: integer
        minimum: 0
        maximum: 2147483647
  PackingAdminPatch:
    type: object
    additionalProperties: false
    required:
      - mask
    properties:
      mask:
        type: integer
        minimum: 0
        maximum: 2147483647
  PackingCurrentEvent:
    type: object
    additionalProperties: false
    required:
      - id
      - title
      - startDate
      - endDate
      - url
    properties:
      id:
        $ref: ./common.yaml#/schemas/Uuid
      title:
        type:
          - string
          - "null"
      startDate:
        type:
          - string
          - "null"
      endDate:
        type:
          - string
          - "null"
      url:
        type:
          - string
          - "null"
  PackingArchive:
    type: object
    additionalProperties: false
    required:
      - direct
      - inherited
      - archivedAt
      - autoArchivePaused
      - eventUrl
    properties:
      direct:
        type: boolean
      inherited:
        type: boolean
      archivedAt:
        type:
          - string
          - "null"
      autoArchivePaused:
        type: boolean
      eventUrl:
        type:
          - string
          - "null"
  PackingAccess:
    type: object
    additionalProperties: false
    required:
      - defaults
      - admins
      - permissions
      - presets
    properties:
      defaults:
        $ref: "#/schemas/PermissionDefaults"
      admins:
        type: array
        items:
          $ref: "#/schemas/PackingAdmin"
      permissions:
        type: array
        items:
          $ref: "#/schemas/PermissionDefinition"
      presets:
        type: array
        items:
          $ref: "#/schemas/PermissionPreset"
  PackingSettings:
    type: object
    additionalProperties: false
    required:
      - id
      - title
      - headerUrl
      - editableFields
      - capabilities
      - currentEvent
      - archive
      - access
      - headerVersion
      - settingsToken
    properties:
      id:
        $ref: ./common.yaml#/schemas/Uuid
      title:
        type: string
      headerUrl:
        type:
          - string
          - "null"
      editableFields:
        type: array
        uniqueItems: true
        items:
          type: string
          enum:
            - title
            - description
      capabilities:
        type: object
        additionalProperties: false
        required:
          - editHeader
          - linkEvent
          - managePermissions
          - duplicate
          - remove
          - archive
          - restore
          - manageArchive
        properties:
          editHeader:
            type: boolean
          linkEvent:
            type: boolean
          managePermissions:
            type: boolean
          duplicate:
            type: boolean
          remove:
            type: boolean
          archive:
            type: boolean
          restore:
            type: boolean
          manageArchive:
            type: boolean
      currentEvent:
        anyOf:
          - $ref: "#/schemas/PackingCurrentEvent"
          - type: "null"
      archive:
        $ref: "#/schemas/PackingArchive"
      access:
        anyOf:
          - $ref: "#/schemas/PackingAccess"
          - type: "null"
      headerVersion:
        type:
          - string
          - "null"
        description: Opaque image version; changes when the image is replaced without exposing its storage path.
      settingsToken:
        $ref: ./common.yaml#/schemas/FieldComparisonToken
  PackingHeaderUpload:
    type: object
    additionalProperties: false
    required:
      - image
    properties:
      image:
        type: string
        format: binary
  PackingHeaderBinary:
    type: string
    format: binary
  PackingCreateForm:
    type: object
    additionalProperties: false
    required:
      - data
    properties:
      data:
        $ref: "#/schemas/PackingCreateInput"
      image:
        type: string
        format: binary
  PackingDuplicate:
    type: object
    additionalProperties: false
    required:
      - title
      - description
      - eventId
      - items
      - defaultPermissions
      - formContext
    properties:
      title:
        type: string
        maxLength: 255
      description:
        type:
          - string
          - "null"
        maxLength: 65535
      eventId:
        $ref: ./common.yaml#/schemas/NullableUuid
      items:
        type: array
        items:
          $ref: "#/schemas/PackingDuplicateItem"
      defaultPermissions:
        $ref: "#/schemas/PermissionDefaults"
      formContext:
        $ref: "#/schemas/PackingCreateContext"
      selectedEvent:
        description: Present only when eventId context was requested. Authorized initial URL selection, independently of the duplicated source's parent event.
        anyOf:
          - $ref: './common.yaml#/schemas/EventPickerOption'
          - type: 'null'
    description: Draft copied from persisted rows, including cleared titles and historical invalid capacity. Creation validates the edited
      draft independently.
  PackingDuplicateItem:
    type: object
    additionalProperties: false
    required:
      - title
      - description
      - maxAssignees
      - requiredByAll
    properties:
      title:
        type: string
        maxLength: 255
      description:
        type:
          - string
          - "null"
        maxLength: 65535
      maxAssignees:
        type:
          - integer
          - "null"
      requiredByAll:
        type: boolean
