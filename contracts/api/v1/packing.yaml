schemas:
  PackingCreateEntry:
    $ref: ./common.yaml#/schemas/PackingCreateEntry
  PackingResourceEntry:
    $ref: ./common.yaml#/schemas/PackingResourceEntry
  PackingAssignee:
    $ref: ./common.yaml#/schemas/PackingAssignee
  PackingItemView:
    type: object
    additionalProperties: false
    required:
      - id
      - title
      - description
      - position
      - requiredByAll
      - maxAssignees
      - assignedCount
      - selfAssigned
      - assignees
      - capabilities
      - editToken
    properties:
      id:
        $ref: ./common.yaml#/schemas/Uuid
      title:
        type: string
      description:
        type:
          - string
          - "null"
      position:
        $ref: ./common.yaml#/schemas/position
      requiredByAll:
        type: boolean
      maxAssignees:
        type:
          - integer
          - "null"
      assignedCount:
        type: integer
        minimum: 0
      selfAssigned:
        type: boolean
      assignees:
        type: array
        items:
          $ref: "#/schemas/PackingAssignee"
      capabilities:
        type: object
        additionalProperties: false
        required:
          - showTitleEdit
          - showCapacityEdit
          - editTitle
          - editDescription
          - editCapacity
          - editRequired
          - removeItem
          - removeAssignments
        properties:
          showTitleEdit:
            type: boolean
            description: Title-control visibility; command authorization is independently editTitle.
          showCapacityEdit:
            type: boolean
            description: Capacity-control visibility; command authorization is independently editCapacity.
          editTitle:
            type: boolean
          editDescription:
            type: boolean
          editCapacity:
            type: boolean
          editRequired:
            type: boolean
          removeItem:
            type: boolean
          removeAssignments:
            type: boolean
      editToken:
        $ref: ./common.yaml#/schemas/FieldComparisonToken
  PackingListView:
    type: object
    additionalProperties: false
    required:
      - entityType
      - id
      - title
      - description
      - headerUrl
      - currentEventId
      - currentEventUrl
      - archived
      - inheritedArchived
      - capabilities
      - counters
      - items
      - orderToken
      - headerVersion
    properties:
      entityType:
        type: string
        const: packing
      id:
        $ref: ./common.yaml#/schemas/Uuid
      title:
        type: string
      description:
        type:
          - string
          - "null"
      headerUrl:
        type:
          - string
          - "null"
      currentEventId:
        $ref: ./common.yaml#/schemas/NullableUuid
      currentEventUrl:
        type:
          - string
          - "null"
      archived:
        type: boolean
      inheritedArchived:
        type: boolean
      capabilities:
        type: object
        additionalProperties: false
        required:
          - editTitle
          - editDescription
          - selfAssign
          - addItem
          - reorder
          - manageSettings
        properties:
          editTitle:
            type: boolean
          editDescription:
            type: boolean
          selfAssign:
            type: boolean
          addItem:
            type: boolean
          reorder:
            type: boolean
          manageSettings:
            type: boolean
      counters:
        type: object
        additionalProperties: false
        required:
          - participants
          - open
          - empty
        properties:
          participants:
            type: integer
            minimum: 0
          open:
            type: integer
            minimum: 0
          empty:
            type: integer
            minimum: 0
      items:
        type: array
        items:
          $ref: "#/schemas/PackingItemView"
      orderToken:
        $ref: ./common.yaml#/schemas/orderToken
      headerVersion:
        type:
          - string
          - "null"
        description: Opaque image version; changes when the image is replaced without exposing its storage path.
  PackingMetadata:
    type: object
    additionalProperties: false
    required:
      - entityType
      - id
      - values
      - editableFields
      - currentEventId
      - archived
      - inheritedArchived
    properties:
      entityType:
        type: string
        const: packing
      id:
        $ref: ./common.yaml#/schemas/Uuid
      values:
        type: object
        additionalProperties: false
        properties:
          title:
            type: string
          description:
            type:
              - string
              - "null"
      editableFields:
        type: array
        uniqueItems: true
        items:
          type: string
          enum:
            - title
            - description
      currentEventId:
        $ref: ./common.yaml#/schemas/NullableUuid
      archived:
        type: boolean
      inheritedArchived:
        type: boolean
  PackingDescriptionValue:
    $ref: ./common.yaml#/schemas/PackingDescriptionValue
  PackingMetadataPatch:
    $ref: ./common.yaml#/schemas/PackingMetadataPatch
  PackingDescriptionPatch:
    $ref: ./common.yaml#/schemas/PackingDescriptionPatch
  PackingDescriptionBaseline:
    $ref: ./common.yaml#/schemas/PackingDescriptionBaseline
  PackingDefaultsBaseline:
    $ref: ./common.yaml#/schemas/PackingDefaultsBaseline
  PackingAdminBaseline:
    $ref: ./common.yaml#/schemas/PackingAdminBaseline
  PackingHeaderBaseline:
    $ref: ./common.yaml#/schemas/PackingHeaderBaseline
  PackingAssignmentResult:
    $ref: ./common.yaml#/schemas/PackingAssignmentResult
  PermissionDefaults:
    $ref: ./common.yaml#/schemas/PermissionDefaults
  PermissionDefaultsPatch:
    $ref: ./common.yaml#/schemas/PermissionDefaultsPatch
  PermissionDefinition:
    $ref: ./common.yaml#/schemas/PermissionDefinition
  PermissionPreset:
    $ref: ./common.yaml#/schemas/PermissionPreset
  PackingCreateContext:
    $ref: ./common.yaml#/schemas/PackingCreateContext
  PackingNewItem:
    type: object
    additionalProperties: false
    required:
      - title
      - description
      - maxAssignees
      - requiredByAll
    properties:
      title:
        type: string
        minLength: 1
        maxLength: 255
      description:
        type:
          - string
          - "null"
        maxLength: 65535
      maxAssignees:
        type: integer
        minimum: 1
        maximum: 2147483647
      requiredByAll:
        type: boolean
  PackingCreateInput:
    type: object
    additionalProperties: false
    required:
      - title
      - description
      - eventId
      - items
      - defaultPermissions
    properties:
      title:
        type: string
        minLength: 1
        maxLength: 255
      description:
        type:
          - string
          - "null"
        maxLength: 65535
      eventId:
        $ref: ./common.yaml#/schemas/NullableUuid
      items:
        type: array
        items:
          $ref: "#/schemas/PackingNewItem"
        minItems: 1
      defaultPermissions:
        $ref: "#/schemas/PermissionDefaults"
  PackingCreated:
    $ref: ./common.yaml#/schemas/PackingCreated
  MutationResult:
    $ref: ./common.yaml#/schemas/MutationResult
  PackingItemPatch:
    type: object
    additionalProperties: false
    required: []
    properties:
      title:
        type: string
        maxLength: 255
      description:
        type:
          - string
          - "null"
        maxLength: 65535
      maxAssignees:
        description: Inline edits carry a numeric value, the number control's raw string draft, or null. The signed nullable integer column retains established rounding and rejects invalid/overflow values. New-item creation has its separate positive integer policy.
        anyOf:
          - type: number
          - type: string
          - type: "null"
      requiredByAll:
        type: boolean
    minProperties: 1
  PackingItemEditBaseline:
    description: Method-authorized edit baseline independent of detail-page admission. Values and hashes include only fields currently permitted by the item's existing method policy.
    type: object
    additionalProperties: false
    required: [id, values, editableFields, editToken]
    properties:
      id:
        $ref: ./common.yaml#/schemas/Uuid
      values:
        type: object
        additionalProperties: false
        minProperties: 1
        properties:
          title:
            $ref: '#/schemas/PackingItemView/properties/title'
          description:
            $ref: '#/schemas/PackingItemView/properties/description'
          maxAssignees:
            $ref: '#/schemas/PackingItemView/properties/maxAssignees'
          requiredByAll:
            $ref: '#/schemas/PackingItemView/properties/requiredByAll'
      editableFields:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: string
          enum: [title, description, maxAssignees, requiredByAll]
      editToken:
        $ref: '#/schemas/PackingItemView/properties/editToken'
  PackingOrderEditBaseline:
    $ref: ./common.yaml#/schemas/PackingOrderEditBaseline
  PackingItemOrder:
    $ref: ./common.yaml#/schemas/PackingItemOrder
  PackingEventChange:
    $ref: ./common.yaml#/schemas/PackingEventChange
  PackingEventChanged:
    $ref: ./common.yaml#/schemas/PackingEventChanged
  PackingProfileOption:
    $ref: ./common.yaml#/schemas/PackingProfileOption
  PackingProfileOptions:
    $ref: ./common.yaml#/schemas/PackingProfileOptions
  PackingAdmin:
    $ref: ./common.yaml#/schemas/PackingAdmin
  PackingAdminInput:
    $ref: ./common.yaml#/schemas/PackingAdminInput
  PackingAdminPatch:
    $ref: ./common.yaml#/schemas/PackingAdminPatch
  PackingCurrentEvent:
    $ref: ./common.yaml#/schemas/PackingCurrentEvent
  PackingArchive:
    $ref: ./common.yaml#/schemas/PackingArchive
  PackingAccess:
    $ref: ./common.yaml#/schemas/PackingAccess
  PackingSettings:
    $ref: ./common.yaml#/schemas/PackingSettings
  PackingHeaderUpload:
    $ref: ./common.yaml#/schemas/PackingHeaderUpload
  PackingHeaderBinary:
    $ref: ./common.yaml#/schemas/PackingHeaderBinary
  PackingCreateForm:
    type: object
    additionalProperties: false
    required:
      - data
    properties:
      data:
        $ref: "#/schemas/PackingCreateInput"
      image:
        type: string
        format: binary
  PackingDuplicate:
    type: object
    additionalProperties: false
    required:
      - title
      - description
      - eventId
      - items
      - defaultPermissions
      - formContext
    properties:
      title:
        type: string
        maxLength: 255
      description:
        type:
          - string
          - "null"
        maxLength: 65535
      eventId:
        $ref: ./common.yaml#/schemas/NullableUuid
      items:
        type: array
        items:
          $ref: "#/schemas/PackingDuplicateItem"
      defaultPermissions:
        $ref: "#/schemas/PermissionDefaults"
      formContext:
        $ref: "#/schemas/PackingCreateContext"
      selectedEvent:
        description: Present only when eventId context was requested. Authorized initial URL selection, independently of the duplicated source's parent event.
        anyOf:
          - $ref: './common.yaml#/schemas/EventPickerOption'
          - type: 'null'
    description: Draft copied from persisted rows, including cleared titles and historical invalid capacity. Creation validates the edited
      draft independently.
  PackingDuplicateItem:
    type: object
    additionalProperties: false
    required:
      - title
      - description
      - maxAssignees
      - requiredByAll
    properties:
      title:
        type: string
        maxLength: 255
      description:
        type:
          - string
          - "null"
        maxLength: 65535
      maxAssignees:
        type:
          - integer
          - "null"
      requiredByAll:
        type: boolean
