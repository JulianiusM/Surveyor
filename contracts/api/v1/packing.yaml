schemas:
  PackingCreateEntry:
    $ref: ./common.yaml#/schemas/EntityCreationEntry
  PackingResourceEntry:
    $ref: ./common.yaml#/schemas/EntityResourceEntry
  PackingAssignee:
    $ref: ./common.yaml#/schemas/ListAssignee
  PackingItemView:
    type: object
    additionalProperties: false
    required:
      - id
      - title
      - description
      - position
      - requiredByAll
      - maxAssignees
      - assignedCount
      - selfAssigned
      - assignees
      - capabilities
      - editToken
    properties:
      id:
        $ref: ./common.yaml#/schemas/Uuid
      title:
        type: string
      description:
        type:
          - string
          - "null"
      position:
        $ref: ./common.yaml#/schemas/position
      requiredByAll:
        type: boolean
      maxAssignees:
        type:
          - integer
          - "null"
      assignedCount:
        type: integer
        minimum: 0
      selfAssigned:
        type: boolean
      assignees:
        type: array
        items:
          $ref: "#/schemas/PackingAssignee"
      capabilities:
        type: object
        additionalProperties: false
        required:
          - showTitleEdit
          - showCapacityEdit
          - editTitle
          - editDescription
          - editCapacity
          - editRequired
          - removeItem
          - removeAssignments
        properties:
          showTitleEdit:
            type: boolean
            description: Title-control visibility; command authorization is independently editTitle.
          showCapacityEdit:
            type: boolean
            description: Capacity-control visibility; command authorization is independently editCapacity.
          editTitle:
            type: boolean
          editDescription:
            type: boolean
          editCapacity:
            type: boolean
          editRequired:
            type: boolean
          removeItem:
            type: boolean
          removeAssignments:
            type: boolean
      editToken:
        $ref: ./common.yaml#/schemas/FieldComparisonToken
  PackingListView:
    type: object
    additionalProperties: false
    required:
      - entityType
      - id
      - title
      - description
      - headerUrl
      - currentEventId
      - currentEventUrl
      - archived
      - inheritedArchived
      - capabilities
      - counters
      - items
      - orderToken
      - headerVersion
    properties:
      entityType:
        type: string
        const: packing
      id:
        $ref: ./common.yaml#/schemas/Uuid
      title:
        type: string
      description:
        type:
          - string
          - "null"
      headerUrl:
        type:
          - string
          - "null"
      currentEventId:
        $ref: ./common.yaml#/schemas/NullableUuid
      currentEventUrl:
        type:
          - string
          - "null"
      archived:
        type: boolean
      inheritedArchived:
        type: boolean
      capabilities:
        type: object
        additionalProperties: false
        required:
          - editTitle
          - editDescription
          - selfAssign
          - addItem
          - reorder
          - manageSettings
        properties:
          editTitle:
            type: boolean
          editDescription:
            type: boolean
          selfAssign:
            type: boolean
          addItem:
            type: boolean
          reorder:
            type: boolean
          manageSettings:
            type: boolean
      counters:
        type: object
        additionalProperties: false
        required:
          - participants
          - open
          - empty
        properties:
          participants:
            type: integer
            minimum: 0
          open:
            type: integer
            minimum: 0
          empty:
            type: integer
            minimum: 0
      items:
        type: array
        items:
          $ref: "#/schemas/PackingItemView"
      orderToken:
        $ref: ./common.yaml#/schemas/orderToken
      headerVersion:
        type:
          - string
          - "null"
        description: Opaque image version; changes when the image is replaced without exposing its storage path.
  PackingMetadata:
    type: object
    additionalProperties: false
    required:
      - entityType
      - id
      - values
      - editableFields
      - currentEventId
      - archived
      - inheritedArchived
    properties:
      entityType:
        type: string
        const: packing
      id:
        $ref: ./common.yaml#/schemas/Uuid
      values:
        type: object
        additionalProperties: false
        properties:
          title:
            type: string
          description:
            type:
              - string
              - "null"
      editableFields:
        type: array
        uniqueItems: true
        items:
          type: string
          enum:
            - title
            - description
      currentEventId:
        $ref: ./common.yaml#/schemas/NullableUuid
      archived:
        type: boolean
      inheritedArchived:
        type: boolean
  PackingDescriptionValue:
    $ref: ./common.yaml#/schemas/EntityDescriptionValue
  PackingMetadataPatch:
    $ref: ./common.yaml#/schemas/BasicEntityMetadataPatch
  PackingDescriptionPatch:
    $ref: ./common.yaml#/schemas/EntityDescriptionPatch
  PackingDescriptionBaseline:
    $ref: ./common.yaml#/schemas/EntityDescriptionBaseline
  PackingDefaultsBaseline:
    $ref: ./common.yaml#/schemas/EntityPermissionDefaultsBaseline
  PackingAdminBaseline:
    $ref: ./common.yaml#/schemas/EntityAdministratorBaseline
  PackingHeaderBaseline:
    $ref: ./common.yaml#/schemas/EntityHeaderBaseline
  PackingAssignmentResult:
    $ref: ./common.yaml#/schemas/ListAssignmentResult
  PermissionDefaults:
    $ref: ./common.yaml#/schemas/PermissionDefaults
  PermissionDefaultsPatch:
    $ref: ./common.yaml#/schemas/PermissionDefaultsPatch
  PermissionDefinition:
    $ref: ./common.yaml#/schemas/PermissionDefinition
  PermissionPreset:
    $ref: ./common.yaml#/schemas/PermissionPreset
  PackingCreateContext:
    $ref: ./common.yaml#/schemas/EntityCreationContext
  PackingNewItem:
    type: object
    additionalProperties: false
    required:
      - title
      - description
      - maxAssignees
      - requiredByAll
    properties:
      title:
        type: string
        minLength: 1
        maxLength: 255
      description:
        type:
          - string
          - "null"
        maxLength: 65535
      maxAssignees:
        type: integer
        minimum: 1
        maximum: 2147483647
      requiredByAll:
        type: boolean
  PackingCreateInput:
    type: object
    additionalProperties: false
    required:
      - title
      - description
      - eventId
      - items
      - defaultPermissions
    properties:
      title:
        type: string
        minLength: 1
        maxLength: 255
      description:
        type:
          - string
          - "null"
        maxLength: 65535
      eventId:
        $ref: ./common.yaml#/schemas/NullableUuid
      items:
        type: array
        items:
          $ref: "#/schemas/PackingNewItem"
        minItems: 1
      defaultPermissions:
        $ref: "#/schemas/PermissionDefaults"
  PackingCreated:
    $ref: ./common.yaml#/schemas/EntityCreationResult
  MutationResult:
    $ref: ./common.yaml#/schemas/MutationResult
  PackingItemPatch:
    type: object
    additionalProperties: false
    required: []
    properties:
      title:
        type: string
        maxLength: 255
      description:
        type:
          - string
          - "null"
        maxLength: 65535
      maxAssignees:
        description: Inline edits carry a numeric value, the number control's raw string draft, or null. The signed nullable integer column retains established rounding and rejects invalid/overflow values. New-item creation has its separate positive integer policy.
        anyOf:
          - type: number
          - type: string
          - type: "null"
      requiredByAll:
        type: boolean
    minProperties: 1
  PackingItemEditBaseline:
    description: Method-authorized edit baseline independent of detail-page admission. Values and hashes include only fields currently permitted by the item's existing method policy.
    type: object
    additionalProperties: false
    required: [id, values, editableFields, editToken]
    properties:
      id:
        $ref: ./common.yaml#/schemas/Uuid
      values:
        type: object
        additionalProperties: false
        minProperties: 1
        properties:
          title:
            $ref: '#/schemas/PackingItemView/properties/title'
          description:
            $ref: '#/schemas/PackingItemView/properties/description'
          maxAssignees:
            $ref: '#/schemas/PackingItemView/properties/maxAssignees'
          requiredByAll:
            $ref: '#/schemas/PackingItemView/properties/requiredByAll'
      editableFields:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: string
          enum: [title, description, maxAssignees, requiredByAll]
      editToken:
        $ref: '#/schemas/PackingItemView/properties/editToken'
  PackingOrderEditBaseline:
    $ref: ./common.yaml#/schemas/ListOrderBaseline
  PackingItemOrder:
    $ref: ./common.yaml#/schemas/ListItemOrderInput
  PackingEventChange:
    $ref: ./common.yaml#/schemas/EntityEventChangeInput
  PackingEventChanged:
    $ref: ./common.yaml#/schemas/EntityEventChangeResult
  PackingProfileOption:
    $ref: ./common.yaml#/schemas/EntityAdministratorProfileOption
  PackingProfileOptions:
    $ref: ./common.yaml#/schemas/EntityAdministratorProfileOptions
  PackingAdmin:
    $ref: ./common.yaml#/schemas/EntityAdministrator
  PackingAdminInput:
    $ref: ./common.yaml#/schemas/EntityAdministratorInput
  PackingAdminPatch:
    $ref: ./common.yaml#/schemas/EntityAdministratorPatch
  PackingCurrentEvent:
    $ref: ./common.yaml#/schemas/EntityCurrentEvent
  PackingArchive:
    $ref: ./common.yaml#/schemas/EntityArchive
  PackingAccess:
    $ref: ./common.yaml#/schemas/EntityAccess
  PackingSettings:
    $ref: ./common.yaml#/schemas/ListSettings
  PackingHeaderUpload:
    $ref: ./common.yaml#/schemas/EntityHeaderUpload
  PackingHeaderBinary:
    $ref: ./common.yaml#/schemas/EntityHeaderBinary
  PackingCreateForm:
    type: object
    additionalProperties: false
    required:
      - data
    properties:
      data:
        $ref: "#/schemas/PackingCreateInput"
      image:
        type: string
        format: binary
  PackingDuplicate:
    type: object
    additionalProperties: false
    required:
      - title
      - description
      - eventId
      - items
      - defaultPermissions
      - formContext
    properties:
      title:
        type: string
        maxLength: 255
      description:
        type:
          - string
          - "null"
        maxLength: 65535
      eventId:
        $ref: ./common.yaml#/schemas/NullableUuid
      items:
        type: array
        items:
          $ref: "#/schemas/PackingDuplicateItem"
      defaultPermissions:
        $ref: "#/schemas/PermissionDefaults"
      formContext:
        $ref: "#/schemas/PackingCreateContext"
      selectedEvent:
        description: Present only when eventId context was requested. Authorized initial URL selection, independently of the duplicated source's parent event.
        anyOf:
          - $ref: './events.yaml#/schemas/EventPickerOption'
          - type: 'null'
    description: Draft copied from persisted rows, including cleared titles and historical invalid capacity. Creation validates the edited
      draft independently.
  PackingDuplicateItem:
    type: object
    additionalProperties: false
    required:
      - title
      - description
      - maxAssignees
      - requiredByAll
    properties:
      title:
        type: string
        maxLength: 255
      description:
        type:
          - string
          - "null"
        maxLength: 65535
      maxAssignees:
        type:
          - integer
          - "null"
      requiredByAll:
        type: boolean
paths:
  /packing-lists/create-entry:
    get:
      operationId: getPackingCreateEntry
      x-surveyor-command: {retryPolicy: read, precondition: none}
      summary: Read account-only creation admission and public form context
      security: []
      parameters:
        - $ref: './openapi.yaml#/components/parameters/Context'
        - $ref: './openapi.yaml#/components/parameters/Locale'
        - name: returnTo
          in: query
          schema: {type: string, maxLength: 2048}
        - name: eventId
          in: query
          description: Optional contextual selection; the controller omits rejected targets.
          schema: {type: string}
      responses:
        '200':
          description: Server-owned page admission
          content:
            application/json:
              schema:
                $ref: './openapi.yaml#/components/schemas/PackingCreateEntry'
        default:
          $ref: './openapi.yaml#/components/responses/Problem'
  /packing-lists/{listId}/entry:
    get:
      operationId: getPackingResourceEntry
      x-surveyor-command: {retryPolicy: read, precondition: none}
      summary: Read detail or guest-entry admission without disclosing protected list data
      security: []
      parameters:
        - $ref: './openapi.yaml#/components/parameters/Context'
        - $ref: './openapi.yaml#/components/parameters/Locale'
        - $ref: './openapi.yaml#/components/parameters/ListId'
        - name: view
          in: query
          required: true
          schema: {type: string, enum: [detail, guest]}
      responses:
        '200':
          description: Server-owned page admission
          content:
            application/json:
              schema:
                $ref: './openapi.yaml#/components/schemas/PackingResourceEntry'
        default:
          $ref: './openapi.yaml#/components/responses/Problem'
  /packing-lists/{listId}:
    get:
      operationId: getPackingList
      x-surveyor-command: {retryPolicy: read, precondition: none}
      summary: Read an authorized packing list
      parameters:
        - $ref: "./openapi.yaml#/components/parameters/Context"
        - $ref: "./openapi.yaml#/components/parameters/Locale"
        - $ref: "./openapi.yaml#/components/parameters/ListId"
        - $ref: "./openapi.yaml#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Current authorized representation
          headers:
            X-Surveyor-Context:
              schema:
                type: string
            Content-Language:
              schema:
                type: string
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "./openapi.yaml#/components/schemas/PackingListView"
        "304":
          description: Authorized representation unchanged; no response body
        default:
          $ref: "./openapi.yaml#/components/responses/Problem"
    delete:
      operationId: deletePackingList
      x-surveyor-command: {retryPolicy: reconcile-only, precondition: none}
      summary: delete Packing List
      parameters:
        - $ref: "./openapi.yaml#/components/parameters/Context"
        - $ref: "./openapi.yaml#/components/parameters/Locale"
        - $ref: "./openapi.yaml#/components/parameters/ListId"
        - $ref: "./openapi.yaml#/components/parameters/Csrf"
      responses:
        "200":
          description: Authorized operation result
          content:
            application/json:
              schema:
                $ref: "./openapi.yaml#/components/schemas/MutationResult"
        default:
          $ref: "./openapi.yaml#/components/responses/Problem"
  /packing-lists/{listId}/metadata:
    get:
      operationId: getPackingMetadata
      x-surveyor-command: {retryPolicy: read, precondition: none}
      summary: Read only editable packing metadata
      parameters:
        - $ref: "./openapi.yaml#/components/parameters/Context"
        - $ref: "./openapi.yaml#/components/parameters/Locale"
        - $ref: "./openapi.yaml#/components/parameters/ListId"
        - $ref: "./openapi.yaml#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Current authorized representation
          headers:
            X-Surveyor-Context:
              schema:
                type: string
            Content-Language:
              schema:
                type: string
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "./openapi.yaml#/components/schemas/PackingMetadata"
        "304":
          description: Authorized representation unchanged; no response body
        default:
          $ref: "./openapi.yaml#/components/responses/Problem"
    patch:
      operationId: updatePackingMetadata
      x-surveyor-command: {retryPolicy: reconcile-only, precondition: metadata}
      summary: Update selected packing metadata with an exact edit precondition
      parameters:
        - $ref: "./openapi.yaml#/components/parameters/Context"
        - $ref: "./openapi.yaml#/components/parameters/Locale"
        - $ref: "./openapi.yaml#/components/parameters/ListId"
        - $ref: "./openapi.yaml#/components/parameters/Csrf"
        - $ref: "./openapi.yaml#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./openapi.yaml#/components/schemas/PackingMetadataPatch"
      responses:
        "200":
          description: Current authorized representation
          headers:
            X-Surveyor-Context:
              schema:
                type: string
            Content-Language:
              schema:
                type: string
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "./openapi.yaml#/components/schemas/PackingMetadata"
        default:
          $ref: "./openapi.yaml#/components/responses/Problem"
  /packing-lists/{listId}/description:
    get:
      operationId: getPackingDescription
      x-surveyor-command: {retryPolicy: read, precondition: none}
      summary: Read only the independently granted description field
      parameters:
        - $ref: "./openapi.yaml#/components/parameters/Context"
        - $ref: "./openapi.yaml#/components/parameters/Locale"
        - $ref: "./openapi.yaml#/components/parameters/ListId"
        - $ref: "./openapi.yaml#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Current independently authorized field baseline
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "./openapi.yaml#/components/schemas/PackingDescriptionBaseline"
        "304":
          description: Authorized baseline unchanged; no response body
        default:
          $ref: "./openapi.yaml#/components/responses/Problem"
    patch:
      operationId: updatePackingDescription
      x-surveyor-command: {retryPolicy: reconcile-only, precondition: metadata}
      summary: Update only the independently granted description field
      parameters:
        - $ref: "./openapi.yaml#/components/parameters/Context"
        - $ref: "./openapi.yaml#/components/parameters/Locale"
        - $ref: "./openapi.yaml#/components/parameters/ListId"
        - $ref: "./openapi.yaml#/components/parameters/Csrf"
        - $ref: "./openapi.yaml#/components/parameters/IfMatch"
      responses:
        "200":
          description: Updated description field baseline
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "./openapi.yaml#/components/schemas/PackingDescriptionBaseline"
        default:
          $ref: "./openapi.yaml#/components/responses/Problem"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./openapi.yaml#/components/schemas/PackingDescriptionPatch"
  /packing-lists/{listId}/items/{itemId}/self-assignment:
    put:
      operationId: assignPackingItem
      x-surveyor-command: {retryPolicy: natural-idempotent, precondition: none}
      summary: Idempotently take a packing item as the active profile
      parameters:
        - $ref: "./openapi.yaml#/components/parameters/Context"
        - $ref: "./openapi.yaml#/components/parameters/Locale"
        - $ref: "./openapi.yaml#/components/parameters/ListId"
        - $ref: "./openapi.yaml#/components/parameters/ItemId"
        - $ref: "./openapi.yaml#/components/parameters/Csrf"
      responses:
        "200":
          description: Current authorized representation
          headers:
            X-Surveyor-Context:
              schema:
                type: string
            Content-Language:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "./openapi.yaml#/components/schemas/PackingAssignmentResult"
        default:
          $ref: "./openapi.yaml#/components/responses/Problem"
    delete:
      operationId: unassignPackingItem
      x-surveyor-command: {retryPolicy: natural-idempotent, precondition: none}
      summary: Remove the active profile's packing commitment
      parameters:
        - $ref: "./openapi.yaml#/components/parameters/Context"
        - $ref: "./openapi.yaml#/components/parameters/Locale"
        - $ref: "./openapi.yaml#/components/parameters/ListId"
        - $ref: "./openapi.yaml#/components/parameters/ItemId"
        - $ref: "./openapi.yaml#/components/parameters/Csrf"
      responses:
        "200":
          description: Current authorized representation
          headers:
            X-Surveyor-Context:
              schema:
                type: string
            Content-Language:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "./openapi.yaml#/components/schemas/PackingAssignmentResult"
        default:
          $ref: "./openapi.yaml#/components/responses/Problem"
  /packing-lists/create-context:
    get:
      operationId: getPackingCreateContext
      x-surveyor-command: {retryPolicy: read, precondition: none}
      summary: get Packing Create Context
      parameters:
        - $ref: "./openapi.yaml#/components/parameters/Context"
        - $ref: "./openapi.yaml#/components/parameters/Locale"
      responses:
        "200":
          description: Authorized operation result
          content:
            application/json:
              schema:
                $ref: "./openapi.yaml#/components/schemas/PackingCreateContext"
        default:
          $ref: "./openapi.yaml#/components/responses/Problem"
  /packing-lists:
    post:
      operationId: createPackingList
      x-surveyor-command: {retryPolicy: reconcile-only, precondition: none}
      summary: create Packing List
      parameters:
        - $ref: "./openapi.yaml#/components/parameters/Context"
        - $ref: "./openapi.yaml#/components/parameters/Locale"
        - $ref: "./openapi.yaml#/components/parameters/Csrf"
      responses:
        "201":
          description: Authorized operation result
          content:
            application/json:
              schema:
                $ref: "./openapi.yaml#/components/schemas/PackingCreated"
        default:
          $ref: "./openapi.yaml#/components/responses/Problem"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "./openapi.yaml#/components/schemas/PackingCreateForm"
            encoding:
              data:
                contentType: application/json
  /packing-lists/events:
    get:
      operationId: searchPackingEvents
      x-surveyor-command: {retryPolicy: read, precondition: none}
      summary: search Packing Events
      parameters:
        - $ref: "./openapi.yaml#/components/parameters/Context"
        - $ref: "./openapi.yaml#/components/parameters/Locale"
        - name: q
          in: query
          required: false
          schema:
            $ref: './openapi.yaml#/components/schemas/EventPickerQuery/properties/q'
        - name: from
          in: query
          required: false
          schema:
            $ref: './openapi.yaml#/components/schemas/EventPickerQuery/properties/from'
        - name: to
          in: query
          required: false
          schema:
            $ref: './openapi.yaml#/components/schemas/EventPickerQuery/properties/to'
        - name: period
          in: query
          required: false
          schema:
            $ref: './openapi.yaml#/components/schemas/EventPickerQuery/properties/period'
        - name: archive
          in: query
          required: false
          schema:
            $ref: './openapi.yaml#/components/schemas/EventPickerQuery/properties/archive'
        - name: deadline
          in: query
          required: false
          schema:
            $ref: './openapi.yaml#/components/schemas/EventPickerQuery/properties/deadline'
        - name: cursor
          in: query
          required: false
          schema:
            $ref: './openapi.yaml#/components/schemas/EventPickerQuery/properties/cursor'
        - name: selectedId
          in: query
          required: false
          schema:
            $ref: './openapi.yaml#/components/schemas/EventPickerQuery/properties/selectedId'
      responses:
        "200":
          description: Authorized operation result
          content:
            application/json:
              schema:
                $ref: "./openapi.yaml#/components/schemas/EventPickerOptions"
        default:
          $ref: "./openapi.yaml#/components/responses/Problem"
  /packing-lists/{listId}/duplicate:
    get:
      operationId: getPackingDuplicate
      x-surveyor-command: {retryPolicy: read, precondition: none}
      summary: get Packing Duplicate
      parameters:
        - $ref: "./openapi.yaml#/components/parameters/Context"
        - $ref: "./openapi.yaml#/components/parameters/Locale"
        - $ref: "./openapi.yaml#/components/parameters/ListId"
        - name: eventId
          in: query
          description: Optional destination selection, independently authorized rather than copied from the source.
          schema: {type: string}
      responses:
        "200":
          description: Authorized operation result
          content:
            application/json:
              schema:
                $ref: "./openapi.yaml#/components/schemas/PackingDuplicate"
        default:
          $ref: "./openapi.yaml#/components/responses/Problem"
  /packing-lists/{listId}/settings:
    get:
      operationId: getPackingSettings
      x-surveyor-command: {retryPolicy: read, precondition: none}
      summary: get Packing Settings
      parameters:
        - $ref: "./openapi.yaml#/components/parameters/Context"
        - $ref: "./openapi.yaml#/components/parameters/Locale"
        - $ref: "./openapi.yaml#/components/parameters/ListId"
      responses:
        "200":
          description: Authorized operation result
          content:
            application/json:
              schema:
                $ref: "./openapi.yaml#/components/schemas/PackingSettings"
        default:
          $ref: "./openapi.yaml#/components/responses/Problem"
  /packing-lists/{listId}/items:
    post:
      operationId: createPackingItem
      x-surveyor-command: {retryPolicy: reconcile-only, precondition: none}
      summary: create Packing Item
      parameters:
        - $ref: "./openapi.yaml#/components/parameters/Context"
