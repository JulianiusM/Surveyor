openapi: 3.1.1
x-surveyor-api-compatibility: v1-pilot-2026-10-07
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Surveyor API
  version: 1.0.0
  description: Versioned packing pilot and session bootstrap. Existing feature routes remain available.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: /api/v1
security:
  - sessionCookie: []
paths:
  /packing-lists/create-entry:
    get:
      operationId: getPackingCreateEntry
      x-surveyor-command: {retryPolicy: read, precondition: none}
      summary: Read the native account-only creation admission and public form context
      security: []
      parameters:
        - $ref: '#/components/parameters/Context'
        - $ref: '#/components/parameters/Locale'
        - name: returnTo
          in: query
          schema: {type: string, maxLength: 2048}
        - name: eventId
          in: query
          description: Optional contextual selection; the native selection owner omits rejected targets.
          schema: {type: string}
      responses:
        '200':
          description: Server-owned page admission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackingCreateEntry'
        default:
          $ref: '#/components/responses/Problem'
  /packing-lists/{listId}/entry:
    get:
      operationId: getPackingResourceEntry
      x-surveyor-command: {retryPolicy: read, precondition: none}
      summary: Read native detail or guest-entry admission without disclosing protected list data
      security: []
      parameters:
        - $ref: '#/components/parameters/Context'
        - $ref: '#/components/parameters/Locale'
        - $ref: '#/components/parameters/ListId'
        - name: view
          in: query
          required: true
          schema: {type: string, enum: [detail, guest]}
      responses:
        '200':
          description: Server-owned page admission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackingResourceEntry'
        default:
          $ref: '#/components/responses/Problem'
  /overview:
    $ref: ./overview.yaml#/paths/overview
  /overview/{entityType}/{entityId}/visibility:
    $ref: ./overview.yaml#/paths/visibility
  /auth/login:
    $ref: ./auth.yaml#/paths/~1auth~1login
  /auth/logout:
    $ref: ./auth.yaml#/paths/~1auth~1logout
  /auth/register:
    $ref: ./auth.yaml#/paths/~1auth~1register
  /auth/forgot-password:
    $ref: ./auth.yaml#/paths/~1auth~1forgot-password
  /auth/reset-password:
    $ref: ./auth.yaml#/paths/~1auth~1reset-password
  /auth/activate:
    $ref: ./auth.yaml#/paths/~1auth~1activate
  /auth/guest-login:
    $ref: ./auth.yaml#/paths/~1auth~1guest-login
  /auth/guest-recovery:
    $ref: ./auth.yaml#/paths/~1auth~1guest-recovery
  /auth/guest-email-exists:
    $ref: ./auth.yaml#/paths/~1auth~1guest-email-exists
  /profiles:
    $ref: ./profiles.yaml#/paths/profiles
  /profiles/entry:
    $ref: ./profiles.yaml#/paths/entry
  /profiles/current:
    $ref: ./profiles.yaml#/paths/current
  /profiles/migration/preview:
    $ref: ./profiles.yaml#/paths/migrationPreview
  /auth/profile:
    $ref: ./auth.yaml#/paths/~1auth~1profile
  /packing-lists/{listId}/guest:
    $ref: ./auth.yaml#/paths/~1packing-lists~1{listId}~1guest
  /session:
    get:
      operationId: getSession
      x-surveyor-command: {retryPolicy: read, precondition: none}
      summary: Read the current session without exposing credentials
      security: []
      parameters:
        - $ref: "#/components/parameters/Locale"
      responses:
        "200":
          description: Current authorized representation
          headers:
            X-Surveyor-Context:
              schema:
                type: string
            Content-Language:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionView"
        default:
          $ref: "#/components/responses/Problem"
  /locale:
    put:
      operationId: setLocale
      x-surveyor-command: {retryPolicy: reconcile-only, precondition: none}
      summary: Choose a supported browser locale
      security: []
      parameters:
        - $ref: "#/components/parameters/Context"
        - $ref: "#/components/parameters/Locale"
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocaleUpdate"
      responses:
        "200":
          description: Current authorized representation
          headers:
            X-Surveyor-Context:
              schema:
                type: string
            Content-Language:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionView"
        default:
          $ref: "#/components/responses/Problem"
  /help:
    get:
      operationId: getHelpPage
      x-surveyor-command: {retryPolicy: read, precondition: none}
      summary: Read fixed-source help or search its contents
      security: []
      parameters:
        - $ref: "#/components/parameters/Context"
        - $ref: "#/components/parameters/Locale"
        - $ref: "#/components/parameters/HelpDocument"
        - $ref: "#/components/parameters/HelpQuery"
      responses:
        "200":
          description: Current authorized representation
          headers:
            X-Surveyor-Context:
              schema:
                type: string
            Content-Language:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelpPageData"
        default:
          $ref: "#/components/responses/Problem"
  /packing-lists/{listId}:
    get:
      operationId: getPackingList
      x-surveyor-command: {retryPolicy: read, precondition: none}
      summary: Read an authorized packing list
      parameters:
        - $ref: "#/components/parameters/Context"
        - $ref: "#/components/parameters/Locale"
        - $ref: "#/components/parameters/ListId"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Current authorized representation
          headers:
            X-Surveyor-Context:
              schema:
                type: string
            Content-Language:
              schema:
                type: string
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackingListView"
        "304":
          description: Authorized representation unchanged; no response body
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deletePackingList
      x-surveyor-command: {retryPolicy: reconcile-only, precondition: none}
      summary: delete Packing List
      parameters:
        - $ref: "#/components/parameters/Context"
        - $ref: "#/components/parameters/Locale"
        - $ref: "#/components/parameters/ListId"
        - $ref: "#/components/parameters/Csrf"
      responses:
        "200":
          description: Authorized operation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MutationResult"
        default:
          $ref: "#/components/responses/Problem"
  /packing-lists/{listId}/metadata:
    get:
      operationId: getPackingMetadata
      x-surveyor-command: {retryPolicy: read, precondition: none}
      summary: Read only editable packing metadata
      parameters:
        - $ref: "#/components/parameters/Context"
        - $ref: "#/components/parameters/Locale"
        - $ref: "#/components/parameters/ListId"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Current authorized representation
          headers:
            X-Surveyor-Context:
              schema:
                type: string
            Content-Language:
              schema:
                type: string
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackingMetadata"
        "304":
          description: Authorized representation unchanged; no response body
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updatePackingMetadata
      x-surveyor-command: {retryPolicy: reconcile-only, precondition: metadata}
      summary: Update selected packing metadata with an exact edit precondition
      parameters:
        - $ref: "#/components/parameters/Context"
        - $ref: "#/components/parameters/Locale"
        - $ref: "#/components/parameters/ListId"
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PackingMetadataPatch"
      responses:
        "200":
          description: Current authorized representation
          headers:
            X-Surveyor-Context:
              schema:
                type: string
            Content-Language:
              schema:
                type: string
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackingMetadata"
        default:
          $ref: "#/components/responses/Problem"
  /packing-lists/{listId}/description:
    get:
      operationId: getPackingDescription
      x-surveyor-command: {retryPolicy: read, precondition: none}
      summary: Read only the independently granted native description field
      parameters:
        - $ref: "#/components/parameters/Context"
        - $ref: "#/components/parameters/Locale"
        - $ref: "#/components/parameters/ListId"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Current independently authorized field baseline
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackingDescriptionBaseline"
        "304":
          description: Authorized baseline unchanged; no response body
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updatePackingDescription
      x-surveyor-command: {retryPolicy: reconcile-only, precondition: metadata}
      summary: Update only the independently granted native description field
      parameters:
        - $ref: "#/components/parameters/Context"
        - $ref: "#/components/parameters/Locale"
        - $ref: "#/components/parameters/ListId"
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: Updated description field baseline
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackingDescriptionBaseline"
        default:
          $ref: "#/components/responses/Problem"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PackingDescriptionPatch"
  /packing-lists/{listId}/items/{itemId}/self-assignment:
    put:
      operationId: assignPackingItem
      x-surveyor-command: {retryPolicy: natural-idempotent, precondition: none}
      summary: Idempotently take a packing item as the active profile
      parameters:
        - $ref: "#/components/parameters/Context"
        - $ref: "#/components/parameters/Locale"
        - $ref: "#/components/parameters/ListId"
        - $ref: "#/components/parameters/ItemId"
        - $ref: "#/components/parameters/Csrf"
      responses:
        "200":
          description: Current authorized representation
          headers:
            X-Surveyor-Context:
              schema:
                type: string
            Content-Language:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackingAssignmentResult"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: unassignPackingItem
      x-surveyor-command: {retryPolicy: natural-idempotent, precondition: none}
      summary: Remove the active profile's packing commitment
      parameters:
        - $ref: "#/components/parameters/Context"
        - $ref: "#/components/parameters/Locale"
        - $ref: "#/components/parameters/ListId"
        - $ref: "#/components/parameters/ItemId"
        - $ref: "#/components/parameters/Csrf"
      responses:
        "200":
          description: Current authorized representation
          headers:
            X-Surveyor-Context:
              schema:
                type: string
            Content-Language:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackingAssignmentResult"
        default:
          $ref: "#/components/responses/Problem"
  /packing-lists/create-context:
    get:
      operationId: getPackingCreateContext
      x-surveyor-command: {retryPolicy: read, precondition: none}
      summary: get Packing Create Context
      parameters:
        - $ref: "#/components/parameters/Context"
        - $ref: "#/components/parameters/Locale"
      responses:
        "200":
          description: Authorized operation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackingCreateContext"
        default:
          $ref: "#/components/responses/Problem"
  /packing-lists:
    post:
      operationId: createPackingList
      x-surveyor-command: {retryPolicy: reconcile-only, precondition: none}
      summary: create Packing List
      parameters:
        - $ref: "#/components/parameters/Context"
        - $ref: "#/components/parameters/Locale"
        - $ref: "#/components/parameters/Csrf"
      responses:
        "201":
          description: Authorized operation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackingCreated"
        default:
          $ref: "#/components/responses/Problem"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/PackingCreateForm"
            encoding:
              data:
                contentType: application/json
  /packing-lists/events:
    get:
      operationId: searchPackingEvents
      x-surveyor-command: {retryPolicy: read, precondition: none}
      summary: search Packing Events
      parameters:
        - $ref: "#/components/parameters/Context"
        - $ref: "#/components/parameters/Locale"
        - name: q
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/EventPickerQuery/properties/q'
        - name: from
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/EventPickerQuery/properties/from'
        - name: to
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/EventPickerQuery/properties/to'
        - name: period
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/EventPickerQuery/properties/period'
        - name: archive
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/EventPickerQuery/properties/archive'
        - name: deadline
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/EventPickerQuery/properties/deadline'
        - name: cursor
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/EventPickerQuery/properties/cursor'
        - name: selectedId
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/EventPickerQuery/properties/selectedId'
      responses:
        "200":
          description: Authorized operation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventPickerOptions"
        default:
          $ref: "#/components/responses/Problem"
  /packing-lists/{listId}/duplicate:
    get:
      operationId: getPackingDuplicate
      x-surveyor-command: {retryPolicy: read, precondition: none}
      summary: get Packing Duplicate
      parameters:
        - $ref: "#/components/parameters/Context"
        - $ref: "#/components/parameters/Locale"
        - $ref: "#/components/parameters/ListId"
        - name: eventId
          in: query
          description: Optional destination selection, independently authorized rather than copied from the source.
          schema: {type: string}
      responses:
        "200":
          description: Authorized operation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackingDuplicate"
        default:
          $ref: "#/components/responses/Problem"
  /packing-lists/{listId}/settings:
    get:
      operationId: getPackingSettings
      x-surveyor-command: {retryPolicy: read, precondition: none}
      summary: get Packing Settings
      parameters:
        - $ref: "#/components/parameters/Context"
        - $ref: "#/components/parameters/Locale"
        - $ref: "#/components/parameters/ListId"
      responses:
        "200":
          description: Authorized operation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackingSettings"
        default:
          $ref: "#/components/responses/Problem"
  /packing-lists/{listId}/items:
    post:
      operationId: createPackingItem
      x-surveyor-command: {retryPolicy: reconcile-only, precondition: none}
      summary: create Packing Item
      parameters:
        - $ref: "#/components/parameters/Context"
        - $ref: "#/components/parameters/Locale"
        - $ref: "#/components/parameters/ListId"
        - $ref: "#/components/parameters/Csrf"
      responses:
        "201":
          description: Authorized operation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackingCreated"
        default:
          $ref: "#/components/responses/Problem"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PackingNewItem"
  /packing-lists/{listId}/items/{itemId}/edit-baseline:
    get:
      operationId: getPackingItemEditBaseline
      x-surveyor-command: {retryPolicy: read, precondition: none}
      summary: Read permitted item edit values independently of detail-page admission
      parameters:
        - $ref: "#/components/parameters/Context"
        - $ref: "#/components/parameters/Locale"
        - $ref: "#/components/parameters/ListId"
        - $ref: "#/components/parameters/ItemId"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Current method-authorized item edit baseline
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackingItemEditBaseline"
        "304":
          description: Authorized edit baseline unchanged; no response body
        default:
          $ref: "#/components/responses/Problem"
  /packing-lists/{listId}/items/{itemId}:
    patch:
      operationId: updatePackingItem
      x-surveyor-command: {retryPolicy: reconcile-only, precondition: item}
      summary: update Packing Item
      parameters:
        - $ref: "#/components/parameters/Context"
        - $ref: "#/components/parameters/Locale"
        - $ref: "#/components/parameters/ListId"
        - $ref: "#/components/parameters/ItemId"
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: Authorized operation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MutationResult"
        default:
          $ref: "#/components/responses/Problem"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PackingItemPatch"
    delete:
      operationId: deletePackingItem
      x-surveyor-command: {retryPolicy: reconcile-only, precondition: none}
      summary: delete Packing Item
      parameters:
        - $ref: "#/components/parameters/Context"
        - $ref: "#/components/parameters/Locale"
        - $ref: "#/components/parameters/ListId"
        - $ref: "#/components/parameters/ItemId"
        - $ref: "#/components/parameters/Csrf"
      responses:
        "200":
          description: Authorized operation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MutationResult"
        default:
          $ref: "#/components/responses/Problem"
  /packing-lists/{listId}/item-order:
    get:
      operationId: getPackingItemOrderBaseline
      x-surveyor-command: {retryPolicy: read, precondition: none}
      summary: Read permitted order values independently of detail-page admission
      parameters:
        - $ref: "#/components/parameters/Context"
        - $ref: "#/components/parameters/Locale"
        - $ref: "#/components/parameters/ListId"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Current method-authorized item order baseline
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackingOrderEditBaseline"
        "304":
          description: Authorized order baseline unchanged; no response body
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: reorderPackingItems
      x-surveyor-command: {retryPolicy: reconcile-only, precondition: order}
      summary: reorder Packing Items
      parameters:
        - $ref: "#/components/parameters/Context"
        - $ref: "#/components/parameters/Locale"
        - $ref: "#/components/parameters/ListId"
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: Authorized operation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MutationResult"
        default:
          $ref: "#/components/responses/Problem"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PackingItemOrder"
  /packing-lists/{listId}/assignments/{assignmentId}:
    delete:
      operationId: deletePackingAssignment
      x-surveyor-command: {retryPolicy: reconcile-only, precondition: none}
      summary: delete Packing Assignment
      parameters:
        - $ref: "#/components/parameters/Context"
        - $ref: "#/components/parameters/Locale"
        - $ref: "#/components/parameters/ListId"
        - $ref: "#/components/parameters/AssignmentId"
        - $ref: "#/components/parameters/Csrf"
      responses:
        "200":
          description: Authorized operation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MutationResult"
        default:
          $ref: "#/components/responses/Problem"
  /packing-lists/{listId}/event:
    put:
      operationId: changePackingEvent
      x-surveyor-command: {retryPolicy: reconcile-only, precondition: settings}
      summary: change Packing Event
      description: Current authorization is always required. An already selected event returns unchanged without writing, even with an absent or stale comparison; an actual relationship change requires the reviewed If-Match and expectedEventId.
      parameters:
        - $ref: "#/components/parameters/Context"
        - $ref: "#/components/parameters/Locale"
        - $ref: "#/components/parameters/ListId"
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/EventIfMatch"
      responses:
        "200":
          description: Authorized operation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackingEventChanged"
        default:
          $ref: "#/components/responses/Problem"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PackingEventChange"
  /packing-lists/{listId}/default-permissions:
    get:
      operationId: getPackingDefaultsBaseline
      x-surveyor-command: {retryPolicy: read, precondition: none}
      summary: Read only granted audience masks for a reviewed defaults update
      parameters:
        - $ref: "#/components/parameters/Context"
        - $ref: "#/components/parameters/Locale"
        - $ref: "#/components/parameters/ListId"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Current independently authorized field baseline
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackingDefaultsBaseline"
        "304":
          description: Authorized baseline unchanged; no response body
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: updatePackingDefaults
      x-surveyor-command: {retryPolicy: reconcile-only, precondition: settings}
      summary: update Packing Defaults
      parameters:
        - $ref: "#/components/parameters/Context"
        - $ref: "#/components/parameters/Locale"
        - $ref: "#/components/parameters/ListId"
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: Authorized operation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MutationResult"
        default:
          $ref: "#/components/responses/Problem"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PermissionDefaultsPatch"
  /packing-lists/{listId}/admins:
    post:
      operationId: addPackingAdmin
      x-surveyor-command: {retryPolicy: reconcile-only, precondition: settings}
      summary: add Packing Admin
      parameters:
        - $ref: "#/components/parameters/Context"
        - $ref: "#/components/parameters/Locale"
        - $ref: "#/components/parameters/ListId"
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: Authorized operation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MutationResult"
        default:
          $ref: "#/components/responses/Problem"
