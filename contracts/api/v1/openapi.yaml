components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: connect.sid
  parameters:
    Context:
      in: header
      name: X-Surveyor-Context
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 256
    Locale:
      in: header
      name: X-Surveyor-Locale
      required: false
      schema:
        $ref: "#/components/schemas/LocaleTag"
    Csrf:
      in: header
      name: X-CSRF-Token
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 256
    ListId:
      in: path
      name: listId
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    ItemId:
      in: path
      name: itemId
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    IfMatch:
      in: header
      name: If-Match
      required: true
      schema:
        $ref: "#/components/schemas/ComparisonToken"
    EventIfMatch:
      in: header
      name: If-Match
      required: false
      description: Ignored for an authorized unchanged choice, which returns without comparing or writing. An actual relationship change requires a ComparisonToken and current-value comparison under the existing locks.
      schema:
        type: string
    IfNoneMatch:
      in: header
      name: If-None-Match
      required: false
      schema:
        type: string
        maxLength: 4096
    HelpDocument:
      in: query
      name: doc
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 100
        pattern: ^[a-zA-Z0-9_-]+$
    HelpQuery:
      in: query
      name: q
      required: false
      schema:
        type: string
        maxLength: 100
    ProfileId:
      in: path
      name: profileId
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    AssignmentId:
      in: path
      name: assignmentId
      required: true
      schema:
        $ref: "#/components/schemas/DecimalId"
    SearchQuery:
      in: query
      name: q
      required: false
      schema:
        type: string
    SelectedEvent:
      in: query
      name: selected
      required: false
      schema:
        $ref: "#/components/schemas/Uuid"
  responses:
    Problem:
      description: A safe localized RFC 9457 problem; machine code controls recovery
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
