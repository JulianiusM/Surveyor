  /packing-lists/create-entry:
    get:
      operationId: getPackingCreateEntry
      x-surveyor-command: {retryPolicy: read, precondition: none}
      summary: Read the native account-only creation admission and public form context
      security: []
      parameters:
        - $ref: '#/components/parameters/Context'
        - $ref: '#/components/parameters/Locale'
        - name: returnTo
          in: query
          schema: {type: string, maxLength: 2048}
        - name: eventId
          in: query
          description: Optional contextual selection; the native selection owner omits rejected targets.
          schema: {type: string}
      responses:
        '200':
          description: Server-owned page admission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackingCreateEntry'
        default:
          $ref: '#/components/responses/Problem'
  /packing-lists/{listId}/entry:
    get:
      operationId: getPackingResourceEntry
      x-surveyor-command: {retryPolicy: read, precondition: none}
      summary: Read native detail or guest-entry admission without disclosing protected list data
      security: []
      parameters:
        - $ref: '#/components/parameters/Context'
        - $ref: '#/components/parameters/Locale'
        - $ref: '#/components/parameters/ListId'
        - name: view
          in: query
          required: true
          schema: {type: string, enum: [detail, guest]}
      responses:
        '200':
          description: Server-owned page admission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackingResourceEntry'
        default:
          $ref: '#/components/responses/Problem'
