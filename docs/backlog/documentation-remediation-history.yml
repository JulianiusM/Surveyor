  - id: IMP-174
    status: closed
    closed_on: 2026-10-27
    severity: medium
    owner: shared lifecycle and entity maintainers
    package: architecture-archive-reference-identity
    title: Archive snapshots and their consumers disagree about requested versus
      stored root identity
    evidence:
      - EntityLifecycleService.getArchiveSnapshot keys loaded roots by their
        stored root.id. archiveKey preserves exact spelling;
        getArchivePresentations looks up the caller's requested reference and
