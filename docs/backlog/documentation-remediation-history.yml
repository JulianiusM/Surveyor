  - id: IMP-007
    status: resolved
    severity: high
    owner: application maintainers
    out_of_scope_for_documentation_migration: true
    title: Event registration-link creation ignores the submitted Uses value
    evidence:
      - src/backend/views/modules/module_registration_links.pug exposes a Uses
        field with values greater than one
      - src/public/js/modules/reg-links.ts sends maxUses to the event links API
      - src/backend/modules/database/services/EventService.ts stores and
        enforces maxUses
      - "src/backend/controller/eventController.ts creates every link with
        maxUses: 1"
    impact: A link configured for multiple late registrations is created as single-use.
    documentation_contract: D05 documents the coherent working contract in which
      Uses controls the allowed number of successful late registrations and does
      not mention the controller mismatch.
    closes_when:
      - The shared Event registration feature validates and forwards the requested positive whole-number
        maxUses value through pure DBAL persistence.
      - Route or integration tests cover single-use and multi-use links, exhaustion, expiry and
        revocation.
      - User-facing Uses guidance remains aligned with the selected behavior.
    resolution:
      implementation: Shared Event registration feature validates and persists requested integer Uses
        (1..32767), defaults omitted Uses to one and keeps expiry/revocation/exhaustion plus transaction
        rollback. Integration covers default/multi-use, concurrent final use, invalid expiry/revocation
        and rollback after failed attendance.
      verification: "Five focused integration files pass 78 tests on the task-owned MariaDB 10.11.14
        schema: event-api, event-workflows, entity-overview, drivers-v1-api and drivers-workflows. The
        focused Event database-free selection passes 26 tests; server TypeScript and the
        development-policy check (418 global sources, four owned files, zero findings) pass. No
        deployment or hosted CI result is claimed."
    resolved_on: 2026-10-28
    current_review:
      reviewed_on: 2026-10-28
      finding: Event registration feature validates and honors requested integer Uses from 1 through
        32767; omission defaults to one. Expiry, revocation and exhaustion use one shared eligibility
        rule and attendance rollback does not spend a use.
      source_anchors:
        - src/backend/modules/event/registration.ts
        - src/backend/modules/database/services/EventService.ts
        - contracts/api/v1/events.yaml
        - src/frontend/features/event/EventBypassLinks.vue
