        readSurveySettings pass raw request IDs and dereference the absent
        archive presentation. Event settings uses loaded event.id and is
        unaffected; Overview read cards use stored IDs and its
        navigation/visibility inputs explicitly normalize casing.
      - Production-controller probes on a freshly owned MariaDB 10.11.14 schema
        with utf8mb4_unicode_ci reproduce TypeError reading canManage for
        uppercase-root full settings in all four affected features. Canonical
        reads pass; Event accepts both spellings. Narrow Packing/Drivers
        administrator reads/writes also resolve uppercase roots. No response
        token is issued by the failing full-settings read.
      - Source tracing additionally finds raw references in shared non-Survey
        archive-management permission lookup, which can deny an otherwise
        admitted alternate-case operation before writing. That command outcome
        is source-derived rather than separately executed here. The
        key/reference behavior predates R3 and is preserved by IMP-141's
        equivalent extraction; ordinary frontend pages lowercase route IDs.
      - Independently confirmed Event-child archival source paths also compare
        an alternate-case child directly with stored card.id, or a loaded
        child.eventId with the raw requested parent ID. Those paths can reject
        before commit; no Event-child HTTP/command reproduction is claimed.
        Event settings success does not certify all of its lifecycle commands.
    impact: Valid alternate-case UUIDs may resolve to a stored entity but fail its
      full settings read because one lifecycle identity has two lookup
      spellings. No ordinary lowercase browser failure or unauthorized write is
      established. This is a separate observable failure from IMP-173's latent
      token mismatch.
    independent_review: Fresh backend and independent source reviewers confirm the
      cross-feature chain and inherited baseline; the independent reviewer
      verifies the root-owned actual-database probe and unaffected controls.
    disposition: One shared lifecycle UUID key joins snapshots/presentation, while permission targets
      and descriptor lookups use loaded stored identity. All five settings/lifecycle families and
      Event-child archive/restore/deletion paths directly adopt it. Real persistence distinguishes
      alternate spellings, delegated grant revocation, outsider denial, foreign parents and unavailable
      independent schedules; no per-controller fallback masks missing projections.
    closes_when:
      - One shared identity rule gives equivalent admitted archive/settings
        behavior for supported UUID spellings across all five features, with
        exact private-parent and ownership/grant checks retained.
      - Real-persistence read/command cases distinguish missing rows, alternate
        spelling, unauthorized actors and actual archive state. IMP-173 receives
        its own explicit comparison-token decision rather than inferred
        approval.
  - id: IMP-175
    status: closed
    closed_on: 2026-10-27
    discovered_on: 2026-10-27
    severity: medium
    owner: backend identity and Activity maintainers
    package: architecture-uuid-reference-consistency
    title: Accepted UUID spellings diverge in remaining scope checks, lookup maps
      and job identity
    evidence:
      - A further read-only inventory covers 184 backend TypeScript files, all
        nine controllers, 599 equality/collection candidates and 48
        computed-index candidates. These are review signals, not defect counts
        or line certification.
      - Existing Packing/Drivers item-baseline, shared item
        update/delete/assignment removal and self-assignment paths compare
        loaded foreign keys with raw root IDs. Activity text, slot, assignment
        and role paths also compare raw plan IDs with loaded scope. Successful
        database lookup alone cannot make those strings equal.
      - Activity role projections and individual permission maps use stored slot
        keys but some consumers index raw slot IDs. Exact production-body probes
        show missing configured roles, named-role rejection, and an ordinary
        unassignment acknowledgement without a deletion when canonical
        assignment evidence is injected.
      - Complete-order membership compares submitted UUIDs exactly. With valid
        grant/token evidence, uppercase body IDs reach RESOURCE_CONFLICT409 for
        Packing/Drivers and NOT_FOUND404 for Activity in pure production-body
        probes.
      - Activity requirement/recommendation, attendance and assignment maps also
        use submitted profile/slot references without a consistent
        reference-to-stored identity mapping. Outcomes depend on the operation
        and linked context.
      - Activity passes raw plan IDs into its generic recommendation
        coordinator. An actual coordinator probe with non-database callbacks
        creates separate jobs for canonical/uppercase aliases; canonical
        invalidation leaves the alternate job queued. Plan/job observation uses
        exact keys too.
    impact: Direct API clients using admitted alternate UUID spellings can encounter
      false missing/conflict outcomes, omitted role/permission evidence,
      acknowledged no-ops or divergent process-local jobs. Ordinary browser
      pages lowercase root routes and use returned child IDs; no ordinary
      browser failure is established by this review.
    independent_review: Independent source tracing, real generated validator checks
      and exact production-body/coordinator probes confirm the bounded branches.
      Material clauses predate this remediation. No ORM initialization, database
      lookup, HTTP reproduction, persisted outcome or unauthorized-actor bypass
      is claimed for this additional finding.
    negative_controls: Finance uses loaded Event scope; Overview normalizes external
      targets; same-spelling Event/Activity ACL tokens remain coherent. Decimal
      handles and opaque security/context/cursor/comparison tokens are separate.
    disposition: Completed; current implementation, preserved feature boundaries and scoped acceptance
      evidence are recorded in implementation_2026_10_27.
    implementation_2026_10_27: >-
      Existing lib/util.ts owns UUID keys, comparison, indexing, grouping and
      loaded-reference resolution. Controller, permission/lifecycle,
      list/Overview read and Activity business owners directly adopt it.
      Complete Packing/Drivers orders retain completeness/uniqueness; Activity
      partial orders retain submitted positions and multiplicity.
      Warning/recommendation values retain their existing presentation
      references; fresh worker/fingerprint copies use canonical UUID components.
      Full settings, narrow defaults/admin/header baselines and their write
      consumers also share typed root/profile UUID keys; administrator row
      tokens directly reuse the existing shared token owner and Event reuses its
      audience-field mapper. Submitted opaque evidence, captured actor/context,
      zero versus absent grants and feature-specific review order remain exact.
      The generic job coordinator is unchanged.
    closes_when:
      - An explicit identity decision covers all confirmed scope, lookup, order,
        submitted-reference and job paths through existing owners while
        preserving grants, locks, foreign/missing controls and opaque-token
        semantics.
      - Real persistence and controller/job cases cover aliases, mixed-case
        duplicates, role maps, actual unassignment, denied actors, foreign roots
        and canonical controls; no general UUID-equivalence claim rests on
        source probes.
