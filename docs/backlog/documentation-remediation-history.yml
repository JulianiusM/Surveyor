    resolution:
      implementation: Final-profile account-deleted completion clears/saves local state and goes Home
        without selecting a nonexistent profile; detached Profile/domain data and existing database/mail
        order remain.
      verification: Root reports 92 focused authentication/integration, 23 real HTTP and 23 database-free
        identity cases passing, plus final server/test compilation and full application build. All 16
        unique selected built system cases pass across focused reruns. The broad current Vitest
        invocation passes 2812 of 2813 with one obsolete icon expectation; the corrected 64-case file
