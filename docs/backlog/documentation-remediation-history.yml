      across all five features, with independent and root source acceptance and exercised persistence/browser
      coverage. No unintended grant/projection mismatch or permission rework was established. Deliberate
      public powers, parent fallbacks and feature exceptions remain unchanged. The reference's obsolete
      activity-role attachment label is corrected; separate lifecycle findings remain under ARCH-005. This
      does not certify every concurrency schedule or a production deployment.
