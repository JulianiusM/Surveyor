    title: Pilot admission can save an earlier session over a later identity
      transition
    evidence:
      - The original src/backend/modules/api/session.ts reloadSession installed
        fresh stored evidence directly into req.session through
        sessionStore.createSession. Express retained its initial saved-state
        comparison while the replacement lost the middleware save/reload
        wrappers. The direct replacement first appeared in correction d58fb35.
      - A database-free HTTP fixture using production captureApiActor and actual
        Express/session middleware loaded context A, admitted stored context B,
        then stored C before completing the response. The response saved B
        again; final stored context was B instead of C. Root and independent
        review reproduced it.
      - The installed TypeormStore set operation serializes the complete
        session; touch only updates expiry. Restoring an earlier
        authentication/profile snapshot was a source-supported consequence, not
        a demonstrated account exploit.
    resolution: Current source keeps one ordinary Express req.session;
      stored-generation checks reject without replacing or mutating it, and a
      plain server-hydrated actor supplies operation identity. Initial
      public/session projection has null metadata and no anonymous
      initialization. Authenticated legacy compatibility derives bounded
      server-session-bound HMAC metadata without a write; explicit identity
      transitions retain their random pair. Only the separately approved
      identity-completion transaction stages a Session, including a first absent
      row after validated preparation. Public method comparison scope needs no
      anonymous principal; controller grants remain authoritative. Existing
      feedback uses ordinary library getters/saves with empty pilot getters
      avoided and required business continuations preserved. The reproduced
      read-only overwrite is verified repaired under the latest explicit
      restoration authorization. This new bounded closure does not reinstate the
      challenged lifecycle or its withdrawn acceptance; the separate
      redirect-notice consequence still prevents overall stateless readiness.
    documentation_contract: Ordinary admission/projection must not install or
      persist another Session snapshot or create a synthetic anonymous session.
      Explicit operations retain their separately owned session-change
      contracts; native TTL/touch, real feedback consumption and expiry/provider
      effects are preserved.
    verification: Build, final server emission and both noEmit compilers passed.
      Database-free cases total 1528 passing across the initial selection and
      unchanged targeted rerun. The five-file ORM selection passed 150; after
      the partial-legacy correction its authentication file passed 73, including
      two new cases. Together with 20 other Packing cases passed earlier, these
      are 172 distinct ORM assertions across runs. Client-browser checks passed
      21. Engineering enforcement passed 26 synthetic CLI cases and a
      321-source/11-DBAL scan plus 19 readability files/29 operations without
      findings. All 78 distinct selected built-system cases pass across the
      initial normal configuration, corrected real-mouse drag rerun and
      local-login-disabled case; no final uniform 78-case run is claimed. The
      full boundary-tool suite passed 25 with no skips/failures. The paired
      review preserves initial failures, corrections, exact selections and
      limits; document preparation remains separate advisory evidence.
    closure_evidence:
      - Root and independent source review confirm one ordinary request Session,
        a read-only mismatch check and a plain hydrated actor; only the
        separately approved explicit identity transaction stages completion.
      - Actual HTTP/session regressions reject stored B while retaining Express
        A, its save/reload methods and later stored C without response-time
        persistence. Real ORM cases cover first completion, legacy read-only
        metadata, actor-preserving receipts, malformed staged-output rollback
        and retained required business continuations.
      - The closure relies on the maintainer's latest explicit full-plan
        authorization and the bounded adopted source and current execution
