        require their management grant. Activity separately filters names/attendance/participants through
        ACCESS_PARTICIPANTS. Survey deliberately exposes named ballots to admitted profiles while excluding
        account/guest secrets; Event detail and its separately guarded roster/invoice reads remain distinct.
