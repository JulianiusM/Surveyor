  - id: IMP-207
    status: resolved
    resolved_on: 2026-10-29
    discovered_on: 2026-10-28
    severity: high
    owner: identity/session maintainers
    package: production-readiness-review
    title: Ordinary session renewal acknowledges a pending expiry write and invokes completion twice
    related_findings:
      - ARCH-005
    implementation_evidence:
      - src/backend/app.ts
      - src/backend/modules/lib/session.ts
      - package-lock.json
      - tests/unit/session-store-completion.spec.ts
      - tests/integration/session-renewal.spec.ts
    evidence:
      - The configured connect-typeorm 2.0.0 touch method invokes its callback immediately when the Session
        cookie has expires, then still starts the expiry UPDATE and invokes the callback again when it settles.
        The application's one-day maxAge produces that normal cookie shape; at discovery createSessionStore
        overrode destruction only, leaving this touch implementation live.
      - A controlled asynchronous repository gate through the actual configured store reproduces one success
        callback before the pending UPDATE, followed by another success after completion. Rejected UPDATE
        instead produces success followed by the controlled error and one disconnect event.
      - A controlled synchronous query-construction failure likewise occurs after the premature success
        callback, escaping as a thrown error without the store's normal disconnect notification.
      - Express-session response completion invokes its response-ending continuation on each touch callback
        and forwards a later error. This is an adapter callback reproduction and source/caller inspection;
        it does not establish real database failure frequency or an observed duplicate HTTP response.
    impact: Ordinary stored-session reads can acknowledge renewal before its write settles, then signal
      completion or failure again after the response has already continued.
    closes_when:
      - The existing expiry UPDATE completes before exactly one success or failure callback.
      - Existing one-day TTL, expiry writes, identity JSON, destruction and disconnect reporting are preserved.
      - Controlled pending, successful, failed and synchronous-failure adapter cases protect callback timing.
      - Actual Express response completion and appropriate isolated persistence checks verify the live owner.
    disposition: The configured factory now acknowledges its existing expiry-only update exactly once after
      completion, including synchronous failures, retaining TTL, identity JSON, cookie policy and disconnect
      reporting. Nine controlled adapter cases and two real MariaDB/Express cases pass, including a held SQL
      renewal and a rejected update. The repair does not guarantee an HTTP error after bytes were sent or
      certify broader session lifecycles.
