implementation_defects:
  - id: IMP-001
    status: resolved
    severity: high
    owner: application maintainers
    out_of_scope_for_documentation_migration: true
    title: Built-in OIDC redirect default does not match the mounted callback route
    evidence:
      - src/backend/app.ts mounts the users router at /users
      - src/backend/routes/users.ts registers /oidc/callback inside that router
      - src/backend/modules/settings.ts defaults to a URL ending in
        /user/oidc/callback
    impact: OIDC login can fail when the mismatched default is used unchanged.
    documentation_contract: Product documentation uses the corrected
      /users/oidc/callback contract and does not mention this transient defect.
    closes_when:
      - an explicitly authorized application change aligns the default with the
        mounted route or deliberately changes the route
      - tests and examples cover the selected behavior
      - D04 and D12 are re-verified if their documented contract changes

    resolution:
      implementation: Built-in callback default matches /users/oidc/callback; explicit overrides remain untouched.
      verification: Seven focused database-free files pass 439 tests before final minor edits; current
        identity/profile/Drivers/Finance reruns pass 176 and shared presentation passes 68. Frontend/SSR
        and full test typechecks pass; root full build passes. Seven isolated built-client cases pass,
        including six painted Packing icon viewport/linkage cases and one recovery completion/history
        case. These are focused checks; no hosted CI or full E2E-inventory result is claimed.
      validation_status: Selected focused checks complete.
    resolved_on: 2026-10-28
    current_review:
      reviewed_on: 2026-10-28
      finding: The built-in OIDC callback now uses the mounted /users/oidc/callback path; explicit
        configured values are preserved.
      source_anchors:
        - src/backend/modules/settings.ts
        - src/backend/routes/users.ts
      test_definitions:
        - tests/unit/frontend-identity.spec.ts
      evidence_limit: Source and existing test definitions are evidence of implementation/coverage only;
        executed checks are stated separately in resolution.
  - id: IMP-003
    status: resolved
    severity: high
    owner: application maintainers
    out_of_scope_for_documentation_migration: true
    title: Registration and reset share Unicode-aware password admission and guidance
    evidence:
      - contracts/api/v1/auth.yaml NewPassword owns the 15-code-point minimum and 72-UTF-8-byte maximum for all
        registration/reset password fields.
      - src/common/generated/passwordPolicy.ts derives limits from that schema; common/lib/frontendIdentity.ts evaluates
        them and common/lib/utf8.ts supplies the byte measurement embedded into both standalone validators.
      - src/backend/modules/identity.ts validates before registration/reset writes; IdentityPage.vue uses the same rule and
        localized guidance for both forms.
    impact: A client bypass or the reset path can accept a password that does not meet the policy presented during registration.
    documentation_contract: Registration and reset guidance describes the shared 15-code-point minimum and 72-UTF-8-byte
      maximum without composition requirements. Existing-password login retains its separate unchanged admission.
    closes_when:
      - Registration and reset consistently enforce the shared Unicode/byte limits without composition rules.
      - Exact entered values, password hashing and existing-password login remain unchanged.
      - Boundary, rejection-before-write, real browser and generator-adoption tests verify the shared implementation.
    current_review:
      reviewed_on: 2026-10-28
      finding: One authored policy now drives business admission, server/browser standalone validators and registration/reset
        guidance. Login retains its existing HTML presentation and API credential admission; no normalization, trimming,
        hashing or database schema change was made.
      source_anchors:
        - contracts/api/v1/auth.yaml
        - src/common/lib/frontendIdentity.ts
        - src/common/lib/utf8.ts
        - src/backend/modules/identity.ts
        - src/frontend/features/identity/IdentityPage.vue
        - scripts/generate-api.mjs
        - scripts/watch-frontend-inputs.mjs
      evidence_limit: Focused current-source, disposable-database and built-browser verification; not a full password-standard
        compliance or live deployment certification.
    reported_evidence:
      - src/public/js/core/password-validation.ts defines the intended minimum of eight characters, one letter, and one digit
      - src/backend/views/users/register.pug loads the password validator, but src/backend/controller/userController.ts
        checks only presence and equality
      - src/backend/views/users/reset-password.pug declares only an eight-character HTML minimum and the reset controller
        checks only equality
    resolved_on: 2026-10-28
    resolution:
      implementation: New credentials require at least 15 Unicode code points and at most 72 UTF-8 bytes, without letter/digit
        requirements. Generated limits and one UTF-8 counter are adopted by all affected callers.
      verification: 104 authentication integration cases, 125 identity UI cases, 71 shared-policy/contract unit cases, all 16
        generator cases and seven selected built-app cases pass. Full application build, frontend/SSR/test typechecks,
        development and whitespace checks pass. The generator override fixture proves changed authored limits reach metadata
        and both validators; the watcher verifies atomic helper edits regenerate before readiness.
      boundaries: Existing password verification, bcrypt storage and exact input handling are unchanged; no database migration
        or provider behavior change. The byte cap does not establish full NIST compliance.
  - id: IMP-004
    status: resolved
    severity: high
    owner: application maintainers
    out_of_scope_for_documentation_migration: true
    title: Guest recovery is not reachable through the login page in an
      organization-sign-in-only deployment
    evidence:
      - src/backend/routes/users.ts redirects GET /users/login to OIDC before
        rendering the page when local login is disabled
      - the guest-recovery form exists only in src/backend/views/users/login.pug
      - GET /guest/recovery redirects back to /users/login
    impact: A guest with an email address can be unable to request their private
      links when the deployment disables local login.
    documentation_contract: D01 documents guest email recovery as an
      authentication-mode-independent capability and does not repeat the routing
      defect.
    closes_when:
      - guest recovery remains directly reachable when local login is disabled
      - invitation, login, and recovery routes preserve the intended return path
      - automated route tests cover local-only, mixed, and
        organization-sign-in-only deployments

    resolution:
      implementation: GET recovery and Login share the actual recovery form, captured email command, safe
        return and one-time completion. Direct recovery entry works independently of local account
        login/provider configuration.
      verification: Seven focused database-free files pass 439 tests before final minor edits; current
        identity/profile/Drivers/Finance reruns pass 176 and shared presentation passes 68. Frontend/SSR
        and full test typechecks pass; root full build passes. Seven isolated built-client cases pass,
        including six painted Packing icon viewport/linkage cases and one recovery completion/history
        case. These are focused checks; no hosted CI or full E2E-inventory result is claimed. All 16
        unique selected built system cases pass across focused reruns after fixture/oracle corrections;
        this is not a full E2E-inventory result.
      validation_status: The real built guest recovery document/API/reload workflow passed.
    current_review:
      reviewed_on: 2026-10-28
      finding: GET /guest/recovery renders the shared identity recovery form independently of
        local-login/OIDC configuration. Entry alone never claims mail was sent; only the scoped
        confirmed completion supplies Success.
      source_anchors:
        - src/backend/routes/guests.ts
        - src/frontend/features/identity/IdentityPage.vue
        - src/common/lib/frontendIdentity.ts
      test_definitions:
