      organizer review correctness; the existing warning review and result counts remain available.
    documentation_contract: Local review actions preserve the explicitly selected swap pair; the shared
      controller remains authoritative for warnings, blocking, application and actual applied/skipped results.
    disposition: Completed within the recorded approved scope; current implementation and executed verification
      are stated below.
    closes_when:
      - A production-shaped backend regression reproduces multiple independent reciprocal moves and
        demonstrates the incorrect blocking relationship or establishes a narrower verified condition.
      - An explicit maintainer decision defines reliable swap provenance and compatibility for saved rows
        before any dependent controller, wire or persistence change.
      - The shared controller propagates blocking only across the intended swap while retaining eligibility,
        overlap acknowledgement, exact reviewed inputs and truthful applied/skipped results.
      - Focused persistence coverage protects independent moves, both true swap legs, payload ordering and
        repeated slot directions without silently broadening native or versioned behavior.
    current_review:
      reviewed_on: 2026-10-28
      finding: Shared recommendation generation, wire validation, review and persistence distinguish unknown
        legacy provenance, explicit independent moves and exact reciprocal swap pairs. Blocking propagates
        only inside the explicit pair.
      evidence_limit: Legacy rows require an explicit pair or independent choice. Migration rollback refuses to
        discard recorded provenance. The complete released bootstrap remains blocked separately by
        IMP-205/IMP-206.
    reported_evidence:
      - src/backend/controller/activityController.ts includeBlockedSwapLegs selects the first reciprocal
        REASSIGN by source and target slot IDs without participant identity or an explicit swap relationship.
      - prepareRecommendationApplication invokes that helper while removing blocked approved operations, so
        its pairing decision can change the remaining applicable set and reported skipped count.
      - The frontend review independently reproduced the analogous wrong-partner selection in
        recommendationDraft.ts with multiple manual moves between the same two slots. That reproduction does
        not establish a persisted backend failure; this backend finding is a source-based inference and needs
        a dedicated reproduction.
    resolved_on: 2026-10-28
    resolution:
      implementation: Shared recommendation generation, wire validation, review and persistence distinguish
        unknown legacy provenance, explicit independent moves and exact reciprocal swap pairs. Blocking
        propagates only inside the explicit pair.
      verification: A narrow old-backend reproduction applied zero despite one eligible independent move. The
        refined four-move fixtures keep expected independent 3/1 and true-pair 2/2 counts; all seven Activity
        production-boundary database cases pass on Node.js 24.15.0 and disposable MariaDB 10.11.14. Focused
        frontend and broad integration checks pass.
      remaining_scope: Legacy rows require an explicit pair or independent choice. Migration rollback refuses to
        discard recorded provenance. The complete released bootstrap remains blocked separately by
        IMP-205/IMP-206.
