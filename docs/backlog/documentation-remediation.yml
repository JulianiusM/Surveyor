  - id: IMP-045
    status: closed
    closed_on: 2026-10-13
    severity: high
    owner: frontend migration maintainers
    out_of_scope_for_documentation_migration: true
    title: Pilot startup can discard edited SSR controls and reload repeatedly without attempt storage
    evidence:
      - The reviewed entry-client.ts awaited bootstrap decoding and router readiness before mount restoration and
        application readiness; initial route failure could reload before mounted guards protected edited SSR controls.
        The review reproduced pre-hydration input loss at that boundary.
      - The prior update owner continued an automatic reload after attempt-storage errors. The review reproduced
        repeated automatic attempts when browser storage could not retain the loop marker.
      - A consumed automatic-attempt marker also blocked the only reload action instead of preserving a distinct
        guarded deliberate recovery path for the unmounted document.
    authorization: The maintainer explicitly approved the full reviewed plan and startup recovery on 2026-10-13.
      The single dated amendment in docs/frontend-migration/FRONTEND_FOUNDATION_DESIGN.md records the exact boundary.
    documentation_contract: Protect edited SSR controls before route loading until mount restoration finishes.
      Automatic reload requires demonstrably clean state and working loop protection. Unavailable storage exposes
      localized deliberate recovery; it may bypass the automatic marker but retains edited-control consent and
      pending/unknown command guards, without persisting secrets/files or replaying writes.
    closes_when:
      - Actual startup/update consumers preserve edited controls during failed route/bootstrap loading and cancelled recovery.
      - Clean automatic recovery uses working loop protection, while storage failure and a consumed marker retain deliberate recovery.
      - Production review verifies guard installation before loading and release after mount restoration, with existing command protection intact.
    closure_evidence:
      - Five initial-startup browser cases passed against real built SSR,
        manifest and client assets with wholly intercepted synthetic HTTP. They preserve edited username/password nodes,
        opted-in creation text/FileList and canceled recovery; accepted discard uses one prompt, pristine startup reloads
        once, a stored marker admits deliberate recovery and unavailable storage exposes localized recovery without looping.
        Their retained source is now tests/frontend/browser/frontend-startup.spec.ts under the explicit client-layer
        requirement; this wholly intercepted receipt is not full-application E2E evidence.
      - Current update/hydration owner assertions cover attempt-storage getter/read/write failures, working automatic
        loop protection and retained draft/pending guards. Existing quick-suite command assertions and independent
        semantic review protect unknown-outcome leases; new manual-marker cases do not independently certify that
        boundary. Source review verifies early guard installation and normal mount-restoration handoff, with no
        secret/file persistence or command replay.
      - Exact current commands, results and no-database/arbitrary-mount limitations are owned by the paired pilot review.
