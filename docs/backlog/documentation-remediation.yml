  - id: DESIGN-EVENT-CREATION-TRANSPORT
    status: closed
    closed_on: 2026-10-16
    discovered_on: 2026-10-16
    severity: medium
    category: design-provenance
    owner: frontend migration maintainers
    package: frontend-pilot-readiness
    title: Ordinary Vue document workflows must adopt the original SPA command and navigation design
    evidence: The original frontend foundation requires JSON commands for ordinary JavaScript workflows. At the
      pre-D1 review, EventCreatePage and frontendPilotEvent.ts used document POST for Event creation and duplication;
      staged Development described this transport and generalized it for inherited partial mutations. Existing provider,
      token and output document boundaries do not independently establish approval for ordinary Event creation.
    authorization: The maintainer directly rejects D1 retention of Event document creation as a SPA rewrite
      violation and requests full implementation of the original ordinary JSON/multipart commands and client
      navigation, including equivalent implemented P0-P2 Vue forms and links and prevention guidance. This supplies
      forward correction authority, not retrospective approval for the earlier document transport.
    disposition: Closed for the implemented current P0-P2 correction after independent actual-consumer review and
      scoped fresh verification. Event and Packing creation adopt
      useCreationCommand; Settings, Overview and Event-child deletion adopt useEntityRemoval. Profile token and
      destructive workflows use generated commands, read-only warm admission and existing identity completion;
      ordinary migrated links use Router, and displaced document-only Vue adapters/helpers are retired.
      Existing shared controller and DBAL operations retain native ordering and possible partial outcomes; general
      token, transfer, deactivation, deletion and transaction repairs remain excluded. True provider/capability
      arrivals, outputs, initial hard loads and unmigrated destinations keep their distinct document boundaries.
    closes_when:
      - Event creation and duplication, profile token and destructive workflows, Event-rendered child deletion and
        ordinary migrated links adopt generated SPA commands and shared Vue owners in every matching current consumer.
      - Existing application-level E2E asserts same-document behavior, actual backend effects and meaningful
        validation, retained draft/file, private-state and pending/unknown no-replay recovery boundaries.
      - The existing playbook, coverage and review reflect actual source and executed evidence, preserve original
        choices with the direct dated amendment and distinguish permitted document boundaries from ordinary commands.
    evidence_limit: Original Git design, direct correction authority and actual source adoption reviewed. Fresh
      build, complete test compiler and all 45 frontend files with 1004 tests pass; 84 distinct ORM cases have scoped
      combined evidence after a test-only Event tinyint assertion correction. The broad 109-case built run had
      103 passes, five failures and one appropriate configuration skip. The four fixture-only expectation/tab fixes
      and unchanged drag case then passed together; three further unchanged drag repetitions passed. Across main
      and corrected runs, 108 distinct normal cases have positive evidence, plus the separately configured alternate
      case. This is not one uniform 109-case pass or a claimed drag-timeout repair. Independent review accepted
      20 profile and 12 Event/German originals within their captured scope. The paired pilot review owns exact
      receipts and remaining limits; no stronger backend atomicity, full-application or future-phase acceptance follows.
