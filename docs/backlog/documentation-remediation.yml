        backend failure; this backend finding is a source-based inference and needs a dedicated reproduction.
    impact: With several reciprocal moves, blocking one operation can also block an unrelated participant's move
      rather than its intended swap partner, changing applied/skipped outcomes. The possibility affects organizer
      review correctness; the existing warning review and result counts remain available.
    authorization: On 2026-10-20 the maintainer explicitly approved R2's frontend-only pairing correction and requested
      a backend backlog item with appropriate severity. This records P2 priority and does not authorize a backend fix,
      a wire or stored-data change, native changes, or stronger application guarantees.
    documentation_contract: Local review actions preserve the explicitly selected swap pair; the shared controller
      remains authoritative for warnings, blocking, application and actual applied/skipped results.
    disposition: The Vue correction retains local pair identity and requires an explicit counterpart when saved rows
      are ambiguous. It does not repair or replace includeBlockedSwapLegs. Backend remediation remains a separately
      authorized effort, distinct from IMP-029's warning/result presentation coverage.
    closes_when:
      - A production-shaped backend regression reproduces multiple independent reciprocal moves and demonstrates
        the incorrect blocking relationship or establishes a narrower verified condition.
      - An explicit maintainer decision defines reliable swap provenance and compatibility for saved rows before
        any dependent controller, wire or persistence change.
      - The shared controller propagates blocking only across the intended swap while retaining eligibility,
        overlap acknowledgement, exact reviewed inputs and truthful applied/skipped results.
      - Focused persistence coverage protects independent moves, both true swap legs, payload ordering and repeated
        slot directions without silently broadening native or versioned behavior.
