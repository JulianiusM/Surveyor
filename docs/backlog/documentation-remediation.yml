  - id: IMP-048
    status: closed
    closed_on: 2026-10-13
    severity: high
    owner: frontend migration maintainers
    out_of_scope_for_documentation_migration: true
    title: Guest registration can commit before its stored identity and final response are safely established
    evidence:
