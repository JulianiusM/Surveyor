run_protocol:
  - Apply the canonical documentation policy and explicitly authorized scope; feature-specific behavior and deliberate
    exceptions govern the working contract.
  - Reproduce open findings against current evidence; register transient implementation defects once and retain them
    only in migration controls.
  - Choose the smallest coherent document set; link to existing owners instead of duplicating commands, contracts or
    execution history.
  - Use optional reports to retain real findings and source-baseline limits; documentation never blocks application
    delivery.
  - Record only latest relevant evidence and remaining work; prior transcripts remain in Git and ignored run artifacts.
migration_tracking:
  status_document: docs/frontend-migration/DOCUMENTATION_MIGRATION_STATUS.md
  policy_document: docs/policies/DOCUMENTATION_POLICY.md
  checker: scripts/check-documentation.mjs
  checker_config: docs/policies/documentation-check.json
  current_baseline: docs-baseline-2026-09-06-ci-repair
  next_continuation: D04V / OPSV-001 is an independent advisory rehearsal. Frontend pilot correction and current evidence
    belong to docs/frontend-migration/PILOT_PARITY_REVIEW.md; unrelated native repairs require their own authorization.
completed_verification:
  documentation_packages: D00–D14 completed; D04V remains deferred and advisory. Package/closed-finding IDs above retain disposition.
  d14_visuals: Recorded review of four raster illustrations at full resolution and narrow preview sizes; initial tool
    failures were later corrected. Detailed asset hashes and captures remain in Git/ignored artifacts.
  d14_tooling: D14-VAL-001 and D14-VAL-002 closed by dependency-free path/fingerprint and help-authoring regression
    checks. Historical blocking CI policy was subsequently withdrawn.
  advisory_policy: Documentation checks/content suites/release copy remain non-blocking; security and executable Help
