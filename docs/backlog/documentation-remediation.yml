      - src/backend/routes/api/v1/auth.ts
    deficiency: Native documents, pilot documents and versioned API operations retain different session and feedback
      lifecycles. Their complete intended contract has not received one application-wide verification and unification
      review. This is a requested architectural follow-up, not a claim that every difference is a defect.
    architecture_review_2026_10_26: Current documents and APIs share captureApiActor in modules/api/session.ts 54;
      userController.ts validateSession 1159-1188 remains a second identity-validation implementation with no callers
      in application source or tests. Independent source/import review confirms this is unused legacy duplication,
      not an active security bypass. Its later approved retirement should retain the captured-actor owner; scoped
      stageIdentitySession behavior, ordinary Express saves and documented transport differences are not defects.
      OIDC/user-controller cycle and repeated identity assignment are separately scoped in IMP-140. This static
      review does not close the requested whole-session/flash runtime verification or grant session-redesign authority.
    scoped_retirement_R3_2026_10_26: The explicit R3 approval authorizes removal of unused validateSession only.
      Its definition is retired with no production callers to replace; captured-actor admission remains authoritative.
      Independent source/caller review and the completed identity persistence/system checks cover that bounded cleanup.
      This entry stays open for the separately scoped whole-session/flash review and supplies no redesign approval.
    desired_outcome: Establish one reviewed session and flash concept with existing shared implementation owners and
      explicit transport differences, preserving server-owned authentication and authorization and native behavior.
    acceptance_criteria:
      - Inventory session creation, reads, mutation, persistence, expiry, invalidation and cookie handling across native
        and pilot documents, API requests, account/guest/profile transitions and OIDC entry/callback/logout.
      - Trace all flash producers and consumers, including anonymous account-required redirects, one-time consumption,
        failed delivery and concurrent requests; distinguish native behavior from proposed corrections.
      - Review initial public reads, stored and legacy sessions, CSRF/context evidence, third-party API reuse and
        session-changing endpoints without treating browser state or claims as authority.
      - Propose shared ownership in the existing modules, retaining controller business logic and pure DBAL; obtain
        direct individual approval for any changed security, persistence, protocol or user-visible behavior first.
      - Verify the accepted design through actual Express middleware and real persistence at the appropriate boundary,
        including response-completion writes, explicit transitions and one-time flash behavior.
      - Reconcile current guidance and decision history without silently replacing earlier choices or using successful
        tests, agent-authored records or this backlog entry as implementation authorization.
    architecture_review_2026_10_27:
      finding: Retained print/PDF output permission checks consume the serialized Session rather than the hydrated actor.
      evidence:
        - app.ts 96 and middleware/frontendDocuments.ts 33 capture current identity through modules/api/session.ts 55-86;
          the hydrated profile.user/profile.guest relations live only on req.apiActor, leaving req.session unchanged.
        - permissionMiddleware.ts 65 and routes/activity.ts 32-35 still authorize with req.session. Event participant
          and invoice-share exports use that permission middleware through routes/event.ts 62-71.
        - permissionEngine.ts 65-69 activates authenticated/guest audiences from profile.user/profile.guest relations.
          UserService.ts 59-74 loads local-login profiles without nested user relations; Profile.user is not eager,
          and userController.ts 217-220 stores that selected raw profile in the Session.
      impact: An account may have its audience grants recognized by interactive/captured-actor reads yet missed by
        retained exports. Owners can still pass; this does not establish universal export failure or privilege escalation.
      desired_outcome: Existing captured-actor admission supplies retained output authorization while preserving
        Session persistence, output-specific redirects, grants, private projections and response contracts.
      independent_review: Platform, domain and root reviewers independently trace login, relation hydration, middleware
        and output callers. This is source-established evidence; no real-database reproduction was performed.
      disposition: Concrete subset of the existing whole-session review, recorded once under ARCH-005. No broad session
        redesign or changed output behavior is implemented or authorized by this evidence.
    approved_retained_output_remedy_2026_10_27:
      authority: The maintainer separately approves R1 of the current twenty-request plan.
      status: complete
      implementation: Existing retained output guards consume captureApiActor, including its hydrated audience relations,
        without assigning those relations to Session or changing saved identity. Output-specific grants and redirects remain.
      verification: Real Express/TypeormStore account and guest sessions admit schedule, participant PDF and invoice-share
        PDF through their audience-only grants, reject after revocation and preserve raw stored identity/relations.
        Normal existing flash initialization is seeded independently so it is not misreported as a hydration write.
        Both tests pass in focused and broad integration runs; the built Event participant PDF workflow also passes.
      limits: This closes only the concrete retained-output finding; the whole-session/flash review above remains open.
    disposition: Separate future review and approved implementation effort. Retain the native anonymous-session notice
      now; do not make broader unification or excluded backend remedies a prerequisite for parity-only migration.
    blocks_documentation_migration: false
