  - id: IMP-132
    status: open
    discovered_on: 2026-10-26
    severity: medium
    owner: application maintainers
    package: general-session-store-remediation
    out_of_scope_for_documentation_migration: true
    title: Third-party session destruction callback does not await its database deletion
    evidence:
      - connect-typeorm remains version 2.0.0 before and after the dependency upgrade. Its installed
        out/app/TypeormStore/TypeormStore.js destroy implementation starts repository.softDelete inside a map callback
        without returning the promise. Promise.all therefore receives undefined entries rather than deletion promises.
      - The outer completion callback can run before those database operations settle, and their later rejected
        promises do not enter the attached catch handler.
      - src/backend/modules/lib/session.ts constructs this unmodified TypeormStore, and src/backend/app.ts installs it in
        express-session. Express's Session.destroy and Store.regenerate delegate completion to the store callback.
    impact: A caller relying on store destruction completion can proceed before deletion settles, and a later SQL
      rejection can escape that callback's error handling.
    evidence_limit: This is a static promise-chain finding. No production, HTTP or database failure was reproduced,
      and the review does not establish that Surveyor's ordinary logout uses Session.destroy or regeneration.
    authorization: The dependency and TypeORM API updates do not authorize a third-party patch, replacement store,
      session lifecycle redesign or workaround for this inherited behavior.
    documentation_contract: Product guidance describes completed session lifecycle operations without exposing this
      implementation defect or promising behavior established only by static review.
    closes_when:
      - A separately authorized change preserves the shared session owner and confirms destruction callback completion
        and errors against delayed and rejected database deletion.
