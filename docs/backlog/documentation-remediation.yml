      supplies an explicit lexical-number path adopted by Finance, Event, Activity and Packing creation fields;
      default/Quick Add numeric normalization retains its established behavior. Independent source review and actual
      built workflows verify Finance spelling, Event 005 through blur and sibling/metadata changes, Activity 003 and
      Packing retained initial input. Matching desktop/mobile Packing comparisons pass after the final browser-restoration
      attribute correction. The current pilot review records their finite execution and original-image evidence;
