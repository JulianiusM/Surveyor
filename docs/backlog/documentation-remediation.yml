architecture_review_2026_10_27:
  authorization: The maintainer requests a complete application architecture, maintainability and duplication review,
    recording reasonably shareable implementations and obtaining independent verification before presentation.
    This request authorizes review and recording, not runtime, schema, policy or design changes.
  package: architecture-review-2026-10-27
  method: Three reviewers inspect domain/backend, platform and frontend/contracts/tooling responsibilities in parallel;
    different reviewers independently recheck retained claims against actual source and callers, and the root reviews
    their evidence and classifications. Neither textual similarity nor a passing checker establishes a finding alone.
  context: Both policies and relevant architecture, development, testing and decision sources were read. Initial
    worktree was clean; no optional profiles were present. Context was refreshed for canonical backlog recording;
    the declared scope change was reconciled without changed governance identities or unresolved policy conflicts.
  coverage:
    - Whole-source engineering inventory covers 412 authored source files and 1490 nontrivial operations, including
      all 12 DBAL services. All domain controllers, shared administration, platform/middleware/routes, feature modules,
      entity/subscriber boundaries, frontend features/common controls, contracts and build/test configuration were reviewed.
    - A separate static relative non-type import scan covers 367 executable TypeScript/Vue files and finds no runtime
      import strongly connected component. Declaration-only, unresolved external and dynamic edges are outside that claim.
    - Contract review parses actual YAML references and schema bodies; normalized source similarity is candidate
      discovery only. Inventory coverage does not certify every line or prove absence of further architectural defects.
  graph_correction_2026_10_27: The earlier blanket no-SCC result above is invalid; its JavaScript walker reused a
    function name and skipped TypeScript import edges. A strict independent parser rerun covers 366 baseline and
    369 current executable TypeScript/Vue files under the scanner's exclusions, with 1846 and 1855 resolved static
    edges respectively. Generated directories and the ORM registry are excluded; tracked permissions and invoice
    locale runtime files remain in the scan. Both contain the
    same four ORM relation SCCs and no non-ORM SCC. This is bounded static-import evidence, not a full runtime DAG
    claim. Parsed contract references confirm removal of all 1244 leaf-to-root occurrences; the approved
    auth/common/events/session composition SCC remains because feature ownership and public shapes are preserved.
  findings: IMP-177 through IMP-191 record 15 independently corroborated residuals. ARCH-005 receives the concrete
    retained-output actor finding under its existing ID. IMP-013, IMP-016 and IMP-079 receive current source corroboration
    here without duplicate defect entries or changing their existing implementation authorization.
  inherited_current_evidence:
    IMP-013: Event removal calls EventService.deleteEvent through eventController.removeEvent, then removes only its
      header. EventInvoicePool.event and EventInvoice.pool cascade rows; deleteInvoiceProof is called only by retention.
      Removing those rows loses retention's proof-path discovery. This establishes the Event-delete orphan risk,
      not an existing pool-delete endpoint or failure of every versioned upload cleanup branch.
    IMP-016: Activity updateSlot still calls ActivityService.updateActivitySlotRoles. Its removal compares submitted
      role IDs with mapping-row IDs at line 828, while additions compare roleId before removal. A retained relationship
      can therefore be selected for deletion without recreation. This is a live inherited identity-domain defect.
    IMP-079: recommendations.applyRecommendations awaits its assignment/history transaction at line 479, then awaits
      history reads and generation at lines 481-482. Later failure can reject a command whose assignments committed.
      Source/caller tracing confirms the existing finality defect; no failure injection was run in this review.
  credited_shared_owners: Matching administrator/default-permission reads and commands actually use entityAdminController
    across Packing, Drivers, Event and Activity. Frontend settings/access/command flows, permission method policy,
    stored-file resolution, UUID identity, Activity requirement arithmetic and core transport have real shared adoption.
  classification_limits: SQL integrity constraints, generated consumers, explicit root OpenAPI export aliases, distinct
    Survey permissions, DBAL materialized aggregates and recorded identity/transaction differences are not violations
    merely because related text exists twice. IMP-186 and IMP-189 are lower-priority factoring/coupling opportunities,
    not proven broken behavior or conflicts with an explicit existing technical decision.
  change_scope: Only this canonical register is edited. Ignored context/check evidence is task evidence, not a new
    documentation destination. Existing approvals and exclusions retain their original bounded scope.
  independent_acceptance: Domain and platform reviewers independently accept the compiled canonical report after
    source review of all 15 new entries and ARCH-005's concrete actor evidence; the root also reviews each claim.
    A stale caller-held scope-review flag was reconciled, and the exact context comparison then reports no reviewRequired.
  current_verification:
    - The all-source development checker passes across 412 files and 1490 nontrivial operations; normal
      npm run check:development and git diff --check also pass. These do not certify semantic completeness.
    - YAML parsing accepts the updated register and confirms all 15 new IDs under the requested package.
    - npm run test:quick completes with 2126 passing tests and two timeouts across 82 files. The asset delivery case
      at tests/integration/frontend-development-runtime.spec.ts 161 times out at 5000 ms; the deterministic generation
      case at tests/unit/frontend-generation.spec.ts 846 times out at 120000 ms. The full run is not recorded as passed.
    - Each failed case subsequently passes unchanged in a separate focused run, with original timeout budgets retained.
      The asset run passes one selected test with five skipped; the generation run passes one with eleven skipped.
      This does not establish the cause of the original timeouts or a clean rerun of the complete suite.
    - The advisory documentation report has no broken links, metadata errors or missing paths/scripts. Its existing
      unregistered source-fingerprint finding remains visible and nonblocking.
  verification_limits: No application build, real-database integration, built-browser/E2E, external OIDC/SMTP journey,
    deployment, retention execution or load benchmark was run. Runtime consequences described here are source-traced
    unless an executed check is explicitly identified; successful unrelated tests do not reproduce each finding.
