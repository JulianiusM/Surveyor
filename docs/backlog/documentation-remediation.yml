severity_definitions:
  critical: Likely to make a core task fail, create an incorrect access/security decision, or block safe operation.
  high: Materially misleading or missing for a common task, contributor workflow, or production responsibility.
  medium: Causes avoidable confusion, incomplete feature use, or maintenance friction but has a usable workaround.
  low: Clarity, structure, metadata, or polish issue with limited immediate behavioral impact.
documentation_contract:
  target: The intended current working implementation, including deliberate feature-specific exceptions, established by
    feature-specific behavior, tests, and explicit decisions.
  intentional_exceptions: Document confirmed feature differences wherever readers need them; do not classify them as
    defects or flatten them into a peer-feature pattern.
  transient_defects: Keep details only in migration-control records; do not copy defects, temporary warnings, or
    workarounds into end-user, operator, maintainer, or AI documentation.
  unresolved_behavior: Keep affected product documentation migration-pending until intent is supported by feature-specific
    evidence or an explicit product decision.
help_markdown_trust:
  status: resolved
  decision: DEC-004
  model: trusted_application_shipped_content
  source_boundary: Only reviewed Markdown packaged under docs/user-guide is rendered as in-app help.
  authoring_rule: Treat guide changes as security-sensitive source changes; permit the metadata comment but no active raw
    HTML or unsafe URI schemes.
  operator_rule: Deploy the guides from the matching release and never overlay them with user-writable, tenant-writable,
    or otherwise untrusted content.
  boundary_change_rule: Reopen DEC-004 and implement a threat model, sanitization, and URI allowlist before enabling
    uploads, database content, runtime editors, remote feeds, plugins, or other untrusted sources.
migration_change_boundary:
  default_scope: documentation-only
  permitted_by_default:
    - documentation files under docs
    - migration records and documentation-only gate configuration
  prohibited_without_explicit_authorization:
    - application runtime source changes
    - runtime behavior tests or fixtures
    - configuration defaults and environment examples
    - package, build, or workflow changes
  exception:
    description: A separately named package may make a targeted in-app help integration change only when explicitly authorized.
  implementation_defect_rule: Confirm that a difference is not intentional before registering a defect; record each
    transient defect once in migration controls, document the corrected working contract in product documentation, and
    do not repair runtime behavior in a documentation package.
behavior_decisions:
  - id: DEC-001
    status: resolved
    title: Survey combination authorization
    decision_record: docs/decisions/DEC-001-SURVEY-COMBINATION-AUTHORIZATION.md
    resolution: Adding a date combination is a collaborative participant action. Every person with an active profile who is
      admitted to the survey voting page may add a combination; no owner, administrator, or generic permission check
      applies.
  - id: DEC-002
    status: resolved_for_documentation
    title: OIDC callback path
    decision_record: docs/decisions/DEC-002-OIDC-CALLBACK.md
    resolution: Documentation uses /users/oidc/callback because that is the mounted public route and the coherent callback
      contract. The isolated default mismatch remains IMP-001.
  - id: DEC-003
    status: resolved
    title: Driver-list participant count semantics
    decision_record: docs/decisions/DEC-003-DRIVER-LIST-PARTICIPANT-COUNT.md
    resolution: The displayed Participants value is the number of distinct assignee profiles across all driver rows.
      Driver-only profiles are excluded, and one profile assigned to multiple rows is counted once.
  - id: DEC-004
    status: resolved
    title: Help Markdown trust model
    decision_record: docs/decisions/DEC-004-HELP-MARKDOWN-TRUST-MODEL.md
    resolution: In-app help Markdown is trusted, application-shipped content from the fixed docs/user-guide directory.
      Runtime sanitization is not the controlling boundary while that source restriction holds.
  - id: DEC-005
    status: resolved
    title: Surveys and the general permission system
    decision_record: docs/decisions/DEC-005-SURVEY-CREATION-PERMISSIONS.md
    resolution: Surveys deliberately do not implement the general permission system used by the other primary entity types.
      The missing matrix and persistence hook are intentional feature boundaries, not defects.
implementation_defects:
  - id: IMP-001
    status: open
    severity: high
    owner: application maintainers
    out_of_scope_for_documentation_migration: true
    title: Built-in OIDC redirect default does not match the mounted callback route
    evidence:
      - src/backend/app.ts mounts the users router at /users
      - src/backend/routes/users.ts registers /oidc/callback inside that router
      - src/backend/modules/settings.ts defaults to a URL ending in /user/oidc/callback
    impact: OIDC login can fail when the mismatched default is used unchanged.
    documentation_contract: Product documentation uses the corrected /users/oidc/callback contract and does not mention this transient defect.
    closes_when:
      - an explicitly authorized application change aligns the default with the mounted route or deliberately changes
        the route
      - tests and examples cover the selected behavior
      - D04 and D12 are re-verified if their documented contract changes
  - id: IMP-003
    status: open
    severity: high
    owner: application maintainers
    out_of_scope_for_documentation_migration: true
    title: Password policy is not enforced consistently across registration and reset boundaries
    evidence:
      - src/public/js/core/password-validation.ts defines the intended minimum of eight characters, one letter, and one
        digit
      - src/backend/views/users/register.pug loads the password validator, but src/backend/controller/userController.ts checks only
        presence and equality
      - src/backend/views/users/reset-password.pug declares only an eight-character HTML minimum and the reset controller checks
        only equality
    impact: A client bypass or the reset path can accept a password that does not meet the policy presented during
      registration.
    documentation_contract: D01 states one coherent policy for registration and reset and does not expose the enforcement inconsistency.
    closes_when:
      - one server-side validator enforces the complete policy for registration and password reset
      - registration and reset UI use the same validator and wording
      - automated tests cover every rule and both entry paths
  - id: IMP-004
    status: open
    severity: high
    owner: application maintainers
    out_of_scope_for_documentation_migration: true
    title: Guest recovery is not reachable through the login page in an organization-sign-in-only deployment
    evidence:
      - src/backend/routes/users.ts redirects GET /users/login to OIDC before rendering the page when local login is disabled
      - the guest-recovery form exists only in src/backend/views/users/login.pug
      - GET /guest/recovery redirects back to /users/login
    impact: A guest with an email address can be unable to request their private links when the deployment disables local
      login.
    documentation_contract: D01 documents guest email recovery as an authentication-mode-independent capability and does not
      repeat the routing defect.
    closes_when:
      - guest recovery remains directly reachable when local login is disabled
      - invitation, login, and recovery routes preserve the intended return path
      - automated route tests cover local-only, mixed, and organization-sign-in-only deployments
  - id: IMP-005
    status: open
    severity: medium
    owner: application maintainers
    out_of_scope_for_documentation_migration: true
    title: Guest profile settings expose a profile-deactivation action that rejects guest sessions
    evidence:
      - src/backend/views/users/profile/view.pug renders Delete profile without checking whether the active profile belongs to a
        full account
      - src/backend/routes/users.ts protects the profile-deletion routes with isAuthenticated rather than isLoggedIn
    impact: Guests see an action that redirects them away instead of performing the supported guest-account closure flow.
    documentation_contract: D01 directs guests to Delete account and assumes the inapplicable profile-deactivation action is not shown.
    closes_when:
      - the profile page hides or replaces Delete profile for guests
      - the guest account-closure path is covered by a rendered-view or route test
  - id: IMP-006
    status: open
    severity: high
    owner: application maintainers
    out_of_scope_for_documentation_migration: true
    out_of_scope_for_frontend_migration: true
    title: Deactivating the final full-account profile can complete deletion and then fail while selecting another profile
    evidence:
      - src/backend/controller/userController.ts deletes the previous user when profile deactivation leaves no profiles
      - the profile-deletion route then unconditionally calls changeActiveProfile
      - changeActiveProfile throws when the deleted account has no remaining profile
    impact: The destructive operation can succeed while the user receives an error instead of a clean account-closure result.
    documentation_contract: D01 describes final-profile deactivation as a clean permanent account closure and does not
      expose the post-deletion failure.
    disposition: The maintainer's explicit 2026-10-14 parity-only decision excludes R3 deactivation finality repair
      and existing backlog remedies from frontend migration. This defect remains open for a separate effort; its
      remedy or another approval request is not a prerequisite for migrating the existing frontend journey.
    closes_when:
      - final-profile deactivation terminates or clears the session without attempting another profile selection
      - multi-profile and final-profile outcomes have route-level tests
  - id: IMP-007
    status: open
    severity: high
    owner: application maintainers
    out_of_scope_for_documentation_migration: true
    title: Event registration-link creation ignores the submitted Uses value
    evidence:
      - src/backend/views/modules/module_registration_links.pug exposes a Uses field with values greater than one
      - src/public/js/modules/reg-links.ts sends maxUses to the event links API
      - src/backend/modules/database/services/EventService.ts stores and enforces maxUses
      - "src/backend/controller/eventController.ts creates every link with maxUses: 1"
    impact: A link configured for multiple late registrations is created as single-use.
    documentation_contract: D05 documents the coherent working contract in which Uses controls the allowed number of
      successful late registrations and does not mention the controller mismatch.
    closes_when:
      - the controller validates and forwards the requested positive whole-number maxUses value
      - route or integration tests cover single-use and multi-use links, exhaustion, expiry, and revocation
      - D05 is re-verified if the selected user-visible contract changes
  - id: IMP-008
    status: open
    severity: critical
    owner: application maintainers
    out_of_scope_for_documentation_migration: true
    title: Event participant details are embedded in the page without an Access Participants rendering guard
    evidence:
      - src/backend/controller/eventController.ts fetches the complete participant rows for every admitted event-page request
      - src/backend/views/event/event-view.pug always serializes data.participants into participantsData
      - the visible Participants component and API are separately guarded by ACCESS_PARTICIPANTS
    impact: A profile without participant-list permission can receive names, available email addresses, dates, and dietary
      data in page source even when the visible participant section is hidden.
    documentation_contract: D05 states that participant details are available only with Access Participants and does not
      disclose or normalize the transient data-exposure defect.
    closes_when:
      - participant rows are not fetched or serialized unless the effective permissions include ACCESS_PARTICIPANTS or
        another explicitly reviewed need applies
      - rendered-view tests assert the absence of sensitive participant JSON for unauthorized profiles
      - the participant API and PDF permission tests remain aligned
  - id: IMP-009
    status: resolved
    title: Event post-deadline setting fields use inconsistent names in permission enforcement
    resolved_on: 2026-09-16
    resolution: Canonical field policy now drives modal visibility and server authorization; atomic event patches preserve
      omission and explicit false. Integration cases and browser requests verify all three unauthorized policy switches
      are rejected and requirements-only saves work.
  - id: IMP-010
    status: open
    severity: high
    owner: application maintainers
    out_of_scope_for_documentation_migration: true
    title: A late-registration token is not preserved through first-time guest onboarding
    evidence:
      - src/public/js/modules/reg-links.ts creates event URLs with the regToken query parameter
      - src/backend/middleware/guestFlowFactory.ts redirects an anonymous event request to /event/:id/guest without carrying the
        query parameter
      - the guest registration POST redirects to the event page without restoring regToken
    impact: A new guest following a valid deadline-bypass link can lose the token before submitting the registration.
    documentation_contract: D05 documents late-registration links as usable through the normal account or guest entry flow
      and does not expose the redirect defect.
    closes_when:
      - the guest onboarding flow preserves and validates the event registration token across GET, POST, and final
        redirect
      - tests cover anonymous guest, existing guest, and full-account use after the binding deadline
      - invalid, expired, revoked, and consumed tokens remain rejected
  - id: IMP-011
    status: open
    severity: high
    owner: application maintainers
    out_of_scope_for_documentation_migration: true
    title: Delegated invoice organizers can be rejected by the proof route's outer participant guard
    second_pass_review:
      date: 2026-10-04
      finding: Current proof routing no longer has the outer participant guard; current controller policy accepts an effective
        manager or the attributed participant. The original description is historical evidence, not an intentional
        exception to preserve.
      source_evidence: src/backend/routes/api/eventInvoices.ts; src/backend/controller/eventPoolController.ts; src/backend/modules/invoice/proofs.ts;
        tests/integration/organizer-invoices.spec.ts
      remaining_verification: Retain open status until the full route actor matrix in closes_when is checked; this source
        review did not execute tests.
    evidence:
      - src/backend/routes/api/eventInvoices.ts protects the proof route first with requireEventParticipantAPI
      - requireEventParticipantAPI admits only the event owner or a registered event participant
      - src/backend/controller/eventPoolController.ts then separately allows MANAGE_ASSIGNMENTS or the invoice submitter
    impact: A non-owner organizer with Access Admin and Manage Assignments can administer invoices but still be blocked from
      opening their proof unless the organizer is also registered for the event.
    documentation_contract: D06 documents the coherent working contract in which an entrusted invoice-pool organizer can
      inspect every invoice and proof and does not expose the guard-order mismatch.
    closes_when:
      - proof authorization admits the submitter or a profile with the required invoice-administration permission
        without first requiring event registration
      - route-level tests cover owner, delegated organizer, submitter, unrelated participant, and unrelated profile
      - D06 is re-verified if the selected access contract changes
  - id: IMP-012
    status: open
    severity: high
    owner: application maintainers
    out_of_scope_for_documentation_migration: true
    title: Invoice submission and participant pool listing disagree about default-pool assignment
    second_pass_review:
      date: 2026-10-04
      finding: Current controller, locked state validation and participant-pool query use assignAll or explicit assignment for
        eligibility; default enrollment is separate. The original mismatch appears superseded by current code.
      source_evidence: src/backend/controller/eventPoolController.ts; src/backend/modules/invoice/state.ts;
        src/backend/modules/database/services/EventInvoiceService.ts
      remaining_verification: The complete current-participant, future-participant, default-enrollment and listing matrix was
        not verified in execution; retain open status pending reconciliation.
    evidence:
      - src/backend/modules/database/services/EventInvoiceService.ts lists an open participant pool only when assignAll is true
        or an explicit assignment exists
      - src/backend/controller/eventPoolController.ts also treats pool.isDefault as sufficient for invoice submission
      - default-pool registration is otherwise materialized by registerForDefaultPools when a new event registration is
        created
    impact: A crafted submission can be accepted for an existing registration that is not shown as assigned to the pool.
    documentation_contract: D06 states that a participant can submit only to an open pool that applies to all registrations
      or explicitly contains their registration.
    closes_when:
      - listing, form choices, and submission authorization use one assignment predicate
      - tests cover current registrations, future registrations added through a default pool, assign-all pools, explicit
        assignment, and unassigned rejection
  - id: IMP-013
    status: closed
    closed_on: 2026-10-27
    closed_in: architecture-implementation-2026-10-27
    resolution_2026_10_27: >-
      Approved R4/R5: durable prewrite ownership, transaction attachment and postcommit retry cover failures/cascades; explicit offline manifest reconciliation handles historical untracked files. No site action was executed.
      Source/adoption review and executed checks are recorded under architecture_implementation_2026_10_27;
      the original finding and prior authorization/disposition text below remain historical.
    severity: high
    owner: application maintainers
    out_of_scope_for_documentation_migration: true
    title: Invoice proof cleanup does not cover every failed-submission and event-deletion path
    evidence:
      - multer writes the proof before controller validation and only the unsupported-MIME branch explicitly unlinks it
      - persistence or later validation failures can occur after upload without a common cleanup path
      - src/backend/modules/database/services/EventService.ts deletes an event through database cascade but does not remove its
        proof files
      - retention cleanup can remove a proof only while its invoice row still exists
      - P7's versioned submission cleans up rejected multipart decoding before entering the unchanged business owner;
        failures after entering that owner inherit its existing cleanup limit and remain outside parity migration
    impact: Sensitive proof files can remain on disk without a reachable invoice record or normal retention path.
    documentation_contract: D06 and D04 document a coherent lifecycle in which failed submissions and entity deletion do not
      leave inaccessible proof files behind, and do not normalize the cleanup defect.
    closes_when:
      - every upload failure after file creation removes the file
      - event or pool deletion removes associated proof files safely
      - integration tests cover validation failure, persistence failure, deletion, and retention without deleting files
        outside the configured invoice directory
  - id: IMP-014
    status: open
    severity: high
    owner: application maintainers
    out_of_scope_for_documentation_migration: true
    title: Participant takeover updates do not independently enforce the pool's open state
    second_pass_review:
      date: 2026-10-04
      finding: Current locked takeover operation rejects participant changes unless the pool is OPEN, including
        ORGANIZER_ONLY. Existing integration assertions include organizer-only and closed rejection.
      source_evidence: src/backend/modules/invoice/takeovers.ts; tests/integration/invoice-workflows.spec.ts
      remaining_verification: Source assertions were inspected but not run; retain open status until the stated route-level
        acceptance matrix is reconciled with current evidence.
    evidence:
      - src/backend/views/modules/module_invoice_pool.pug exposes participant takeover controls only for open pools
      - src/backend/controller/eventPoolController.ts updateTakeovers validates assignment and relationship rules but not
        pool.status
      - the participant takeover route does not add a separate closed-pool guard
    impact: A crafted request can alter takeover instructions for a closed pool, affecting a later recalculation despite the
      UI presenting the configuration as frozen.
    documentation_contract: D06 states that participant takeover changes are available only while the pool is open.
    closes_when:
      - participant takeover mutation rejects closed pools server-side
      - organizer correction behavior for a closed pool remains explicit and is applied only through the reviewed
        recalculation path
      - route-level tests cover open and closed participant requests plus authorized organizer correction
  - id: IMP-015
    status: open
    severity: medium
    owner: application maintainers
    out_of_scope_for_documentation_migration: true
    title: Clearing the final explicit pool assignment does not remove stale takeovers and surcharges
    second_pass_review:
      date: 2026-10-04
      finding: Current assignment operation retains an empty valid-ID set and prunes out-of-scope takeovers and surcharges.
        The previous empty-set bypass is not the current implementation.
      source_evidence: src/backend/modules/invoice/poolOperations.ts; tests/integration/invoice-workflows.spec.ts
      remaining_verification: Reviewed empty-allocation tests do not explicitly seed and assert removal of stale takeovers and
        adjustments; retain open status for that exact acceptance check.
    evidence:
      - src/backend/modules/database/services/EventInvoiceService.ts updateAssignments replaces explicit assignment rows with
        the submitted registration IDs
      - when the submitted registration list is empty, the cleanup variable validIds falls back to every event
        registration instead of the empty effective assignment scope
      - takeover and surcharge cleanup therefore retains rows for registrations that are no longer assigned when the
        final assignment is cleared
    impact: Hidden takeover and surcharge records can survive an empty pool assignment and can become effective again after
      later reassignment or recalculation.
    documentation_contract: D06 states the coherent working contract in which removing a participant also removes adjustment
      records that are incompatible with the remaining assignment scope.
    closes_when:
      - takeover and surcharge cleanup derives from the effective assigned registration IDs, including an empty set
      - integration tests clear the final explicit assignment and verify that stale takeovers and surcharges are removed
      - tests also preserve adjustments for registrations that remain assigned
  - id: IMP-016
    status: closed
    closed_on: 2026-10-27
    closed_in: architecture-implementation-2026-10-27
    resolution_2026_10_27: >-
      Approved R2: both diff halves use role identity; retained mappings/quotas and assignment graphs survive. Frontend and backend tests clear every configured role, including role-only and repeated empty saves.
      Source/adoption review and executed checks are recorded under architecture_implementation_2026_10_27;
      the original finding and prior authorization/disposition text below remain historical.
    severity: high
    owner: application maintainers
    out_of_scope_for_documentation_migration: true
    title: Editing a slot compares activity-slot-role mapping IDs with role IDs when deciding what to remove
    evidence:
      - src/backend/modules/database/services/ActivityService.ts updateActivitySlotRoles loads ActivitySlotRole rows and their
        roles
      - the deletion filter checks roles.includes(r.id), where r.id is the mapping-row ID rather than r.roleId
      - the creation filter correctly compares the submitted values with r.roleId, so the two halves use different
        identifiers
    impact: Saving Roles for this slot can remove a role that should remain or fail to represent the selected role set
      reliably.
    documentation_contract: D07 documents the intended working behavior in which selected role chips are added or removed
      and Save persists the resulting role set.
    closes_when:
      - deletion compares submitted role IDs with the related role ID rather than the mapping-row ID
      - integration tests retain, remove, and add several role combinations while preserving assignments according to
        the selected contract
      - D07 is reverified only if the visible role-editing contract changes
  - id: IMP-017
    status: open
    severity: medium
    owner: application maintainers
    out_of_scope_for_documentation_migration: true
    title: Initial activity-slot controls do not provide complete visible or programmatic field labels
    evidence:
      - src/public/js/activity-create.ts dynamically creates Title and Description fields with placeholders only
      - Start time and End time are time inputs whose placeholders are not a reliable visible or accessible label
      - the numeric Max participants input has neither a label nor a placeholder
    impact: A novice or assistive-technology user can have difficulty identifying the initial slot fields before creating
      the plan.
    documentation_contract: D07 names the intended fields Title, Description, Start time, End time, and Max participants
      without documenting the labeling defect.
    migration_disposition: The R4/R6 frontend review on 2026-10-20 corrects the Vue initial-slot fields through shared
      FormField visible labels associated with the existing text, time and number controls, plus a localized Remove
      accessible name. Field models and constraints remain unchanged. The native comparator is untouched, so this
      defect remains open; current mounted and built-browser verification is recorded in the pilot review.
    closes_when:
      - every dynamically generated initial-slot control has an associated visible label and accessible name
      - creation UI tests verify the labels for keyboard and assistive-technology use
      - duplicate/prefilled creation retains the same field contract
  - id: IMP-018
    status: open
    severity: critical
    owner: application maintainers
    out_of_scope_for_documentation_migration: true
    title: The activity Participants tab and participant rows are not guarded by Access Participants
    evidence:
      - src/backend/controller/activityController.ts builds participantList for every admitted activity-plan page request
      - src/backend/views/activity/activity-view.pug shows the Participants tab whenever participantList is nonempty without
        checking ACCESS_PARTICIPANTS
      - the Schedule view separately checks ACCESS_PARTICIPANTS before rendering assignee names
    impact: A profile that may view the plan but lacks participant-list permission can receive names, attendance, assignment
      counts, requirements, and roles through the Participants tab.
    documentation_contract: D07 states that Participants appears only when participant data exists and the viewer has Access
      Participants, and does not normalize the transient privacy defect.
    closes_when:
      - participant rows are not fetched, serialized, or rendered without ACCESS_PARTICIPANTS or an explicitly reviewed
        equivalent authorization
      - rendered-view tests prove that unauthorized profiles receive neither the tab nor participant data
      - authorized participant review and schedule-name rendering remain aligned
  - id: IMP-019
    status: closed
    closed_on: 2026-10-25
    resolution: P11 canonical Vue cutover retires the defective native voting template. Built desktop/mobile Survey cases verify escaped single-line and multiline saved descriptions; current rendering uses the approved R1 behavior.
    closure_evidence: P11 canonical route/native consumer retirement, independently reviewed source and recorded visual
      comparison; actual focused built test results retained in artifacts/p11-e2e-retry-10.11.log and the final P11 run artifacts.
    severity: high
    owner: application maintainers
    out_of_scope_for_documentation_migration: true
    title: Survey descriptions are not rendered correctly on the voting page
    evidence:
      - src/backend/views/surveyor/survey-vote.pug creates a lines array but interpolates line and i without iterating over that
        array
      - the survey creation flow persists the description and the view controller returns the survey entity
      - original native E2E detail assertions did not require the saved description text to be visible
    impact: Participant instructions, date context, and an organizer-supplied response deadline can be absent from the
      voting page even though they were saved.
    documentation_contract: D09 describes the coherent working contract in which the saved description appears below the
      survey title and does not expose the template defect.
    migration_disposition:
      decision: Maintainer approved Vue-only description rendering as R1 on 2026-10-18; minor backend adapter changes
        are permitted if needed, without altering native frontend or shared business behavior.
      frontend_status: Canonical Vue rendering verified at P11 cutover; defective native consumer retired.
      closure_boundary: Keep this record open until native-to-Vue cutover has happened and the corrected frontend
        rendering has been verified. Vue implementation alone does not resolve the retained native defect.
    closes_when:
      - the voting template renders every saved description line in order
      - rendered-view or E2E coverage checks both single-line and multiline descriptions
      - D09 is re-verified only if the visible description contract changes
  - id: IMP-020
    status: closed
    closed_on: 2026-10-25
    resolution: P11 canonical Vue cutover retires the defective native duplication form. Retained Survey creation/duplication coverage verifies saved description and recurrence values under the approved R2 behavior; responses and header images remain excluded.
    closure_evidence: P11 canonical route/native consumer retirement, independently reviewed source and recorded visual
      comparison; actual focused built test results retained in artifacts/p11-e2e-retry-10.11.log and the final P11 run artifacts.
    severity: medium
    owner: application maintainers
    out_of_scope_for_documentation_migration: true
    title: Survey duplication does not reliably prefill the description and week-of-month values
    evidence:
      - src/backend/views/surveyor/survey-create.pug places the description in a textarea value attribute rather than its text
        content
      - src/public/js/survey-create.ts reads nth_week while SurveyCombination exposes nthWeek
      - the generic duplicate route supplies the original entity and SurveyCombination objects to the creation template
    impact: A duplicated survey can open with an empty description or incorrect ordinal selections, increasing the risk of
      publishing an unintended copy.
    documentation_contract: D09 states that Duplicate opens a prefilled title, description, and combination form while
      responses and the header image are not copied.
    migration_disposition:
      decision: Maintainer approved Vue-only duplicate prefill as R2 on 2026-10-18 under the same frontend-only/minor
        adapter scope as R1; native frontend and shared persistence remain unchanged.
      frontend_status: Canonical Vue prefill verified at P11 cutover; defective native consumer retired.
      closure_boundary: Keep this record open until native-to-Vue cutover has happened and complete prefill has been
        verified. Vue implementation alone does not resolve the retained native defect.
    closes_when:
      - duplicate and validation rerenders populate the textarea through its text content
      - duplicate combination rows read the canonical nthWeek property
      - browser or rendered-view tests verify title, description, every weekday, every ordinal, and the absence of
        copied responses and image data
  - id: IMP-021
    status: open
    severity: medium
    owner: application maintainers
    out_of_scope_for_documentation_migration: true
    title: Survey routing retains nonfunctional event-scoping plumbing
    evidence:
      - src/backend/routes/survey.ts configures the generic guest-flow router with addToEvent true
      - src/backend/middleware/guestFlowFactory.ts accepts eventId and applies event-creation authorization for that mode
      - Survey has no event relation and surveyController.createEntity does not persist the injected event ID
      - the event dashboard survey section is commented out while an E2E case calls the query-driven flow event-scoped
        without checking a relationship
    impact: Internal routes and tests can imply that surveys become event-linked even though no relationship is stored or
      exposed in the product.
    documentation_contract: D05 and D09 treat surveys as standalone resources that are shared separately and do not appear
      in event-linked resource sections.
    closes_when:
      - survey creation no longer accepts or authorizes an unused eventId path
      - event-dashboard and E2E code use the same standalone survey contract
      - a future event-link feature, if deliberately introduced, receives its own product decision, persistence model,
        access rules, tests, and documentation
  - id: IMP-022
    status: open
    severity: high
    owner: application maintainers
    out_of_scope_for_documentation_migration: true
    title: Packing-item title and capacity controls use permission checks that differ between rendering and mutation
    migration_disposition: Explicit 2026-10-12 maintainer decision requires v1 to preserve native grants through
      controller-owned method declarations. This native permission defect stays open for a separately reviewed
      correction; migration must not silently replace EDIT_META with the more specific grants or infer additional parent
      inheritance.
    evidence:
      - src/backend/views/packing/packing-view.pug renders title editing for EDIT_TITLE or ITEM_EDIT and capacity editing for
        EDIT_CAPACITY or ITEM_EDIT
      - src/backend/routes/api/packing.ts protects the shared item-attribute mutation route with EDIT_META or ITEM_EDIT
      - src/public/js/packing.ts sends both title and maxAssignees changes through that shared route
    impact: A profile granted only the field-specific title or capacity permission can see an edit control but have the save
      rejected.
    documentation_contract: D10 documents the coherent working contract in which the field-specific edit grants shown by the
      page authorize the corresponding save operation.
    closes_when:
      - the item-attribute mutation checks the submitted field against the matching field-specific permission or uses
        separate field routes
      - negative and positive route tests cover EDIT_TITLE, EDIT_CAPACITY, EDIT_META, and ITEM_EDIT independently
      - the visible controls and server-side authorization use the same contract
  - id: IMP-023
    status: open
    severity: medium
    owner: application maintainers
    out_of_scope_for_documentation_migration: true
    title: Native Packing-item creation does not persist the intended item order
    evidence:
      - Original discovery at native comparator 2dfa2573c64178f54684cc4877b5a945f66e24c8 found
        src/backend/controller/packingController.ts supplying position for initial and quick-added items while
        src/backend/modules/database/services/PackingService.ts persisted pos in createPackingListTx and addPackingItems.
      - The current shared createEntity and addPackingItem controller operations preserve that native ordering
        behavior by omitting pos. Native Quick Add now reaches PackingService.createPackingItem; the unset position
        retains its database default instead of persisting the intended next sequence.
      - Versioned creation explicitly supplies pos through those same shared owners. This scoped migration behavior
        does not repair or close the native defect; its runtime remediation remains separately authorized work.
      - subsequent reads and reorder operations use the pos column
    impact: Initial and newly added row ordering can be stored without the intended sequence until an explicit reorder occurs.
    documentation_contract: D10 states the coherent working contract in which creation order and later drag reordering are
      stored for the shared list.
    closes_when:
      - controllers and persistence use one canonical item-order property
      - integration tests verify initial multi-row order, quick-add order, duplicate order, and drag reorder persistence
      - D10 is re-verified only if the visible ordering contract changes
  - id: IMP-024
    status: open
    severity: high
    owner: application maintainers
    out_of_scope_for_documentation_migration: true
    title: Everyone items can retain or receive hidden individual assignments
    evidence:
      - src/backend/modules/database/services/PackingService.ts togglePackingItemRequiredByAll changes only the flag and does
        not reconcile existing PackingAssignment rows
      - the assignment service does not reject an item whose requiredByAll flag is true
      - src/backend/views/packing/packing-view.pug hides individual assignee names and Take controls for Everyone rows
      - participant overview lookup still considers any retained PackingAssignment row
    impact: A row presented as a group-wide requirement can retain invisible individual responsibility, affect Your
