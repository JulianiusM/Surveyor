  - Invoice-pool help warns that recalculation replaces all shares and resets Paid or Outstanding markers.
  - Activity-plan help distinguishes whole-slot Join/Leave from named-role Take/Leave.
  - Activity-plan help uses Schedule, Participants, Rules & auto-assign, and Settings and contains no Requirements tab or skills field.
  - Activity-plan help explains event-registration gating, Full — join anyway, Assignment warnings, shared text fields, role management, and print-friendly schedule export.
  - Activity-plan advanced help explains Required and Free modes, complete stay-duration rows, precedence, live coverage states, and that aggregate coverage is not a timetable-feasibility proof.
  - Activity-plan advanced help documents Auto-generate, asynchronous stale jobs, Pending/Approved/Rejected review, rejection memory, manual assignment/reassignment/swap/unassignment, Save changes, revalidation, skipped operations, and post-deadline regeneration.
