  - Packing help distinguishes Everyone during creation from All on an existing row and explains that these rows do not use individual Take assignments.
  - 'Packing help defines Max # as the number of people, defines the four summary counters, and documents event-linked admission and assignee-name visibility.'
  - Every visible tab/button label used by a task exists in rendered Pug output.
  - Help pages contain no missing internal document or application-route targets.
