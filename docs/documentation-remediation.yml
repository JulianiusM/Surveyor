severity_definitions:
  critical: Likely to make a core task fail, create an incorrect access/security decision, or block safe operation.
  high: Materially misleading or missing for a common task, contributor workflow, or production responsibility.
  medium: Causes avoidable confusion, incomplete feature use, or maintenance friction but has a usable workaround.
  low: Clarity, structure, metadata, or polish issue with limited immediate behavioral impact.
source_of_truth_order:
- rank: 1
  source: Feature-specific executable behavior and tests
  examples:
  - routes
  - controllers
  - services
  - entities
  - views
  - browser code
  - package scripts
  - workflows
- rank: 2
  source: Explicit maintainer or product decisions
  examples:
  - intended feature scope
  - deliberate exceptions
  - classification of transient defects
  rule: A peer-feature pattern does not override a confirmed feature-specific exception.
- rank: 3
  source: Generated references
  examples:
  - permission tables from PERM
  - setting tables from settings.ts
  - route/script/test inventories
- rank: 4
  source: Canonical maintained documentation
  examples:
  - operator runbook
  - testing guide
  - architecture
  - user task guides
- rank: 5
  source: AI instruction summaries
  examples:
  - AGENTS.md
  - .github/copilot-instructions.md
  - .github/copilot/*.md
  rule: AI instructions must link to canonical sources and must not duplicate volatile facts unless mechanically validated.
documentation_contract:
  target: The intended current working implementation, including deliberate feature-specific exceptions, established by feature-specific behavior, tests, and explicit decisions.
  intentional_exceptions: Document confirmed feature differences wherever readers need them; do not classify them as defects or flatten them into a peer-feature pattern.
  transient_defects: Keep details only in migration-control records; do not copy defects, temporary warnings, or workarounds into end-user, operator, maintainer, or AI documentation.
  unresolved_behavior: Keep affected product documentation migration-pending until intent is supported by feature-specific evidence or an explicit product decision.
help_markdown_trust:
  status: resolved
  decision: DEC-004
  model: trusted_application_shipped_content
  source_boundary: Only reviewed Markdown packaged under docs/user-guide is rendered as in-app help.
  authoring_rule: Treat guide changes as security-sensitive source changes; permit the metadata comment but no active raw HTML or unsafe URI schemes.
  operator_rule: Deploy the guides from the matching release and never overlay them with user-writable, tenant-writable, or otherwise untrusted content.
  boundary_change_rule: Reopen DEC-004 and implement a threat model, sanitization, and URI allowlist before enabling uploads, database content, runtime editors, remote feeds, plugins, or other untrusted sources.
migration_change_boundary:
  default_scope: documentation-only
  permitted_by_default:
  - documentation files under docs
  - migration records and documentation-only gate configuration
  prohibited_without_explicit_authorization:
  - application runtime source changes
  - runtime behavior tests or fixtures
  - configuration defaults and environment examples
  - package, build, or workflow changes
  exception:
    description: A separately named package may make a targeted in-app help integration change only when explicitly authorized.
  implementation_defect_rule: Confirm that a difference is not intentional before registering a defect; record each transient defect once in migration controls, document the corrected working contract in product documentation, and do not repair runtime behavior in a documentation package.
behavior_decisions:
- id: DEC-001
  status: resolved
  title: Survey combination authorization
  question: May every survey participant add a new date combination, or should this require an owner/admin permission?
  anchors:
  - src/views/surveyor/survey-vote.pug:100-127
  - src/routes/survey.ts:47-78
  - src/controller/surveyController.ts:127-130
  - src/middleware/guestFlowFactory.ts:168-303
  - src/modules/database/services/SurveyService.ts:69-78
  decision_record: docs/decisions/DEC-001-SURVEY-COMBINATION-AUTHORIZATION.md
  resolution: Adding a date combination is a collaborative participant action. Every person with an active profile who is admitted to the survey voting page may add a combination; no owner, administrator, or generic permission check applies.
  documentation_effect:
  - D09 states that owners, signed-in participants, and registered guests may add combinations after entering the survey.
  - D09 distinguishes collaborative combination creation from owner-only survey lifecycle actions.
  - D14 adds semantic assertions for the participant-facing rule and the visible Add new combination label.
  - D03 does not map this action to the general permission system.
  former_blocks:
  - D09
  - D14
  resolution_evidence:
  - the add-combination form is rendered unconditionally on the survey voting page
  - the POST route has no owner, administrator, or generic permission guard
  - the route passes through the same survey access safe zone used for viewing and voting
  - the controller validates the selected combination but does not apply an additional role check
  - the service stores the combination without consulting a permission record
  - no application source, test, configuration, workflow, or in-app user-guide change
- id: DEC-002
  status: resolved_for_documentation
  title: OIDC callback path
  question: Which callback path is the documented deployment contract?
  anchors:
  - src/app.ts:112
  - src/routes/users.ts:120-124
  - src/modules/settings.ts:93
  - src/modules/oidc.ts:44-92
  decision_record: docs/decisions/DEC-002-OIDC-CALLBACK.md
  resolution: Documentation uses /users/oidc/callback because that is the mounted public route and the coherent callback contract. The isolated default mismatch remains IMP-001.
  documentation_effect:
  - D04 uses a complete callback URL ending in /users/oidc/callback.
  - D12 describes the same route composition and callback contract.
  - Product documentation does not mention IMP-001 or a temporary workaround.
  former_blocks:
  - D04
  - D12
  resolution_evidence:
  - route composition verified from src/app.ts and src/routes/users.ts
  - redirect handling verified from src/modules/oidc.ts
  - transient mismatch isolated in the implementation-defect register
  - no application source, test, example, or configuration change
- id: DEC-003
  status: resolved
  title: Driver-list participant count semantics
  question: Should the displayed count include drivers plus passengers, or assigned passengers only?
  anchors:
  - src/controller/driversController.ts:77-112
  - src/modules/database/services/DriverService.ts:139-163
  - src/modules/database/services/DriverService.ts:215-294
  - src/modules/database/entities/drivers/DriversAssignment.ts
  - src/modules/database/entities/drivers/DriversItem.ts
  - src/views/drivers/drivers-view.pug:45-74
  - tests/integration/controller-smoke-workflows.spec.ts:125-134
  - docs/user-guide/DRIVERS_LISTS.md:159-176
  decision_record: docs/decisions/DEC-003-DRIVER-LIST-PARTICIPANT-COUNT.md
  resolution: The displayed Participants value is the number of distinct assignee profiles across all driver rows. Driver-only profiles are excluded, and one profile assigned to multiple rows is counted once.
  documentation_effect:
  - D11 defines Participants as unique people assigned to at least one driver row, not drivers plus passengers.
  - D11 distinguishes the unique-assignee count from driver-row count, raw assignments, and capacity.
  - D11 includes examples covering no assignees, repeated assignments, and multiple distinct assignees.
  - D14 protects the stable wording with semantic help assertions after D11 is complete.
  former_blocks:
  - D11
  resolution_evidence:
  - the controller inserts assignee identities into a Set and publishes the Set size
  - profile identifiers deduplicate one person assigned to multiple rows
  - driver identity is loaded separately from item ownership and is not added to the participant Set
  - the view displays Participants separately from Drivers and Assigned / Max
  - the existing smoke test confirms that one assignment produces a participant count of one
  - no application source, test, configuration, workflow, or in-app user-guide change
- id: DEC-004
  status: resolved
  title: Help Markdown trust model
  question: Is repository Markdown trusted-only, or must rendered HTML be sanitized?
  anchors:
  - src/controller/helpController.ts:35-164
  - src/routes/help.ts:20-35
  - src/views/help.pug:31-35
  - .github/workflows/release.yml:122-150
  - tests/integration/controller-smoke-workflows.spec.ts:207-220
  - tests/e2e/public-availability.spec.ts:17-25
  decision_record: docs/decisions/DEC-004-HELP-MARKDOWN-TRUST-MODEL.md
  resolution: In-app help Markdown is trusted, application-shipped content from the fixed docs/user-guide directory. Runtime sanitization is not the controlling boundary while that source restriction holds.
  documentation_effect:
  - D04 treats docs/user-guide as release-managed application content and prohibits user-writable or tenant-writable overlays.
  - D12 documents the fixed local source, Markdown conversion, link rewriting, HTML insertion, and trusted-content assumption.
  - D13 treats in-app guide changes as security-sensitive reviewed content and rejects unsupervised untrusted imports.
  - D14 aligns code comments and tests, rejects active raw HTML and unsafe URI schemes in shipped guides, and preserves the fixed source boundary.
  former_blocks:
  - D14
  resolution_evidence:
  - the controller resolves a fixed docs/user-guide path and reads only files from that directory
  - the help router exposes read-only GET routes and no authoring, upload, database, or remote-source path
  - converted content is inserted as HTML, making repository and release governance the active trust boundary
  - the release workflow packages docs with the built application
  - contributor and operator rules are recorded in the documentation policy
  - no application source, test, dependency, workflow, or in-app user-guide change
- id: DEC-005
  status: resolved
  title: Surveys and the general permission system
  question: Does the general Group Permissions system apply to surveys?
  anchors:
  - src/views/surveyor/survey-create.pug
  - src/controller/surveyController.ts
  - src/routes/survey.ts
  - src/middleware/guestFlowFactory.ts:126-166
  - src/modules/lib/permissions.ts:47-83
  decision_record: docs/decisions/DEC-005-SURVEY-CREATION-PERMISSIONS.md
  resolution: Surveys deliberately do not implement the general permission system used by the other primary entity types. The missing matrix and persistence hook are intentional feature boundaries, not defects.
  documentation_effect:
  - D03 explicitly excludes surveys from the general permission model and removes survey permission examples.
  - D09 omits Group Permissions from survey creation and documents the survey-specific access and participation flow.
  - DEC-001 resolves add-combination authorization without assuming generic permission bits govern surveys.
  former_blocks:
  - D03
  - D09
  resolution_evidence:
  - maintainer-confirmed product intent
  - survey creation view deliberately omits the Group Permissions matrix
  - survey controller deliberately does not persist standard audience permissions
  - survey routes expose a feature-specific participation flow
  - shared middleware metadata is not treated as proof that the feature consumes the permission system
  - no application source, test, or in-app user-guide change
implementation_defects:
- id: IMP-001
  status: open
  severity: high
  owner: application maintainers
  out_of_scope_for_documentation_migration: true
  title: Built-in OIDC redirect default does not match the mounted callback route
  evidence:
  - src/app.ts mounts the users router at /users
  - src/routes/users.ts registers /oidc/callback inside that router
  - src/modules/settings.ts defaults to a URL ending in /user/oidc/callback
  impact: OIDC login can fail when the mismatched default is used unchanged.
  documentation_contract: Product documentation uses the corrected /users/oidc/callback contract and does not mention this transient defect.
  closes_when:
  - an explicitly authorized application change aligns the default with the mounted route or deliberately changes the route
  - tests and examples cover the selected behavior
  - D04 and D12 are re-verified if their documented contract changes
- id: IMP-003
  status: open
  severity: high
  owner: application maintainers
  out_of_scope_for_documentation_migration: true
  title: Password policy is not enforced consistently across registration and reset boundaries
  evidence:
  - src/public/js/core/password-validation.ts defines the intended minimum of eight characters, one letter, and one digit
  - src/views/users/register.pug loads the password validator, but src/controller/userController.ts checks only presence and equality
  - src/views/users/reset-password.pug declares only an eight-character HTML minimum and the reset controller checks only equality
  impact: A client bypass or the reset path can accept a password that does not meet the policy presented during registration.
  documentation_contract: D01 states one coherent policy for registration and reset and does not expose the enforcement inconsistency.
  closes_when:
  - one server-side validator enforces the complete policy for registration and password reset
  - registration and reset UI use the same validator and wording
  - automated tests cover every rule and both entry paths
- id: IMP-004
  status: open
  severity: high
  owner: application maintainers
  out_of_scope_for_documentation_migration: true
  title: Guest recovery is not reachable through the login page in an organization-sign-in-only deployment
  evidence:
  - src/routes/users.ts redirects GET /users/login to OIDC before rendering the page when local login is disabled
  - the guest-recovery form exists only in src/views/users/login.pug
  - GET /guest/recovery redirects back to /users/login
  impact: A guest with an email address can be unable to request their private links when the deployment disables local login.
  documentation_contract: D01 documents guest email recovery as an authentication-mode-independent capability and does not repeat the routing defect.
  closes_when:
  - guest recovery remains directly reachable when local login is disabled
  - invitation, login, and recovery routes preserve the intended return path
  - automated route tests cover local-only, mixed, and organization-sign-in-only deployments
- id: IMP-005
  status: open
  severity: medium
  owner: application maintainers
  out_of_scope_for_documentation_migration: true
  title: Guest profile settings expose a profile-deactivation action that rejects guest sessions
  evidence:
  - src/views/users/profile/view.pug renders Delete profile without checking whether the active profile belongs to a full account
  - src/routes/users.ts protects the profile-deletion routes with isAuthenticated rather than isLoggedIn
  impact: Guests see an action that redirects them away instead of performing the supported guest-account closure flow.
  documentation_contract: D01 directs guests to Delete account and assumes the inapplicable profile-deactivation action is not shown.
  closes_when:
  - the profile page hides or replaces Delete profile for guests
  - the guest account-closure path is covered by a rendered-view or route test
- id: IMP-006
  status: open
  severity: high
  owner: application maintainers
  out_of_scope_for_documentation_migration: true
  title: Deactivating the final full-account profile can complete deletion and then fail while selecting another profile
  evidence:
  - src/controller/userController.ts deletes the previous user when profile deactivation leaves no profiles
  - the profile-deletion route then unconditionally calls changeActiveProfile
  - changeActiveProfile throws when the deleted account has no remaining profile
  impact: The destructive operation can succeed while the user receives an error instead of a clean account-closure result.
  documentation_contract: D01 describes final-profile deactivation as a clean permanent account closure and does not expose the post-deletion failure.
  closes_when:
  - final-profile deactivation terminates or clears the session without attempting another profile selection
  - multi-profile and final-profile outcomes have route-level tests
- id: IMP-007
  status: open
  severity: high
  owner: application maintainers
  out_of_scope_for_documentation_migration: true
  title: Event registration-link creation ignores the submitted Uses value
  evidence:
  - src/views/modules/module_registration_links.pug exposes a Uses field with values greater than one
  - src/public/js/modules/reg-links.ts sends maxUses to the event links API
  - src/modules/database/services/EventService.ts stores and enforces maxUses
  - 'src/controller/eventController.ts creates every link with maxUses: 1'
  impact: A link configured for multiple late registrations is created as single-use.
  documentation_contract: D05 documents the coherent working contract in which Uses controls the allowed number of successful late registrations and does not mention the controller mismatch.
  closes_when:
  - the controller validates and forwards the requested positive whole-number maxUses value
  - route or integration tests cover single-use and multi-use links, exhaustion, expiry, and revocation
  - D05 is re-verified if the selected user-visible contract changes
- id: IMP-008
  status: open
  severity: critical
  owner: application maintainers
  out_of_scope_for_documentation_migration: true
  title: Event participant details are embedded in the page without an Access Participants rendering guard
  evidence:
  - src/controller/eventController.ts fetches the complete participant rows for every admitted event-page request
  - src/views/event/event-view.pug always serializes data.participants into participantsData
  - the visible Participants component and API are separately guarded by ACCESS_PARTICIPANTS
  impact: A profile without participant-list permission can receive names, available email addresses, dates, and dietary data in page source even when the visible participant section is hidden.
  documentation_contract: D05 states that participant details are available only with Access Participants and does not disclose or normalize the transient data-exposure defect.
  closes_when:
  - participant rows are not fetched or serialized unless the effective permissions include ACCESS_PARTICIPANTS or another explicitly reviewed need applies
  - rendered-view tests assert the absence of sensitive participant JSON for unauthorized profiles
  - the participant API and PDF permission tests remain aligned
- id: IMP-009
  status: open
  severity: high
  owner: application maintainers
  out_of_scope_for_documentation_migration: true
  title: Event post-deadline setting fields use inconsistent names in permission enforcement
  evidence:
  - src/views/event/event-dashboard.pug submits allowRegDateUpdatesAfterDeadline, allowRegCancelationAfterDeadline, and allowRegDietUpdateAfterDeadline
  - src/public/js/events.ts and src/controller/eventController.ts permission checks inspect different singular field names
  - src/controller/eventController.ts subsequently persists the submitted plural form fields
  impact: A crafted update can bypass the intended Edit Metadata or Manage Requirements checks for post-deadline policy switches.
  documentation_contract: D05 documents the intended permission boundary for each setting and does not repeat the enforcement inconsistency.
  closes_when:
  - view, browser, schema, permission checks, and persistence use one canonical field name per switch
  - route-level negative tests cover each switch for profiles missing the required permission
  - authorized updates remain covered
- id: IMP-010
  status: open
  severity: high
  owner: application maintainers
  out_of_scope_for_documentation_migration: true
  title: A late-registration token is not preserved through first-time guest onboarding
  evidence:
  - src/public/js/modules/reg-links.ts creates event URLs with the regToken query parameter
  - src/middleware/guestFlowFactory.ts redirects an anonymous event request to /event/:id/guest without carrying the query parameter
  - the guest registration POST redirects to the event page without restoring regToken
  impact: A new guest following a valid deadline-bypass link can lose the token before submitting the registration.
  documentation_contract: D05 documents late-registration links as usable through the normal account or guest entry flow and does not expose the redirect defect.
  closes_when:
  - the guest onboarding flow preserves and validates the event registration token across GET, POST, and final redirect
  - tests cover anonymous guest, existing guest, and full-account use after the binding deadline
  - invalid, expired, revoked, and consumed tokens remain rejected
- id: IMP-011
  status: open
  severity: high
  owner: application maintainers
  out_of_scope_for_documentation_migration: true
  title: Delegated invoice organizers can be rejected by the proof route's outer participant guard
  evidence:
  - src/routes/api/eventInvoices.ts protects the proof route first with requireEventParticipantAPI
  - requireEventParticipantAPI admits only the event owner or a registered event participant
  - src/controller/eventPoolController.ts then separately allows MANAGE_ASSIGNMENTS or the invoice submitter
  impact: A non-owner organizer with Access Admin and Manage Assignments can administer invoices but still be blocked from opening their proof unless the organizer is also registered for the event.
  documentation_contract: D06 documents the coherent working contract in which an entrusted invoice-pool organizer can inspect every invoice and proof and does not expose the guard-order mismatch.
  closes_when:
  - proof authorization admits the submitter or a profile with the required invoice-administration permission without first requiring event registration
  - route-level tests cover owner, delegated organizer, submitter, unrelated participant, and unrelated profile
  - D06 is re-verified if the selected access contract changes
- id: IMP-012
  status: open
  severity: high
  owner: application maintainers
  out_of_scope_for_documentation_migration: true
  title: Invoice submission and participant pool listing disagree about default-pool assignment
  evidence:
  - src/modules/database/services/EventInvoiceService.ts lists an open participant pool only when assignAll is true or an explicit assignment exists
  - src/controller/eventPoolController.ts also treats pool.isDefault as sufficient for invoice submission
  - default-pool registration is otherwise materialized by registerForDefaultPools when a new event registration is created
  impact: A crafted submission can be accepted for an existing registration that is not shown as assigned to the pool.
  documentation_contract: D06 states that a participant can submit only to an open pool that applies to all registrations or explicitly contains their registration.
  closes_when:
  - listing, form choices, and submission authorization use one assignment predicate
  - tests cover current registrations, future registrations added through a default pool, assign-all pools, explicit assignment, and unassigned rejection
- id: IMP-013
  status: open
  severity: high
  owner: application maintainers
  out_of_scope_for_documentation_migration: true
  title: Invoice proof cleanup does not cover every failed-submission and event-deletion path
  evidence:
  - multer writes the proof before controller validation and only the unsupported-MIME branch explicitly unlinks it
  - persistence or later validation failures can occur after upload without a common cleanup path
  - src/modules/database/services/EventService.ts deletes an event through database cascade but does not remove its proof files
  - retention cleanup can remove a proof only while its invoice row still exists
  impact: Sensitive proof files can remain on disk without a reachable invoice record or normal retention path.
  documentation_contract: D06 and D04 document a coherent lifecycle in which failed submissions and entity deletion do not leave inaccessible proof files behind, and do not normalize the cleanup defect.
  closes_when:
  - every upload failure after file creation removes the file
  - event or pool deletion removes associated proof files safely
  - integration tests cover validation failure, persistence failure, deletion, and retention without deleting files outside the configured invoice directory
- id: IMP-014
  status: open
  severity: high
  owner: application maintainers
  out_of_scope_for_documentation_migration: true
  title: Participant takeover updates do not independently enforce the pool's open state
  evidence:
  - src/views/modules/module_invoice_pool.pug exposes participant takeover controls only for open pools
  - src/controller/eventPoolController.ts updateTakeovers validates assignment and relationship rules but not pool.status
  - the participant takeover route does not add a separate closed-pool guard
  impact: A crafted request can alter takeover instructions for a closed pool, affecting a later recalculation despite the UI presenting the configuration as frozen.
  documentation_contract: D06 states that participant takeover changes are available only while the pool is open.
  closes_when:
  - participant takeover mutation rejects closed pools server-side
  - organizer correction behavior for a closed pool remains explicit and is applied only through the reviewed recalculation path
  - route-level tests cover open and closed participant requests plus authorized organizer correction
- id: IMP-015
  status: open
  severity: medium
  owner: application maintainers
  out_of_scope_for_documentation_migration: true
  title: Clearing the final explicit pool assignment does not remove stale takeovers and surcharges
  evidence:
  - src/modules/database/services/EventInvoiceService.ts updateAssignments replaces explicit assignment rows with the submitted registration IDs
  - when the submitted registration list is empty, the cleanup variable validIds falls back to every event registration instead of the empty effective assignment scope
  - takeover and surcharge cleanup therefore retains rows for registrations that are no longer assigned when the final assignment is cleared
  impact: Hidden takeover and surcharge records can survive an empty pool assignment and can become effective again after later reassignment or recalculation.
  documentation_contract: D06 states the coherent working contract in which removing a participant also removes adjustment records that are incompatible with the remaining assignment scope.
  closes_when:
  - takeover and surcharge cleanup derives from the effective assigned registration IDs, including an empty set
  - integration tests clear the final explicit assignment and verify that stale takeovers and surcharges are removed
  - tests also preserve adjustments for registrations that remain assigned
- id: IMP-016
  status: open
  severity: high
  owner: application maintainers
  out_of_scope_for_documentation_migration: true
  title: Editing a slot compares activity-slot-role mapping IDs with role IDs when deciding what to remove
  evidence:
  - src/modules/database/services/ActivityService.ts updateActivitySlotRoles loads ActivitySlotRole rows and their roles
  - the deletion filter checks roles.includes(r.id), where r.id is the mapping-row ID rather than r.roleId
  - the creation filter correctly compares the submitted values with r.roleId, so the two halves use different identifiers
  impact: Saving Roles for this slot can remove a role that should remain or fail to represent the selected role set reliably.
  documentation_contract: D07 documents the intended working behavior in which selected role chips are added or removed and Save persists the resulting role set.
  closes_when:
  - deletion compares submitted role IDs with the related role ID rather than the mapping-row ID
  - integration tests retain, remove, and add several role combinations while preserving assignments according to the selected contract
  - D07 is reverified only if the visible role-editing contract changes
- id: IMP-017
  status: open
  severity: medium
  owner: application maintainers
  out_of_scope_for_documentation_migration: true
  title: Initial activity-slot controls do not provide complete visible or programmatic field labels
  evidence:
  - src/public/js/activity-create.ts dynamically creates Title and Description fields with placeholders only
  - Start time and End time are time inputs whose placeholders are not a reliable visible or accessible label
  - the numeric Max participants input has neither a label nor a placeholder
  impact: A novice or assistive-technology user can have difficulty identifying the initial slot fields before creating the plan.
  documentation_contract: D07 names the intended fields Title, Description, Start time, End time, and Max participants without documenting the labeling defect.
  closes_when:
  - every dynamically generated initial-slot control has an associated visible label and accessible name
  - creation UI tests verify the labels for keyboard and assistive-technology use
  - duplicate/prefilled creation retains the same field contract
- id: IMP-018
  status: open
  severity: critical
  owner: application maintainers
  out_of_scope_for_documentation_migration: true
  title: The activity Participants tab and participant rows are not guarded by Access Participants
  evidence:
  - src/controller/activityController.ts builds participantList for every admitted activity-plan page request
  - src/views/activity/activity-view.pug shows the Participants tab whenever participantList is nonempty without checking ACCESS_PARTICIPANTS
  - the Schedule view separately checks ACCESS_PARTICIPANTS before rendering assignee names
  impact: A profile that may view the plan but lacks participant-list permission can receive names, attendance, assignment counts, requirements, and roles through the Participants tab.
  documentation_contract: D07 states that Participants appears only when participant data exists and the viewer has Access Participants, and does not normalize the transient privacy defect.
  closes_when:
  - participant rows are not fetched, serialized, or rendered without ACCESS_PARTICIPANTS or an explicitly reviewed equivalent authorization
  - rendered-view tests prove that unauthorized profiles receive neither the tab nor participant data
  - authorized participant review and schedule-name rendering remain aligned
- id: IMP-019
  status: open
  severity: high
  owner: application maintainers
  out_of_scope_for_documentation_migration: true
  title: Survey descriptions are not rendered correctly on the voting page
  evidence:
  - src/views/surveyor/survey-vote.pug creates a lines array but interpolates line and i without iterating over that array
  - the survey creation flow persists the description and the view controller returns the survey entity
  - existing E2E detail assertions do not check the description text
  impact: Participant instructions, date context, and an organizer-supplied response deadline can be absent from the voting page even though they were saved.
  documentation_contract: D09 describes the coherent working contract in which the saved description appears below the survey title and does not expose the template defect.
  closes_when:
  - the voting template renders every saved description line in order
  - rendered-view or E2E coverage checks both single-line and multiline descriptions
  - D09 is re-verified only if the visible description contract changes
- id: IMP-020
  status: open
  severity: medium
  owner: application maintainers
  out_of_scope_for_documentation_migration: true
  title: Survey duplication does not reliably prefill the description and week-of-month values
  evidence:
  - src/views/surveyor/survey-create.pug places the description in a textarea value attribute rather than its text content
  - src/public/js/survey-create.ts reads nth_week while SurveyCombination exposes nthWeek
  - the generic duplicate route supplies the original entity and SurveyCombination objects to the creation template
  impact: A duplicated survey can open with an empty description or incorrect ordinal selections, increasing the risk of publishing an unintended copy.
  documentation_contract: D09 states that Duplicate opens a prefilled title, description, and combination form while responses and the header image are not copied.
  closes_when:
  - duplicate and validation rerenders populate the textarea through its text content
  - duplicate combination rows read the canonical nthWeek property
  - browser or rendered-view tests verify title, description, every weekday, every ordinal, and the absence of copied responses and image data
- id: IMP-021
  status: open
  severity: medium
  owner: application maintainers
  out_of_scope_for_documentation_migration: true
  title: Survey routing retains nonfunctional event-scoping plumbing
  evidence:
  - src/routes/survey.ts configures the generic guest-flow router with addToEvent true
  - src/middleware/guestFlowFactory.ts accepts eventId and applies event-creation authorization for that mode
  - Survey has no event relation and surveyController.createEntity does not persist the injected event ID
  - the event dashboard survey section is commented out while an E2E case calls the query-driven flow event-scoped without checking a relationship
  impact: Internal routes and tests can imply that surveys become event-linked even though no relationship is stored or exposed in the product.
  documentation_contract: D05 and D09 treat surveys as standalone resources that are shared separately and do not appear in event-linked resource sections.
  closes_when:
  - survey creation no longer accepts or authorizes an unused eventId path
  - event-dashboard and E2E code use the same standalone survey contract
  - a future event-link feature, if deliberately introduced, receives its own product decision, persistence model, access rules, tests, and documentation
- id: IMP-022
  status: open
  severity: high
  owner: application maintainers
  out_of_scope_for_documentation_migration: true
  title: Packing-item title and capacity controls use permission checks that differ between rendering and mutation
  evidence:
  - src/views/packing/packing-view.pug renders title editing for EDIT_TITLE or ITEM_EDIT and capacity editing for EDIT_CAPACITY or ITEM_EDIT
  - src/routes/api/packing.ts protects the shared item-attribute mutation route with EDIT_META or ITEM_EDIT
  - src/public/js/packing.ts sends both title and maxAssignees changes through that shared route
  impact: A profile granted only the field-specific title or capacity permission can see an edit control but have the save rejected.
  documentation_contract: D10 documents the coherent working contract in which the field-specific edit grants shown by the page authorize the corresponding save operation.
  closes_when:
  - the item-attribute mutation checks the submitted field against the matching field-specific permission or uses separate field routes
  - negative and positive route tests cover EDIT_TITLE, EDIT_CAPACITY, EDIT_META, and ITEM_EDIT independently
  - the visible controls and server-side authorization use the same contract
- id: IMP-023
  status: open
  severity: medium
  owner: application maintainers
  out_of_scope_for_documentation_migration: true
  title: Packing-item creation passes position while persistence reads pos
  evidence:
  - src/controller/packingController.ts supplies position for initial and quick-added items
  - src/modules/database/services/PackingService.ts persists item.pos in both createPackingListTx and addPackingItems
  - subsequent reads and reorder operations use the pos column
  impact: Initial and newly added row ordering can be stored without the intended sequence until an explicit reorder occurs.
  documentation_contract: D10 states the coherent working contract in which creation order and later drag reordering are stored for the shared list.
  closes_when:
  - controllers and persistence use one canonical item-order property
  - integration tests verify initial multi-row order, quick-add order, duplicate order, and drag reorder persistence
  - D10 is re-verified only if the visible ordering contract changes
- id: IMP-024
  status: open
  severity: high
  owner: application maintainers
  out_of_scope_for_documentation_migration: true
  title: Everyone items can retain or receive hidden individual assignments
  evidence:
  - src/modules/database/services/PackingService.ts togglePackingItemRequiredByAll changes only the flag and does not reconcile existing PackingAssignment rows
  - the assignment service does not reject an item whose requiredByAll flag is true
  - src/views/packing/packing-view.pug hides individual assignee names and Take controls for Everyone rows
  - participant overview lookup still considers any retained PackingAssignment row
  impact: A row presented as a group-wide requirement can retain invisible individual responsibility, affect Your participation, and reveal old assignments again if All is disabled.
  documentation_contract: 'D10 treats Everyone as a non-assignment mode: no individual Take action, assignee list, assignment counter contribution, or participation-overview effect applies while it is enabled.'
  closes_when:
  - enabling Everyone removes or otherwise deactivates individual assignments atomically
  - assignment mutations reject Everyone items
  - tests cover conversion in both directions, participant counters, overview membership, and concurrent assignment attempts
- id: IMP-025
  status: open
  severity: medium
  owner: application maintainers
  out_of_scope_for_documentation_migration: true
  title: Post-creation packing-item capacity mutations do not enforce the creation-time positive-integer rule server-side
  evidence:
  - src/controller/packingController.ts preprocessCreate validates maxAssignees as an integer of at least one
  - quickAddItem converts the submitted value without a positive-integer validation boundary
  - updateItemAttr accepts maxAssignees through the generic field update without validating its type or range
  impact: Crafted requests can create or update an item with a capacity that breaks the documented assignment and open/full semantics.
  documentation_contract: 'D10 consistently requires Max # to be a whole number of at least one for creation, quick add, and editing.'
  closes_when:
  - one shared server-side capacity validator protects every packing-item creation and update path
  - route and integration tests reject zero, negative, fractional, nonnumeric, and missing values while accepting positive integers
- id: IMP-026
  status: open
  severity: medium
  owner: application maintainers
  out_of_scope_for_documentation_migration: true
  title: Drivers-list capacity mutations do not consistently enforce the positive whole-number and current-assignment boundary
  evidence:
  - src/views/drivers/drivers-view.pug supplies a numeric Max # input with min=1 for a new ride
  - src/controller/driversController.ts quickAddItem uses Number(maxAssignees) || 1, which does not reject negative or fractional values
  - updateItemAttr writes maxAssignees through a generic field update without validating its type, range, or relationship to the current assignment count
  impact: Crafted or inconsistent updates can produce capacities that break the documented open, full, and assignment semantics or place a row below its visible passenger count.
  documentation_contract: 'D11 requires Max # to be a whole number of at least one and requires passengers to be moved or removed before lowering it below the current assignment count.'
  closes_when:
  - one shared server-side validator protects ride creation and every capacity-update path
  - capacity cannot be lowered below the current assignment count without an explicit, reviewed reconciliation operation
  - route and integration tests reject zero, negative, fractional, nonnumeric, and below-assignment values while accepting valid positive integers
- id: IMP-027
  status: open
  severity: high
  owner: application maintainers
  out_of_scope_for_documentation_migration: true
  title: Drivers-list participation lookup requires a profile to be both a driver and a passenger
  evidence:
  - src/modules/database/services/DriverService.ts getDriversListByParticipant combines an assignment existence predicate with a driver-row ownership predicate using AND
  - src/controller/userController.ts uses that result for the drivers-list entries under Your participation
  - tests/integration/controller-smoke-workflows.spec.ts exercises only a profile that both creates a row and assigns itself, so driver-only and passenger-only participation are not covered
  impact: A profile that only offers a ride or only takes a passenger place can be absent from the participation collection even though it participates in the list.
  documentation_contract: D11 treats either offering a ride or taking a passenger place as drivers-list participation for the active profile.
  closes_when:
  - the participation query includes a list when the profile owns at least one ride row OR has at least one passenger assignment
  - tests cover driver-only, passenger-only, both, neither, and repeated-row cases
  - Your overview continues to deduplicate the same list when both predicates match
- id: IMP-028
  status: open
  severity: medium
  owner: application maintainers
  out_of_scope_for_documentation_migration: true
  title: Drivers-list Take and Remove controls are rendered without the Access View action guard used by the API
  evidence:
  - src/views/drivers/drivers-view.pug renders Take or Remove from assignment and capacity state without checking ACCESS_VIEW
  - src/routes/api/drivers.ts protects both assignment mutations with requirePermissionApi for ACCESS_VIEW
  - standalone page admission accepts any active profile even when that profile has no effective Access View grant
  impact: A profile can be shown an assignment control that the server rejects, making access and permission behavior appear inconsistent.
  documentation_contract: D11 states that Take and Remove are available only when the active profile has effective Access View permission.
  closes_when:
  - the rendered controls and the assignment API use the same authorization predicate
  - browser or rendered-view tests cover admitted profiles with and without Access View
  - event-participant admission remains distinct from assignment authorization
- id: IMP-029
  status: open
  severity: high
  owner: application maintainers
  out_of_scope_for_documentation_migration: true
  title: The active recommendation schedule does not render server warnings or skipped-operation results
  evidence:
  - src/public/js/activity.ts initializes activity-recommendations-schedule.ts as the active recommendation interface
  - activity-recommendations-schedule.ts stores warnings returned by the recommendation endpoint but no active renderer consumes ActivityRecommendationsState.getWarnings()
  - the apply endpoint returns applied, skipped, and warning details, while the active interface ignores the response body and displays only a generic success message before reload
  - the older unused activity-recommendations.ts module contains warning rendering that is not connected to the active schedule view
  impact: An organizer can approve a blocked operation and see it omitted after saving without the intended row-level reason or skipped count.
  documentation_contract: D08 states that validation warnings and skipped operations are surfaced for organizer review after Save changes.
  closes_when:
  - the active schedule view renders current warning reasons beside the affected operation
  - the Save changes result reports the applied and skipped counts before or after reload
  - frontend and integration tests cover attendance, overlap, capacity, named-role, stale-source, and reciprocal-swap blocking
- id: IMP-030
  status: open
  severity: medium
  owner: application maintainers
  out_of_scope_for_documentation_migration: true
  title: The active recommendation schedule does not observe automatically queued binding-deadline generation
  evidence:
  - src/controller/activityController.ts returns autoGenerationJob when Required mode has a past binding deadline and no recommendation history
  - src/public/js/activity.ts initializes activity-recommendations-schedule.ts for the active page
  - activity-recommendations-schedule.ts ignores autoGenerationJob when loading recommendations and therefore does not poll the queued job
  - the older unused activity-recommendations.ts module contains the missing autoGenerationJob polling behavior
  impact: The server can queue the initial post-deadline recommendation calculation without the active page showing progress or reloading its result.
  documentation_contract: D08 treats automatic initial post-deadline generation as a visible queued workflow that completes into the review schedule.
  closes_when:
  - the active schedule detects autoGenerationJob, shows its status, polls it, and reloads terminal results
  - stale, failed, and timed-out jobs produce actionable visible messages
  - frontend or E2E tests cover the first post-deadline load with no recommendation history
