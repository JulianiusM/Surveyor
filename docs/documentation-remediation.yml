quality_gates:
  structural:
  - Fail CI on broken relative Markdown links.
  - Fail when a documented repository path does not exist, except allowlisted illustrative paths.
  - Parse every npm run reference and verify the script exists in package.json.
  - Verify the release bundle contains every in-app help document.
  - Reject forbidden stale terms unless explicitly marked historical.
  forbidden_stale_terms:
  - ranked-choice
  - tests/backend
  - tests/api
  - requireLogin
  - requirePerm
  - MSW
  - Testing Library
  - guest links cannot be recovered
  - Dashboard → … → + Create
  - Skills or qualifications in the activity role editor
  - Requirements Tab as an activity-plan navigation label
  - Double-click Driver name as a drivers-list edit instruction
  - Participants described as drivers plus passengers
  - Include contact info in description as drivers-list privacy guidance
  generated_references:
  - Permission bits and presets from src/modules/lib/permissions.ts.
  - Configuration key/type/default/precedence table from src/modules/settings.ts.
  - Test-directory/spec inventory from the repository tree.
  - Route and package-script inventories where practical.
  semantic:
  - Local registration help mentions email activation.
  - Guest recovery help identifies email as the recovery key and is reachable.
  - Creation instructions use the navbar New label.
  - Getting Started requires email activation before the first local login and never promises automatic login after registration.
  - Registration and password-reset tasks state at least eight characters, one letter, one digit, and matching entries.
  - Guest help states that email enables recovery, Request access can return several guest accounts, and guests can use Your overview.
  - Profile help distinguishes account and profile identities and covers 24-hour migration, deactivation, and account deletion consequences.
  - Dashboard help mentions participating and administrable entities.
  - Permission docs state that all applicable grants are combined.
  - Permission docs explicitly exclude surveys and do not use survey permission recipes.
  - Permission docs state that Guest grants apply to both guest-backed and full-account-backed active profiles.
  - Permission presets replace one matrix section rather than adding to its current selection.
  - Generated permission tables contain every current PERM key and DEFAULT_PERM preset with source-matching values and membership.
  - Survey docs present recurring monthly weekday patterns as the primary use case, one named month as secondary, and exact-date polling as a different optimization.
  - Survey docs do not invent a Group Permissions creation step.
  - Survey docs state that every participant admitted to the voting page may add a date combination.
  - Drivers help defines Participants as unique people assigned to at least one driver row and explains list-wide deduplication.
  - Drivers help states that Driver is profile-derived and read-only in the list, while Max # counts passenger places and excludes the driver.
  - Drivers help distinguishes Participants, Drivers, open, empty, raw assignments, and capacity.
  - Drivers help conditions guest and event-linked actions on admission and permissions and warns that names and descriptions are visible to every admitted viewer.
  - Invoice-pool help distinguishes invoice closure, pool closure, recalculation, and manual settlement.
