run_protocol:
- Enforce the documentation-only change boundary before editing; document deliberate feature exceptions, isolate transient defects in migration controls, and write product documentation for the intended current working contract.
- Select exactly one work package whose dependencies are done and whose status is ready.
- Read only the package documents, feature-specific source anchors, decisions, and dependent canonical references.
- Reproduce every finding against the current source; close obsolete findings and record any newly discovered finding without
  expanding implementation scope.
- Resolve any blocking behavior decision before writing authoritative instructions, and do not infer uniformity from peer features alone.
- Change the smallest coherent document set and avoid duplicating volatile facts.
- Run global structural gates plus the package-specific semantic/task tests.
- Record verified commit/archive fingerprint, date, changed files, closed/new finding IDs, decisions, and test evidence.
- Mark the package done only when every acceptance criterion has evidence; otherwise leave it in progress with explicit remaining
  criteria.
- Re-open dependent packages whenever a source anchor or documented behavior changes.
